<!DOCTYPE html>
<html lang="en" style="background:#000000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>APEX — UAP HERO FACE (the website wallpaper, with the clock in the black hole)</title>
<!--
  APEX — UAP HERO FACE (Nov 11, 2026). Owner's direction (Nov 11,
  22:44 EST): the UAP watch face uses the ACTUAL WALLPAPER OFF OUR
  WEBSITE — hero-graphic faces are made from actual hero graphics
  we use, with a big digital clock or a big analog face in it,
  whichever looks appropriate; "you could make a clock face out of
  [the graphic] in the broader mural hero graphic."

  THE PLATE IS THE WEBSITE'S OWN WALLPAPER. isawauap.com's sky is
  not a picture file — the site draws its wallpaper live on a
  canvas (the "LASER BETTAFISH" sky: a black hole swallowing
  spiral galaxies, a triangle UAP crossing with its beam, saucers,
  a little green mantis being on a rock, shooting stars). The
  scene code below — palette, Galaxy, the black hole, the
  swallowed galaxy, the triangle, the saucers, the mantis, the
  meteors, the starfield — is that wallpaper's own code, carried
  over from the site's build of record
  (isawauap-live-wallpaper-2026-11-09.html, the front door for
  isawauap.com). Nothing here is a generated lookalike.

  SQUARE LAYOUT (shape-at-purchase: SQUARE, 400x400, LOKMAT
  APPLLP class). Per the estate's face practice, per-shape
  layouts are computed from measured pixels — geometry computed,
  never stretched. The LAYOUT block below holds the only numbers
  that moved from the site's wide-screen build: the black hole
  sits upper-right at (288,102) with R=54, sized so its
  accretion rings stay on the glass; the two free galaxies are
  scaled to the square stage. Every element, colour and motion
  is the site's own.

  THE CLOCK (Face Law 1): an ANALOG face set INTO the black
  hole — the mural's natural centre, and the owner's named
  example. Hands ride the hole's centre post: white hour, cyan
  minute, amber second, all called colours from the site's
  palette, read against the hole's own pure-black event-horizon
  disc (the graphic's own dark region — no wash, no layered
  translucency over the plate). Twelve tick marks ring the
  inside of the horizon. A big DIGITAL readout rides in a solid
  site-card plate (the site's own card colours: #05070a fill,
  #1d3a44 line) low on the glass for an exact read at a glance.

  TIME BASE: the monotonic sweep law — displayed time is an
  accumulated base advanced by rAF deltas CLAMPED to 50 ms;
  a gap over 500 ms re-primes ONE nominal 16.7 ms step; raw rAF
  timestamps never drive the hands. In normal running the deltas
  are ~16.7 ms and the clock tracks wall time; under throttling
  it lags a step rather than jumping.

  MOTION FROM FIRST PAINT — no REST / observe governor.
  Battery care is a DIM-ONLY overlay after 60 s idle (motion
  never stops); any touch or tap wakes it.

  BENCH SURFACE: window.__uaphero carries { ready, frames,
  holeX, holeY, holeR, digital, secondAngle, minuteAngle,
  hourAngle, dimmed } for the proof harness.
-->
<style>
  :root{
    --void:#000000; --ink:#ffffff; --cyan:#22e6ff; --teal:#19f0c8;
    --magenta:#ff3df0; --green:#52ff5e; --amber:#ffb52e; --violet:#9a6bff;
    --card:#05070a; --line:#1d3a44;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--void);width:100%;height:100%;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--void)}
  canvas{display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="sky" width="400" height="400" aria-hidden="true"></canvas></div>
<script>
(function(){
  "use strict";

  /* ============ THE SITE'S PALETTE (isawauap.com, verbatim) ============ */
  var PAL = { cyan:"#22e6ff", teal:"#19f0c8", magenta:"#ff3df0",
              green:"#52ff5e", amber:"#ffb52e", violet:"#9a6bff", white:"#ffffff" };
  var CARD = "#05070a", LINE = "#1d3a44";

  /* ============ SQUARE LAYOUT (the only numbers that moved) ============ */
  var LAYOUT = {
    holeX: 288, holeY: 102, holeR: 54,      /* the black hole = the clock */
    bigX: 74,  bigY: 104,  bigR: 92,        /* magenta galaxy, upper left */
    smallX: 206, smallY: 256, smallR: 58,   /* cyan galaxy, centre low */
    plateX: 200, plateY: 371, plateW: 196, plateH: 50  /* digital card */
  };

  var cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  var W = 400, H = 400;
  (function fit(){
    var s = Math.min(window.innerWidth||W, window.innerHeight||H);
    if (s > 0 && s !== W) { cv.style.width = s+"px"; cv.style.height = s+"px"; }
  })();

  /* ============ WEBSITE WALLPAPER CODE (from here to the CLOCK
     banner, the scene is the site's own build, carried verbatim
     except the LAYOUT placements named above) ============ */

  /* starfield */
  var stars=[];
  function seedStars(){
    stars=[];
    var n = Math.floor(W*H/4500);
    for(var i=0;i<n;i++) stars.push({x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.3+0.3, p:Math.random()*6.28, s:0.4+Math.random()*1.2});
  }

  /* a spiral galaxy: neon wireframe arms of dots, rotating as one body */
  function Galaxy(x,y,R,arms,colour,dir,speed){
    this.x=x; this.y=y; this.R=R; this.arms=arms; this.colour=colour;
    this.dir=dir; this.speed=speed; this.a=Math.random()*6.28; this.pts=[];
    for(var a=0;a<arms;a++) for(var i=0;i<46;i++){
      var t=i/46, ang=a*(6.28/arms)+t*3.4, rad=t*R;
      this.pts.push({ang:ang, rad:rad, sz:2.2*(1-t)+0.5, off:Math.random()*4-2});
    }
  }
  Galaxy.prototype.draw=function(dt){
    this.a += this.dir*this.speed*dt;
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.a);
    ctx.fillStyle=this.colour; ctx.shadowColor=this.colour; ctx.shadowBlur=6;
    for(var i=0;i<this.pts.length;i++){ var p=this.pts[i];
      ctx.beginPath();
      ctx.arc(Math.cos(p.ang)*p.rad+p.off, Math.sin(p.ang)*p.rad*0.62+p.off, p.sz, 0, 6.29);
      ctx.fill(); }
    ctx.restore();
    ctx.save(); ctx.translate(this.x,this.y);
    var g=ctx.createRadialGradient(0,0,0,0,0,this.R*0.22);
    g.addColorStop(0,"rgba(255,255,255,0.9)"); g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,this.R*0.22,0,6.29); ctx.fill();
    ctx.restore();
  };

  /* the black hole: event horizon + swirling accretion ring, upper right.
     Two small galaxies spiral inward toward it and respawn at the rim. */
  var hole={x:0,y:0,R:64,spin:0};
  function drawHole(dt,t){
    hole.x=LAYOUT.holeX; hole.y=LAYOUT.holeY; hole.R=LAYOUT.holeR; hole.spin+=dt*0.7;
    ctx.save(); ctx.translate(hole.x,hole.y);
    var glow=ctx.createRadialGradient(0,0,hole.R*0.4,0,0,hole.R*3.1);
    glow.addColorStop(0,"rgba(154,107,255,0.34)");
    glow.addColorStop(0.55,"rgba(255,61,240,0.10)");
    glow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,hole.R*3.1,0,6.29); ctx.fill();
    ctx.rotate(hole.spin);
    for(var ring=0; ring<3; ring++){
      ctx.beginPath();
      ctx.strokeStyle = ring===1 ? PAL.amber : PAL.violet;
      ctx.lineWidth = 2.4-ring*0.5; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=10;
      var rr=hole.R*(1.18+ring*0.30);
      ctx.ellipse(0,0,rr,rr*0.34,(ring%2? -0.22:0.22), ring*1.3, ring*1.3+4.4);
      ctx.stroke();
    }
    ctx.rotate(-hole.spin*2.3);
    ctx.fillStyle=PAL.white; ctx.shadowColor=PAL.magenta; ctx.shadowBlur=8;
    for(var i=0;i<26;i++){ var an=i/26*6.28, rad=hole.R*(1.5+((i*37)%40)/60);
      ctx.beginPath(); ctx.arc(Math.cos(an)*rad, Math.sin(an)*rad*0.34, 1.6, 0, 6.29); ctx.fill(); }
    ctx.restore();
    ctx.save(); ctx.translate(hole.x,hole.y);
    ctx.fillStyle="#000"; ctx.shadowColor=PAL.violet; ctx.shadowBlur=22;
    ctx.beginPath(); ctx.arc(0,0,hole.R*0.82,0,6.29); ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle=PAL.white; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(0,0,hole.R*0.82,0,6.29); ctx.stroke();
    ctx.restore();
  }

  /* a galaxy being swallowed: spirals in toward the hole, respawns wide */
  function Swallowed(x,y){
    this.reset=function(){ this.th=Math.random()*6.28; this.d=340+Math.random()*160;
      this.g=new Galaxy(0,0,42,2,PAL.teal,1,0.25); };
    this.reset(); this.d=200+Math.random()*300;
  }
  Swallowed.prototype.draw=function(dt){
    this.d-=dt*16; this.th+=dt*0.55;
    if(this.d<86) this.reset();
    var x=hole.x+Math.cos(this.th)*this.d, y=hole.y+Math.sin(this.th)*this.d*0.62;
    ctx.save(); ctx.translate(x,y);
    var s=Math.max(0.25, this.d/420); ctx.scale(s,s); ctx.translate(-x,-y);
    this.g.x=x; this.g.y=y; this.g.draw(dt);
    ctx.restore();
  };

  /* triangle UAP: neon wireframe triangle, three corner lights, beam.
     Flies back and forth across the sky, banking at the turns. */
  var tri={x:120,y:150,vx:64,dir:1,beam:0};
  function drawTri(dt,t){
    tri.x+=tri.vx*tri.dir*dt;
    if(tri.x>W-90){tri.dir=-1} if(tri.x<90){tri.dir=1}
    var y=tri.y+Math.sin(t*0.7)*16, x=tri.x;
    tri.beam=(Math.sin(t*0.45)>0.55)?1:0;
    ctx.save(); ctx.translate(x,y); ctx.scale(tri.dir,1);
    if(tri.beam){ var bg=ctx.createLinearGradient(0,10,0,120);
      bg.addColorStop(0,"rgba(34,230,255,0.30)"); bg.addColorStop(1,"rgba(34,230,255,0)");
      ctx.fillStyle=bg; ctx.beginPath();
      ctx.moveTo(-8,10); ctx.lineTo(8,10); ctx.lineTo(30,120); ctx.lineTo(-30,120);
      ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle=PAL.cyan; ctx.lineWidth=2; ctx.shadowColor=PAL.cyan; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(30,14); ctx.lineTo(-30,14); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(14,8); ctx.lineTo(-14,8); ctx.closePath(); ctx.stroke();
    var cols=[PAL.magenta,PAL.amber,PAL.green];
    [[0,-20],[30,14],[-30,14]].forEach(function(p,i){
      ctx.fillStyle=cols[i]; ctx.shadowColor=cols[i];
      ctx.beginPath(); ctx.arc(p[0],p[1],3.4+Math.sin(t*5+i)*0.8,0,6.29); ctx.fill(); });
    ctx.restore();
  }

  /* saucer: neon wireframe ellipse + dome, drifting slow, lights blinking */
  function Saucer(x,y,c,s){ this.x=x; this.y=y; this.c=c; this.s=s; this.ph=Math.random()*6.28; }
  Saucer.prototype.draw=function(dt,t){
    this.x+=dt*9*this.s; if(this.x>W+70) this.x=-70; if(this.x<-70) this.x=W+70;
    var y=this.y+Math.sin(t*0.9+this.ph)*7;
    ctx.save(); ctx.translate(this.x,y);
    ctx.strokeStyle=this.c; ctx.lineWidth=1.8; ctx.shadowColor=this.c; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.ellipse(0,0,34,9,0,0,6.29); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-6,15,8,0,3.14,6.29); ctx.stroke();
    for(var i=-2;i<=2;i++){ ctx.fillStyle=(Math.sin(t*4+i)>0)?PAL.amber:PAL.magenta;
      ctx.shadowColor=ctx.fillStyle; ctx.beginPath(); ctx.arc(i*11,3,2.2,0,6.29); ctx.fill(); }
    ctx.restore();
  };

  /* little green mantis being: neon pictograph on a wireframe rock, lower left.
     Thin body, big triangular head, long arms — one arm waves. */
  function drawMantis(t){
    var x=W*0.10, y=H*0.80;
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle=PAL.violet; ctx.lineWidth=1.6; ctx.shadowColor=PAL.violet; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.ellipse(0,44,74,16,0,0,6.29); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,40,50,10,0,0,6.29); ctx.stroke();
    ctx.strokeStyle=PAL.green; ctx.shadowColor=PAL.green; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(0,38); ctx.lineTo(0,4); ctx.stroke();            /* body */
    ctx.beginPath(); ctx.moveTo(0,34); ctx.lineTo(-11,46); ctx.lineTo(-13,58); ctx.stroke(); /* leg L */
    ctx.beginPath(); ctx.moveTo(0,34); ctx.lineTo(11,46); ctx.lineTo(13,58); ctx.stroke();  /* leg R */
    ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(-16,2); ctx.lineTo(-22,10); ctx.stroke(); /* arm L */
    var wv=Math.sin(t*2.2)*7;                                                        /* waving arm */
    ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(16,-2+wv); ctx.lineTo(23,-12+wv); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(11,-2); ctx.lineTo(-11,-2); ctx.closePath(); ctx.stroke(); /* head */
    ctx.fillStyle=PAL.green;
    ctx.beginPath(); ctx.ellipse(-5,-8,3.4,2.1,-0.5,0,6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,-8,3.4,2.1,0.5,0,6.29); ctx.fill();
    ctx.restore();
  }

  /* shooting stars */
  var meteors=[];
  function spawnMeteor(){ meteors.push({x:Math.random()*W*0.8+W*0.15, y:Math.random()*H*0.3,
    vx:-(260+Math.random()*220), vy:150+Math.random()*120, life:1}); }
  setInterval(function(){ if(!document.hidden && Math.random()<0.6) spawnMeteor(); }, 2600);

  var big=new Galaxy(0,0,LAYOUT.bigR,3,PAL.magenta,-1,0.05);
  var small=new Galaxy(0,0,LAYOUT.smallR,2,PAL.cyan,1,0.08);
  var swallowed=new Swallowed();
  var saucers=[new Saucer(200,110,PAL.teal,1), new Saucer(600,300,PAL.magenta,-1), new Saucer(420,90,PAL.violet,1)];
  saucers[1].x=320; saucers[2].x=240;

  /* ============ THE CLOCK — set into the black hole ============ */
  var epoch0 = Date.now();       /* wall time at first paint */
  var acc = 0;                   /* accumulated monotonic ms (sweep law) */
  var lastNow = -1;
  var bench = { ready:false, frames:0, holeX:LAYOUT.holeX, holeY:LAYOUT.holeY,
                holeR:LAYOUT.holeR, digital:"", secondAngle:0, minuteAngle:0,
                hourAngle:0, dimmed:false };
  window.__uaphero = bench;

  function pad2(n){ return (n<10?"0":"")+n; }

  function drawClock(tNow){
    var h=tNow.getHours(), m=tNow.getMinutes(), s=tNow.getSeconds()+tNow.getMilliseconds()/1000;
    var sA=(s/60)*6.2831853, mA=((m+s/60)/60)*6.2831853, hA=(((h%12)+m/60)/12)*6.2831853;
    bench.digital = pad2(h)+":"+pad2(m)+":"+pad2(Math.floor(s));
    bench.secondAngle=sA; bench.minuteAngle=mA; bench.hourAngle=hA;

    var cx=LAYOUT.holeX, cy=LAYOUT.holeY, R=LAYOUT.holeR;
    ctx.save(); ctx.translate(cx,cy);
    /* tick ring inside the horizon: 12 ticks, quarters longer */
    ctx.strokeStyle=PAL.white; ctx.shadowColor=PAL.white; ctx.shadowBlur=4;
    for(var i=0;i<12;i++){
      var a=i/12*6.2831853, q=(i%3===0);
      ctx.lineWidth=q?3:1.8;
      ctx.beginPath();
      ctx.moveTo(Math.sin(a)*R*0.66, -Math.cos(a)*R*0.66);
      ctx.lineTo(Math.sin(a)*R*(q?0.80:0.76), -Math.cos(a)*R*(q?0.80:0.76));
      ctx.stroke();
    }
    /* hands on the centre post */
    function hand(ang,len,w,col){
      ctx.save(); ctx.rotate(ang);
      ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=7; ctx.lineWidth=w;
      ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(0,len*0.16); ctx.lineTo(0,-len); ctx.stroke();
      ctx.restore();
    }
    hand(hA, R*0.40, 5.5, PAL.white);
    hand(mA, R*0.60, 4, PAL.cyan);
    hand(sA, R*0.68, 2, PAL.amber);
    /* the centre post pin */
    ctx.fillStyle=PAL.white; ctx.shadowColor=PAL.violet; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.arc(0,0,4.2,0,6.29); ctx.fill();
    ctx.restore();

    /* the digital card — the site's own card, low on the glass */
    var px=LAYOUT.plateX-LAYOUT.plateW/2, py=LAYOUT.plateY-LAYOUT.plateH/2;
    ctx.save();
    ctx.fillStyle=CARD; ctx.strokeStyle=LINE; ctx.lineWidth=1.5; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.rect(px,py,LAYOUT.plateW,LAYOUT.plateH); ctx.fill(); ctx.stroke();
    ctx.fillStyle=PAL.teal; ctx.shadowColor=PAL.teal; ctx.shadowBlur=8;
    ctx.font="800 34px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(bench.digital, LAYOUT.plateX, LAYOUT.plateY+1);
    ctx.restore();
  }

  /* ============ DIM-ONLY idle overlay (battery care) ============ */
  var lastTouch = performance.now();
  function wake(){ lastTouch = performance.now(); }
  window.addEventListener("pointerdown", wake, {passive:true});
  window.addEventListener("touchstart", wake, {passive:true});

  /* ============ FRAME LOOP — scene first, then the clock ============ */
  var last=performance.now();
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    var t=now/1000;

    /* monotonic sweep-law time base for the clock */
    if (lastNow < 0) lastNow = now;
    var d = now - lastNow; lastNow = now;
    if (d > 500) d = 16.7; else if (d > 50) d = 50; else if (d < 0) d = 0;
    acc += d;
    var tNow = new Date(epoch0 + acc);

    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){ var st=stars[i];
      ctx.globalAlpha=0.45+0.4*Math.sin(t*st.s+st.p);
      ctx.fillStyle=PAL.white; ctx.fillRect(st.x,st.y,st.r,st.r); }
    ctx.globalAlpha=1;
    big.x=LAYOUT.bigX; big.y=LAYOUT.bigY; big.draw(dt);
    small.x=LAYOUT.smallX; small.y=LAYOUT.smallY; small.draw(dt);
    drawHole(dt,t);
    swallowed.draw(dt);
    drawTri(dt,t);
    for(var j=0;j<saucers.length;j++) saucers[j].draw(dt,t);
    drawMantis(t);
    for(var mm=meteors.length-1;mm>=0;mm--){ var me=meteors[mm];
      me.x+=me.vx*dt; me.y+=me.vy*dt; me.life-=dt*0.9;
      if(me.life<=0){ meteors.splice(mm,1); continue; }
      var grad=ctx.createLinearGradient(me.x,me.y,me.x-me.vx*0.14,me.y-me.vy*0.14);
      grad.addColorStop(0,"rgba(255,255,255,"+(0.9*me.life)+")");
      grad.addColorStop(1,"rgba(255,255,255,0)");
      ctx.strokeStyle=grad; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(me.x,me.y);
      ctx.lineTo(me.x-me.vx*0.14, me.y-me.vy*0.14); ctx.stroke(); }

    drawClock(tNow);

    bench.dimmed = (now - lastTouch > 60000);
    if (bench.dimmed){
      ctx.fillStyle="rgba(0,0,0,0.45)"; ctx.fillRect(0,0,W,H);
    }
    bench.frames++; bench.ready = true;
    requestAnimationFrame(frame);
  }
  seedStars();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
