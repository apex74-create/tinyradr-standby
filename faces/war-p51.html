<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX — War Edition · P51 Cowling · The Propeller Wing</title>
<style>
  /* WAR EDITION — P51 COWLING FACE v1 (face-graphics refinement,
     Nov 20, 2026) — THE PROPELLER WING, war seat. Nose-on: the
     P51's narrower cowling over its V-12 (exhaust stubs at the
     cheeks, not a radial's cylinder ring — the two war seats are
     different machines, drawn differently), straight tapered wings,
     a four-blade propeller, the pointed spinner, and the chin
     intake scoop under the cowling. The INGEST AT THE VIEWER runs
     here as on the Corsair seat: a random object from the pool
     (orb / triangle / saucer / bird) closes straight at the motor
     and is swallowed into the cowling as particles — random object,
     random wait (6–15 s).
     THE NOSE CONE — THE PHOTOREALISTIC LINE (Nov 20, 2026, owner's
     order): the face now OPENS on a photorealistic nose-on view,
     GENERATED by the house generation station from pooled known
     photographs of the real aircraft (pool + provenance in the
     face-refinement work files). It is a generation from
     photographic references — the record never calls it a
     photograph. Touch flips to the original house-drawn view,
     kept whole below; touch again returns. Colour CALLED from
     the palette — solids, never layered. Angles are pure
     functions of absolute time; the face runs from first paint
     (the Nov 10 governor law). */
  :root{
    --void:#05060a; --plate:#0b0d12;
    --brass:#c9a227; --brass-hi:#e8c85a; --brass-lo:#8a6d1c;
    --steel:#9fb4c0; --steel-hi:#d7e6ee; --steel-lo:#5d7180;
    --laser:#57e6ff; --digit:#ffb52e; --cream:#f5ead2; --panel:#000000;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void)}
  body{font-family:ui-monospace,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none}
  #face{position:absolute;inset:0;background:var(--plate)}
  #boreWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:92vmin;height:92vmin}
  #photoWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:92vmin;height:92vmin;display:none}
  #photoWrap img{width:100%;height:100%;object-fit:cover;border-radius:3vmin;
    border:2px solid var(--brass-lo);display:block}
  .lbl{z-index:2} #readPanel{z-index:2} #stateLamp{z-index:2} #photoWrap{z-index:1}
  svg{width:100%;height:100%;display:block}
  .lbl{position:absolute;width:100%;text-align:center;color:var(--cream);
    letter-spacing:.22em;font-weight:700}
  #motorLbl{top:2.2vmin;font-size:3.4vmin;color:var(--brass-hi)}
  #specLbl{top:6.4vmin;font-size:2.0vmin;color:var(--steel)}
  #readPanel{position:absolute;left:50%;bottom:3.2vmin;transform:translateX(-50%);
    background:var(--panel);border:2px solid var(--brass);border-radius:1.6vmin;
    padding:0.8vmin 3.4vmin 1.2vmin;text-align:center}
  #clock{font-size:11.5vmin;font-weight:800;color:var(--digit);line-height:1;
    letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #dateLine{font-size:2.6vmin;color:var(--cream);letter-spacing:.18em;margin-top:0.6vmin}
  #stateLamp{position:absolute;right:3vmin;bottom:3.4vmin;font-size:2.0vmin;
    color:var(--laser);letter-spacing:.14em;text-align:right}
</style>
</head>
<body>
<div id="face">
  <div id="motorLbl" class="lbl">WAR EDITION · P51</div>
  <div id="specLbl" class="lbl">THE PROPELLER WING · NOSE-ON · INTAKE AT THE VIEWER</div>
  <div id="boreWrap"><svg id="bore" viewBox="0 0 400 400" aria-label="P51 cowling, nose-on, tapered wings, four-blade propeller turning"></svg></div>
  <div id="photoWrap"><img id="photoImg" src="war-p51-photo.jpg" alt="Photorealistic line: P51 Mustang nose-on, generated from pooled photographs"></div>
  <div id="readPanel"><div id="clock">--:--</div><div id="dateLine">—</div></div>
  <div id="stateLamp">LIVE</div>
</div>

<script>
"use strict";
var PAL = { brass:"#c9a227", brassHi:"#e8c85a", brassLo:"#8a6d1c",
  steel:"#9fb4c0", steelHi:"#d7e6ee", steelLo:"#5d7180",
  laser:"#57e6ff", void:"#05060a" };
var NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent){
  var n = document.createElementNS(NS, name);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function polar(cx, cy, r, deg){
  var a = (deg-90) * Math.PI/180;
  return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
}
var svg = document.getElementById("bore");
var CX = 200, CY = 188;
/* straight tapered wings at the shoulders */
el("polygon", {points:"102,168 14,190 10,178 100,148", fill:"rgba(95,113,128,0.30)",
  stroke:PAL.steel, "stroke-width":1.8, "stroke-linejoin":"round"}, svg);
el("polygon", {points:"298,168 386,190 390,178 300,148", fill:"rgba(95,113,128,0.30)",
  stroke:PAL.steel, "stroke-width":1.8, "stroke-linejoin":"round"}, svg);
/* the cowling: a tall narrow ellipse over the V-12 */
el("ellipse", {cx:CX, cy:CY, rx:106, ry:124, fill:PAL.void, stroke:PAL.brassLo, "stroke-width":6}, svg);
el("ellipse", {cx:CX, cy:CY, rx:98, ry:116, fill:"none", stroke:PAL.brass, "stroke-width":2}, svg);
el("ellipse", {cx:CX, cy:CY, rx:84, ry:100, fill:"none", stroke:PAL.steelLo, "stroke-width":1.4}, svg);
/* exhaust stubs at the cheeks — six a side, the V-12's signature */
[-1, 1].forEach(function(sgn){
  for(var i=0; i<6; i++){
    var y = CY - 52 + i*19;
    el("rect", {x: sgn < 0 ? CX-104 : CX+88, y:y, width:16, height:8, rx:3,
      fill:"none", stroke:PAL.steel, "stroke-width":1.6}, svg);
  }
});
for(var pb=0; pb<14; pb++){
  var bp = polar(CX, CY, 110, pb*(360/14));
  el("circle", {cx:(CX + (bp[0]-CX)*0.96).toFixed(1), cy:bp[1].toFixed(1), r:2.2, fill:PAL.brass, stroke:"none"}, svg);
}
/* the chin intake scoop under the cowling, with its throat lines */
el("rect", {x:CX-27, y:CY+112, width:54, height:30, rx:8,
  fill:PAL.void, stroke:PAL.steelHi, "stroke-width":2}, svg);
[-14, 0, 14].forEach(function(off){
  el("line", {x1:CX+off, y1:CY+118, x2:CX+off, y2:CY+136, stroke:PAL.steelLo, "stroke-width":1.4}, svg);
});
/* the propeller: FOUR blades, turning fast on the hub */
var prop = el("g", {}, svg);
for(var b=0; b<4; b++){
  var bg = el("g", {transform:"rotate("+(b*90)+" "+CX+" "+CY+")"}, prop);
  el("path", {d:"M "+CX+" "+(CY-15)+" C "+(CX+12)+" "+(CY-42)+", "+(CX+10)+" "+(CY-74)+", "+CX+" "+(CY-106)
    +" C "+(CX-7)+" "+(CY-72)+", "+(CX-6)+" "+(CY-40)+", "+CX+" "+(CY-15)+" Z",
    fill:"rgba(159,180,192,0.20)", stroke:PAL.steelHi, "stroke-width":1.8, "stroke-linejoin":"round"}, bg);
  el("circle", {cx:CX, cy:CY-106, r:3.2, fill:PAL.brassHi, stroke:"none"}, bg);
}
/* the spinner: a POINTED cone (the Corsair seat wears a dome — the
   two cones are different, as the owner's set requires), house-drawn
   shading (see header) */
var defs = el("defs", {}, svg);
var grad = el("linearGradient", {id:"cone", x1:"0%", y1:"0%", x2:"100%", y2:"0%"}, defs);
el("stop", {offset:"0%", "stop-color":"#14181c"}, grad);
el("stop", {offset:"42%", "stop-color":"#d7e6ee"}, grad);
el("stop", {offset:"100%", "stop-color":"#3d4a55"}, grad);
el("path", {d:"M "+CX+" "+(CY-40)+" L "+(CX+17)+" "+(CY+12)+" A 17 10 0 0 1 "+(CX-17)+" "+(CY+12)+" Z",
  fill:"url(#cone)", stroke:PAL.steelHi, "stroke-width":1.6, "stroke-linejoin":"round"}, svg);
el("circle", {cx:CX, cy:CY+12, r:3.4, fill:PAL.brass, stroke:"none"}, svg);
var lbl = el("text", {x:CX, y:CY+158, "text-anchor":"middle", fill:"#f5ead2",
  "font-size":10, "font-weight":700, "letter-spacing":"0.16em",
  "font-family":"ui-monospace,Menlo,Consolas,monospace"}, svg);
lbl.textContent = "V-12 COWLING · CHIN INTAKE";
/* ---- the ingest at the viewer (the wing's shared pattern) ---- */
var ingestG = el("g", {opacity:"0"}, svg);
var ingestParts = [];
for(var ip=0; ip<12; ip++){
  ingestParts.push(el("circle", {r:1.9, fill:PAL.laser, stroke:"none", opacity:"0"}, ingestG));
}
var ingestObj = el("g", {}, ingestG);
function drawIngestShape(kind){
  while(ingestObj.firstChild) ingestObj.removeChild(ingestObj.firstChild);
  if(kind === "saucer"){
    el("ellipse", {cx:0, cy:0, rx:11, ry:3.6, fill:"none", stroke:PAL.laser, "stroke-width":1.6}, ingestObj);
    el("path", {d:"M -5 0 A 5 4 0 0 1 5 0", fill:"none", stroke:PAL.laser, "stroke-width":1.6}, ingestObj);
  } else if(kind === "triangle"){
    el("polygon", {points:"0,-8 8,6 -8,6", fill:"none", stroke:PAL.laser, "stroke-width":1.6}, ingestObj);
  } else if(kind === "bird"){
    el("path", {d:"M -11 1 Q -5 -6 0 0 Q 5 -6 11 1", fill:"none", stroke:PAL.steelHi, "stroke-width":1.8}, ingestObj);
  } else {
    el("circle", {cx:0, cy:0, r:5.5, fill:"none", stroke:PAL.laser, "stroke-width":1.6}, ingestObj);
    el("circle", {cx:0, cy:0, r:1.8, fill:PAL.laser, stroke:"none"}, ingestObj);
  }
}
var INGEST_KINDS = ["orb", "triangle", "saucer", "bird"];
var ingest = { phase:"wait", until: 7000 + Math.random()*7000, t0:0, kind:"orb" };
function ingestFrame(now){
  if(ingest.phase === "wait"){
    ingestG.setAttribute("opacity", "0");
    if(now >= ingest.until){
      ingest.phase = "in"; ingest.t0 = now;
      ingest.kind = INGEST_KINDS[Math.floor(Math.random()*INGEST_KINDS.length)];
      drawIngestShape(ingest.kind);
    }
    return;
  }
  var dt = now - ingest.t0;
  ingestG.setAttribute("opacity", "1");
  if(ingest.phase === "in"){
    var k = Math.min(1, dt/1200);
    var sc = 0.25 + 1.45*k;
    ingestObj.setAttribute("transform", "translate("+CX+" "+CY+") scale("+sc.toFixed(2)+")");
    ingestObj.setAttribute("opacity", String(1 - Math.max(0, k-0.8)*5));
    if(k >= 1){ ingest.phase = "through"; ingest.t0 = now; }
  } else if(ingest.phase === "through"){
    var k2 = Math.min(1, dt/1400);
    ingestObj.setAttribute("opacity", "0");
    ingestParts.forEach(function(c, i){
      var ang = i*(360/12) + k2*160;
      var rr = 8 + 84*k2;
      var pp = polar(CX, CY, rr, ang);
      c.setAttribute("cx", pp[0].toFixed(1)); c.setAttribute("cy", (CY + (pp[1]-CY)*1.12).toFixed(1));
      c.setAttribute("opacity", String(0.95 - Math.max(0, k2-0.8)*4));
    });
    if(k2 >= 1){ ingest.phase = "wait"; ingest.until = now + 6000 + Math.random()*9000; }
  }
}
function frame(){
  var now = Date.now();
  var a = ((now/1250) % 1) * 360;
  prop.setAttribute("transform", "rotate("+a.toFixed(2)+" "+CX+" "+CY+")");
  ingestFrame(now);
  requestAnimationFrame(frame);
}
var clockEl = document.getElementById("clock"), dateEl = document.getElementById("dateLine");
var DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
var MONS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var lastMinute = -1;
function paintTime(now){
  var m = now.getMinutes();
  if(m === lastMinute) return;
  lastMinute = m;
  var hh = now.getHours(), h12 = hh % 12; if(h12 === 0) h12 = 12;
  clockEl.textContent = (h12<10?"0":"")+h12+":"+(m<10?"0":"")+m;
  dateEl.textContent = DAYS[now.getDay()]+" · "+MONS[now.getMonth()]+" "+now.getDate()+
    " · "+(hh<12?"AM":"PM");
}
paintTime(new Date());
setInterval(function(){ paintTime(new Date()); }, 1000);
window.__governor = { state:"live", enters:1, rests:0, lastSignal:"boot-live" };
window.__faceRest = false;
/* view state: the face OPENS on the photorealistic line; touch
   flips to the drawn view, kept whole; touch again returns */
var viewPhoto = true;
var photoWrapEl = document.getElementById("photoWrap");
var boreWrapEl = document.getElementById("boreWrap");
var specLblEl = document.getElementById("specLbl");
function applyView(){
  photoWrapEl.style.display = viewPhoto ? "block" : "none";
  boreWrapEl.style.display = viewPhoto ? "none" : "block";
  specLblEl.textContent = viewPhoto ? "PHOTOREALISTIC LINE · GENERATED FROM POOLED PHOTOGRAPHS — TOUCH FOR DRAWN VIEW"
                                    : "THE PROPELLER WING · NOSE-ON · INTAKE AT THE VIEWER — TOUCH FOR PHOTO VIEW";
}
applyView();
window.addEventListener("click", function(){ viewPhoto = !viewPhoto; applyView(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
