// SWEEP-CLOCK PRIMING (SWEEP FIX, Nov 11, 2026; corrected same day after a
// post-merge bench caught the first version freezing the pulse/freq loops):
// drawScope used to trust the raw rAF timestamp; under a hidden tab or a
// throttled WebView the delivered timestamps warp, and % 4000 turned that warp
// into needle teleports. This wrapper gives EVERY rAF callback of the face a
// timestamp from a MONOTONIC SWEEP CLOCK: __sweepTime advances only by real
// frame deltas (performance.now), each clamped to 50ms, so no callback can
// ever see time jump or run backwards. drawScope advances on its own
// performance.now clock (see SWEEP FIX in drawScope); this wrapper exists so
// the face's OTHER timestamp-driven loops (pulse ECG phase, freq strip) ride
// the same warp-proof clock instead of the raw rAF timestamp. The wrapper
// stays installed for the life of the page; it adds one closure per frame.
(function () {
  var real = window.requestAnimationFrame.bind(window);
  var last = -1;
  window.__sweepTime = 0;
  window.requestAnimationFrame = function (cb) {
    return real(function () {
      var t = performance.now();
      if (last >= 0) window.__sweepTime += Math.min(50, Math.max(0, t - last));
      last = t;
      cb(window.__sweepTime);
    });
  };
})();

  }
  document.getElementById('cenbtn').addEventListener('click', function () { setCensus(!CENSUS.on); });
  // ---- FACTORY BEAT ingest (bridge relay, or the house state the
  // network serves at factory-beat.json next to the face).
  function applyBeat(b) {
    if (!b) return;
    var pulse = num(b.pulseMs), phase = num(b.phaseMs);
    if (pulse === null || phase === null) return;
    var sig = pulse + '|' + phase + '|' + (b.at || '');
    if (sig === FB.sig && typeof b.at !== 'number') return;
    FB.sig = sig; FB.pulseMs = pulse; FB.phaseMs = phase;
    FB.at = (typeof b.at === 'number') ? b.at : Date.now();
    FB.freshAt = Date.now();
    if (b.sim) SIM.on = true;
  }
  function readBeat() { if (window.ApexBeat) applyBeat(window.ApexBeat); }
  window.ApexBeatPush = function (b) { window.ApexBeat = b; applyBeat(b); };
  var FF = { fails: 0, nextAt: 0 };
  function fetchFactory() {
    if (!/^https?:$/.test(window.location.protocol)) return;
    if (document.hidden) return; // no fetching in the dark (LOKMAT STANDARD)
    var now = Date.now();
    if (now < FF.nextAt) return; // backoff gate — the service calls us every second, we decide
    try {
      fetch('factory-beat.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j) { applyBeat(j); FF.fails = 0; FF.nextAt = Date.now() + 30000; }
          else { FF.fails++; FF.nextAt = Date.now() + Math.min(300000, 30000 * Math.pow(2, Math.min(FF.fails, 4))); }
        })
        .catch(function () { FF.fails++; FF.nextAt = Date.now() + Math.min(300000, 30000 * Math.pow(2, Math.min(FF.fails, 4))); /* nothing served here — the ladder falls through */ });
    } catch (e) { FF.nextAt = Date.now() + 300000; /* fetch unavailable in this container */ }
  }
  function factoryPhase01() {
    if (!FB.at) return 0;
    var ph = FB.phaseMs + (Date.now() - FB.at);
    var m = ph % FB.pulseMs;
    return (m < 0 ? m + FB.pulseMs : m) / FB.pulseMs;
  }
  // THE LADDER (V6): BIO -> AP PING -> FACTORY -> TICK, re-evaluated
  // at every service; steps down as sources fall, back up as they
  // return. AP PING binds when the AP has answered at least 3 pings
  // and the last answer is under 15 s old.
  function evalBeat() {
    if (S.hr !== null && fresh(T.hr, 20000)) BEAT.src = 'BIO';
    else if (PING.series.length >= 3 && PING.lastAt && (Date.now() - PING.lastAt <= 15000)) BEAT.src = 'APING';
    else if (FB.freshAt && (Date.now() - FB.freshAt < 90000) && navigator.onLine !== false) BEAT.src = 'FACTORY';
    else BEAT.src = 'TICK';
  }
  // ================================================================
  // SCAN SUPERVISOR — the battery governor + the promiscuous event
  // (amendments #3/#5, spec §4/§6). SAMPLED by default: one snapshot
  // per cadence, the dial replays it between samples with its age
  // printed. INVESTIGATION (toggle): the call-retry event at full
  // persistence. Chain shape, both modes: attempt -> result or ~4 s
  // window -> retry; expect success in 1–3 attempts with throttling
  // off; MAX 4 attempts, then the snapshot is declared MISSED, the
  // chain backs off, and the picture ages — it never spins forever.
  // While the face is unobserved the supervisor sleeps (V12 law).
  // ================================================================
  var SCAN = { attempts: 0, missed: 0, nextReqAt: Date.now() + 1000, awaitingSince: 0, snapSeenAt: 0 };
  function cadenceMs() {
    var o = window.__apexCadence || {}; // bench hook: shortens cadences for proof runs only
    return INVEST.on ? (o.invest || 6000) : (o.sample || 30000);
  }
  function tickScan() {
    var now = Date.now();
    if (document.hidden) return;
    if (RF.snapAt && RF.snapAt !== SCAN.snapSeenAt) {
      SCAN.snapSeenAt = RF.snapAt; SCAN.attempts = 0; SCAN.missed = 0; SCAN.awaitingSince = 0;
      SCAN.nextReqAt = now + cadenceMs();
      return;
    }
    var age = RF.snapAt ? now - RF.snapAt : Infinity;
    if (age < cadenceMs()) return; // still inside the replay window
    if (SCAN.awaitingSince && now - SCAN.awaitingSince < 4000) return; // the ~4s result window
    if (!SCAN.awaitingSince && now < SCAN.nextReqAt) return; // backoff / first-call gate
    if (SCAN.attempts >= 4) {
      SCAN.missed++; SCAN.attempts = 0; SCAN.awaitingSince = 0;
      var back = Math.min(60000, 15000 * SCAN.missed);
      SCAN.nextReqAt = now + back;
      if (window.console) console.log('[APEX-RF] snapshot missed after cap; picture ages; backoff ' + back + 'ms');
      renderBios();
      return;
    }
    SCAN.attempts++; SCAN.awaitingSince = now;
    if (window.console) console.log('[APEX-RF] scan attempt ' + SCAN.attempts + ' (' + (INVEST.on ? 'investigate' : 'sampled') + ')');
    if (typeof window.ApexWifiRequestScan === 'function') { try { window.ApexWifiRequestScan(); } catch (e) {} }
  }
  function setInvest(on) {
    INVEST.on = on;
    var b = document.getElementById('invbtn');
    b.className = on ? 'on' : '';
    b.textContent = on ? 'INVESTIGATING' : 'INVESTIGATE';
    SCAN.attempts = 0; SCAN.awaitingSince = 0; SCAN.nextReqAt = 0;
    if (!on && navigator.vibrate) { try { navigator.vibrate(0); } catch (e) {} }
    renderMode(); renderBios();
  }
  document.getElementById('invbtn').addEventListener('click', function () { setInvest(!INVEST.on); });
  // Pin tap = hunt selection (Level 1 -> Level 2). Tap empty glass to clear.
  cv.addEventListener('click', function (e) {
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (cv.width / rect.width);
    var y = (e.clientY - rect.top) * (cv.height / rect.height);
    var bestK = null, bestD = Math.max(20, R * 0.11);
    for (var k in RF.pins) {
      var p = RF.pins[k];
      if (p._px < 0) continue;
      var dx = p._px - x, dy = p._py - y, dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < bestD) { bestD = dd; bestK = k; }
    }
    HUNT.bssid = (bestK && HUNT.bssid !== bestK) ? bestK : null;
    if (navigator.vibrate && HUNT.bssid) { try { navigator.vibrate(0); } catch (e) {} }
    renderBios();
  });
  // LEVEL 2 HAPTICS — hotter/colder from the selected AP's MEASURED
  // RSSI (+ alignment against the frame heading only when a solved
  // pin and an honest heading both exist). navigator.vibrate is the
  // web-exposed path; a container that exposes none gets silence here
  // and a NO MEASURE line in the build report — never a fake buzz
  // driven by invented data.
  function huntTick() {
    if (!HUNT.bssid || !INVEST.on || document.hidden) { HUNT.score = 0; return; }
    var pin = RF.pins[HUNT.bssid];
    if (!pin || (Date.now() - RF.snapAt > SNAP_FRESH_MS)) { HUNT.score = 0; return; }
    var norm = clamp((pin.rssi + 92) / 58, 0, 1);
    var score = norm, hd = frameHeadingRad();
    if (hd !== null && pin.solved) {
      var align = 0.5 + 0.5 * Math.cos(pinPos(pin).ang - hd);
      score = norm * (0.45 + 0.55 * align);
    }
    HUNT.score = score;
    var pat = 0;
    if (score > 0.78) pat = [110]; else if (score > 0.60) pat = [70, 50, 70];
    else if (score > 0.42) pat = [45, 70, 45]; else if (score > 0.26) pat = [28];
    else if (score > 0.12) pat = [14];
    if (navigator.vibrate) { try { navigator.vibrate(pat); } catch (e) {} }
  }
  // ---- WEATHER — the estate's sibling pattern (weather.html): one
  // small Open-Meteo fetch on load, refresh 15 min, plain text; the
  // honest NO MEASURE when the network does not answer.
  var WX_CODES = { 0: 'CLEAR', 1: 'MOSTLY CLEAR', 2: 'PARTLY CLOUDY', 3: 'OVERCAST', 45: 'FOG', 48: 'FOG', 51: 'DRIZZLE', 53: 'DRIZZLE', 55: 'DRIZZLE', 61: 'RAIN', 63: 'RAIN', 65: 'RAIN', 66: 'FRZ RAIN', 67: 'FRZ RAIN', 71: 'SNOW', 73: 'SNOW', 75: 'SNOW FALL', 77: 'SNOW', 80: 'SHOWERS', 81: 'SHOWERS', 82: 'SHOWERS', 85: 'SNOW SHWR', 86: 'SNOW SHWR', 95: 'T-STORM', 96: 'T-STORM', 99: 'T-STORM' };
  function fetchWX() {
    var el = document.getElementById('wx');
    try {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=44.98096&longitude=-84.49608&current=temperature_2m,weather_code&temperature_unit=fahrenheit&forecast_days=1')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && j.current && typeof j.current.temperature_2m === 'number') el.textContent = Math.round(j.current.temperature_2m) + '°F · ' + (WX_CODES[j.current.weather_code] || '—');
          else el.textContent = 'WX NO MEASURE';
        })
        .catch(function () { el.textContent = 'WX NO MEASURE'; });
    } catch (e) { el.textContent = 'WX NO MEASURE'; }
  }
  function fmtSleep(v) {
    if (v === null) return 'NO MEASURE';
    return (Math.round(v * 10) / 10) + 'H';
  }
  function rfText() {
    var age = RF.snapAt ? Math.floor((Date.now() - RF.snapAt) / 1000) : -1;
    var n24 = 0, n5 = 0, i;
    for (i = 0; i < RF.aps.length; i++) { if (RF.aps[i].bandGhz >= 4.5) n5++; else n24++; }
    var hunt = (HUNT.bssid && RF.pins[HUNT.bssid]) ? ' · HUNT ' + (RF.pins[HUNT.bssid].ssid || 'AP') : '';
    if (INVEST.on) return 'INVESTIGATING · ' + RF.order.length + ' AP · ' + (age >= 0 ? age + 'S' : '—') + hunt;
    if (!RF.snapAt) return 'NO FEED';
    if (age * 1000 > SNAP_FRESH_MS) return 'NO FEED · LAST ' + age + 'S';
    return RF.order.length + ' AP · 2.4×' + n24 + ' 5×' + n5 + ' · ' + age + 'S' + hunt;
  }
  function renderBios() {
    var d = new Date(), h = d.getHours() % 12; if (h === 0) h = 12;
    var battV = (S.batt !== null && fresh(T.batt, 120000)) ? S.batt : battPct;
    var rows = '';
    rows += '<span class="bl">BATT</span> <span class="bv">' + (battV !== null && battV !== undefined ? battV + '%' : 'NO MEASURE') + '</span><br>';
    var hrVal, hrTag;
    if (S.hr !== null && fresh(T.hr, 20000)) { hrVal = S.hr + ' BPM'; hrTag = ' <span class="bl">' + S.hrSrc + '</span>'; }
    else if (S.hr !== null) { hrVal = 'NO MEASURE'; hrTag = ''; }
    else { hrVal = '—'; hrTag = ' <span class="bl">' + S.hrState + '</span>'; }
    rows += '<span data-act="hr" style="cursor:pointer"><span class="bl">HEART RATE</span> <span class="bheart">♥</span> <span class="bv">' + hrVal + '</span>' + hrTag + '</span><br>';
    rows += '<span class="bl">O2</span> <span class="bv">' + (S.spo2 !== null && fresh(T.spo2, 60000) ? S.spo2 + '%' : 'NO MEASURE') + '</span><br>';
    rows += '<span class="bl">HRV</span> <span class="bv">' + (S.hrv !== null && fresh(T.hrv, 60000) ? S.hrv + ' MS' : 'NO MEASURE') + '</span><br>';
    rows += '<span class="bl">STEPS</span> <span class="bv">' + (S.steps !== null && fresh(T.steps, 300000) ? S.steps : 'NO MEASURE') + '</span><br>';
    rows += '<span class="bl">SLEEP</span> <span class="bv">' + (S.sleep !== null && fresh(T.sleep, 12 * 3600 * 1000) ? fmtSleep(S.sleep) : 'NO MEASURE') + '</span><br>';
    rows += '<span data-act="gps" style="cursor:pointer"><span class="bl">GPS</span> <span class="bv">' + (S.gps ? S.gps : '—') + '</span>' + (S.gps ? '' : ' <span class="bl">TAP</span>') + '</span><br>';
    rows += '<span class="bl">NET</span> <span class="bv">' + netText() + '</span><br>';
    rows += '<span class="bl">RF</span> <span class="bv">' + rfText() + '</span>';
    // (V6: the bios TIME row is gone — it duplicated the big clock,
    // and its line was one of the stack the column could not afford.)
    document.getElementById('bios').innerHTML = rows;
  }
  function renderMode() {
    var parts = [];
    if (SIM.on) parts.push('SIM');
    if (BEAT.src === 'BIO') parts.push('♥ BIO ' + (S.hr || '') + ' BPM');
    else if (BEAT.src === 'APING') parts.push('AP PING · ' + (NET.ssid || 'AP') + ' ' + PING.lastRtt + 'MS');
    else if (BEAT.src === 'FACTORY') {
      var ph = Math.floor(factoryPhase01() * FB.pulseMs / 1000);
      parts.push('♥ FACTORY PULSE ' + pad(Math.floor(ph / 60)) + ':' + pad(ph % 60) + ' / ' + Math.round(FB.pulseMs / 60000) + 'M');
    } else parts.push('TICK · NO HEARTBEAT FEED');
    if (INVEST.on) parts.push('INVESTIGATING');
    var age = RF.snapAt ? Math.floor((Date.now() - RF.snapAt) / 1000) : -1;
    parts.push((RF.snapAt && age * 1000 <= SNAP_FRESH_MS) ? 'RF ' + RF.order.length + 'AP ' + age + 'S' : 'RF NO FEED');
    var txt = parts.join(' · ');
    var el = document.getElementById('mode');
    if (el.textContent !== txt) el.textContent = txt;
  }
  document.getElementById('bios').addEventListener('click', function (ev) {
    var t = ev.target, root = document.getElementById('bios');
    while (t && t !== root) {
      if (t.getAttribute && t.getAttribute('data-act')) {
        var a = t.getAttribute('data-act');
        if (a === 'hr' && S.hr === null) connectBT();
        if (a === 'gps') askGPS();
        return;
      }
      t = t.parentNode;
    }
  });
  function tick() {
    var d = new Date(), h = d.getHours() % 12; if (h === 0) h = 12;
    document.getElementById('clock').textContent = h + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('date').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
    renderBios();
    renderMode();
  }
  // Bench/debug handle — the face's public state, for proof runs and
  // the owner's own eyeball. Read-only truth, same numbers the wearer sees.
  window.__fox = {
    state: function () {
      return {
        beat: BEAT.src,
        ping: { n: PING.series.length, lastRtt: PING.lastRtt, jitter: pingJitter() },
        heading: FRAME.headingDeg,
        beatPhase: BEAT.src === 'FACTORY' ? Math.round(factoryPhase01() * 1000) / 1000 : null,
        rfAgeS: RF.snapAt ? Math.round((Date.now() - RF.snapAt) / 100) / 10 : null,
        apCount: RF.order.length,
        pinCount: Object.keys(RF.pins).length,
        invest: INVEST.on,
        hunt: HUNT.bssid,
        huntScore: Math.round(HUNT.score * 100) / 100,
        scanAttempts: SCAN.attempts,
        scanMissed: SCAN.missed,
        fixes: FRAME.fixes,
        course: FRAME.courseDeg,
        sim: SIM.on,
        net: netText(),
        mode: document.getElementById('mode').textContent,
        tiles: document.getElementById('bios').textContent.replace(/\s+/g, ' ').trim()
      };
    },
    pins: function () {
      var out = [];
      for (var k in RF.pins) {
        var p = RF.pins[k];
        out.push({ key: k, ssid: p.ssid, band: p.bandGhz, ch: p.channel, rssi: p.rssi, samples: p.samples, solved: !!p.solved, firm: Math.round(pinFirm(p) * 100) / 100, px: Math.round(p._px), py: Math.round(p._py) });
      }
      return out;
    },
    select: function (bssid) { HUNT.bssid = bssid || null; renderBios(); },
    investigate: function (on) { setInvest(!!on); },
    census: function (on) { setCensus(!!on); },
    censusState: function () {
      var d = censusData();
      return {
        on: CENSUS.on,
        wifiNew: d.wifiNew, wifiTotal: d.wifiTotal,
        bt: d.btTotal, cell: d.cellTotal,
        notable: d.notable.map(function (r) { return { name: r.name, tag: r.tag, rssi: r.rssi, reasons: r.reasons }; }),
        firstLogCount: d.firstLog.length,
        snapDay: d.snapDay,
        panel: document.getElementById('census').textContent.replace(/\s+/g, ' ').trim()
      };
    }
  };
  // ================================================================
  // TABLE SERVICE (V6) — ONE 1 s service timer runs the house, at
  // FULL data quality: prepare the plate (every bridge read, the
  // ladder evaluated, the scan supervisor ticked), serve the meal
  // (clock, bios, mode, draw loops started), remove the plate (the
  // draw loops stop THEMSELVES when their state goes still or the
  // face hides), clean it, invite back in one second — ad
  // infinitum. Nothing is thinned or downsampled; the rich data
  // and the come-and-go all still arrive. What changed is that the
  // face no longer grazes between meals. While hidden the service
  // itself sleeps — a closed face leaves NOTHING running for the
  // device optimizer to forgive (THE LOKMAT STANDARD, owner field
  // benchmark, Nov 15, 2026). One deliberate exception: an active
  // hunt the wearer opened runs its own 700 ms haptics session
  // timer, started and cleared WITH the hunt — a session with a
  // setup and a teardown, not a grazing loop.
  // (V5 cadence, for the record: 250 ms tick + 500 ms bridge reads
  // + 500 ms scan supervisor + 700 ms hunt + 30 s factory fetch,
  // all free-running, all awake while hidden, three rAF loops
  // re-queueing into the dark.)
  // ================================================================
  var huntTimer = null;
  function manageHuntTimer() {
    var want = !!(INVEST.on && HUNT.bssid && !document.hidden);
    if (want && !huntTimer) huntTimer = setInterval(huntTick, 700);
    if (!want && huntTimer) { clearInterval(huntTimer); huntTimer = null; }
  }
  function serviceDraws() {
    if (document.hidden) return;
    if (!RUN.scope) { RUN.scope = true; requestAnimationFrame(drawScope); }
    if (!RUN.pulse) { RUN.pulse = true; requestAnimationFrame(drawPulse); }
    if (!RUN.freq) { RUN.freq = true; requestAnimationFrame(drawFreq); }
  }
  function service() {
    if (document.hidden) { manageHuntTimer(); return; }
    readBridge(); readWifi(); readNet(); readBeat(); readPing(); evalBeat();
    tick();
    tickScan();
    fetchFactory();
    manageHuntTimer();
    serviceDraws();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (navigator.vibrate) { try { navigator.vibrate(0); } catch (e) {} }
      manageHuntTimer(); // stops NOW; the draw loops stop themselves next frame and do not re-queue
    } else {
      layout();
      service(); // a fresh plate the moment the face returns
    }
  });
  // ---- boot
  layout();
  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  service();
  setInterval(service, 1000);
  setInterval(function () { if (!document.hidden) censusTick(); }, 500); // census merge: the panel's freshness tick rides its own beat
  fetchWX(); setInterval(fetchWX, 900000);
  if (navigator.getBattery) {
    navigator.getBattery().then(function (b) {
      var el = document.getElementById('batt');
      function upd() {
        battPct = Math.round(b.level * 100);
        stamp('batt', battPct, 0);
        S.batt = battPct;
        el.textContent = battPct + '%';
        renderBios();
      }
      upd(); b.addEventListener('levelchange', upd);
    }).catch(function () { /* no battery hook — BATT row reads NO MEASURE */ });
  }
</script>
</body></html>
