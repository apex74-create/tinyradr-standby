  APEX GLASS HOUSE — AQUARIUM. Betta Hyper-Detail Free Floaters V2 (Nov 9, 2026).

  SEED: betta-hyperdetail-freefloat-v1-2026-11-09.html — this
  evening's V1 (four free floaters, three-layer parasol fins,
  timer-leash fights). V2 carries V1 forward entire, with ONE
  ordered change — THE TWO RAILS — per the owner's order
  (Nov 9, 2026, 22:21 EST), given after he watched V1: "they
  should be able to travel the dotted line though and not just
  the solid line. It should be turning points equal and opposite
  that way you get a truly random combat action between the yin
  and the yang." His reading of the face rides with it: the fish
  trace their path through the median of the curves, compounded
  by the outside diameter; the two sides fighting — "like your
  two sides fighting" — the yin and the yang in combat by
  geometry, not by dice.

  THE AMENDMENTS (owner, Nov 9, 2026, 22:22–22:23 EST, folded
  into this same build):
    A1. THE VICTORY FLASH — YIN WINS / YANG WINS. The principals
        are NAMED: YIN is the RED fish, YANG is the BLUE fish.
        When a principal kills the other, THE WHOLE DISC takes
        the winner's colour in a breathing swell — opacity rides
        semi-transparent -> transparent -> opaque as the colour
        fills the disc (his words) — holds a beat at full, then
        releases back to the line-work figure. The beaten fish
        respawns ONLY AFTER the flash completes. (Floater kills
        keep V1's plain edge respawn.)
    A2. SYMMETRY IS THE RANDOMIZER — his engineering note, the
        design principle of the motion: "due to the symmetry in
        the actual moving design, the logic in the routine should
        be easily symmetric and we should come to a real good
        randomization." So: ONE rider routine, instanced twice
        under the disc's half-turn symmetry — the second rider
        is the first with every signed field negated — and the
        randomness comes FROM the symmetric motion (phase drift
        between the riders, choices at the equal-and-opposite
        turning points), not from a bolted-on dice table.
    A3. THE HOUSE RNG SEAT + THE TERM BATTLE LEDGER. The switch
        choices at the turning points (and the returning rider's
        rail, and the riders' opening phases) are drawn from the
        house RNG seat — distribution earned by the geometry,
        unpredictability seated in the house generator: a small
        deterministic generator, seeded from NO CLOCK — a hash
        of the stored term record stirred with the keeper-signal
        count, the face's own history. One stream shared by both
        mirrored riders through the same routine. And the face
        keeps a persistent TERM BATTLE record across sessions:
        YIN WINS · YANG WINS at the disc's edge in their colours,
        SPAWNS · RESPAWNS in a quiet line under the date — which
        spawns and respawn count, over a term (his ask). Wins ARE
        kills for the principals. Persistence is the house's
        guarded localStorage manner; its grade is NO MEASURE —
        the wrapper's retention across launches is untested.

  THE TWO RAILS (V2's one change)
    - The yin-yang figure is TWO NAVIGABLE RAILS for the TWO
      PRINCIPAL fish, sharing the figure's centre (320,225) and
      outside diameter (r = 118): the SOLID rail follows the path
      the wallpaper already drew — the figure's boundary S (top
      semicircle + the two lobe arcs) — and the DOTTED rail is
      its complementary curve, the TRUE MEDIAN of the S: the
      straight diameter crossed by the two lobe radii (right
      semicircle r59 about (320,166) + diameter descent + left
      semicircle r59 about (320,284)). The wallpaper now draws
      both: solid for one, dotted for the other.
    - TURNING POINTS EQUAL AND OPPOSITE. The rails share exactly
      two points: the poles T=(320,107) and B=(320,343),
      diametrically opposite on the figure. A principal rides its
      rail loop; at each pole pass it may SWITCH to the other
      rail — the switch is a CHANCE PER PASS (p = 1/2): an
      unscripted coin at an equal-and-opposite point, so neither
      fish's circuit is ever a fixed script. The poles are the
      same pair for both rails, by construction.
    - COMBAT FROM THE GEOMETRY. There is NO timer and NO dice
      deciding whether the principals meet: their rails cross at
      both poles and share the diameter, and because a pole
      switch can put both fish on the SAME curve travelling
      EITHER direction, head-on and closing meetings are produced
      by the paths themselves. When the principals close within
      the clash distance, the V1 choreography takes them (flare,
      dash, clash, 25% kill, obliteration, edge respawn) — the
      encounter is geometry's; only the kill keeps its chance.
      The respawned principal re-enters free — a floater at the
      glass — until the tank is quiet, then takes a rail again.
    - The V1 leash survives ONLY as a floor: it may pair the two
      FLOATERS, or a floater with a free (respawned) principal.
      It never pairs a rail rider.
    - Rail riding honours the motion law: the rails are curves,
      riding them is arc-true by construction; the heading eases
      onto and off the rail tangent under the same hard turn cap
      as free swimming (hero 1.15 rad/s) — measured, never a snap.
    - At REST the still shows the figure with BOTH rails drawn
      and the two principals posed ON their rails at the poles,
      equal and opposite.

  SEED OF V1: betta-yinyang-clock-face-V2-2026-11-08.html — the
  shipped Glass House V2 (yin-yang circling pair). V1 EVOLVED it
  per the owner's order (Nov 9, 2026, 21:46 EST): "I want a hyper
  detailed version of the beta fish… I want some free floaters man
  and I want them to have some layered, you know, like parasol, a
  feather dragging behind them, some longer fins that kind of trail
  around them as they swim… like the old centipede video game or
  something but with more sweeping arcs, you know no 90s and shit…
  and maybe they get into a fight every once in a while… and then
  maybe one of them obliterates and a new one spawns in."

  WHAT CHANGED FROM THE SEED (V1's record, carried)
    - NO FIXED CIRCUIT — true of V1; V2 restores the circuit as
      GEOMETRY for the principals only, per the order above. The
      floaters still swim FREE: pure-pursuit wandering between
      waypoints, turn rate capped, so every path is a SWEEPING
      ARC. There is no grid and there are no right angles anywhere
      in the motion math; the Centipede feel lives only in the
      TRAILING segmented finnage behind each fish.
    - HYPER DETAIL = LAYERED FINS. Each fin is drawn THREE times:
      a deep membrane tint layer, a feather-rib fan layer, and a
      parasol outer-rib layer — three strata of the fin's OWN
      palette colour at stepped translucency. Longer fins than V2:
      caudal, dorsal and anal all run long and trail with phase
      lag behind the spine wave, so the finnage sweeps and drags
      as the fish turns. Translucency is earned by the fin render;
      no dark overlay exists anywhere on this face.
    - FIGHTS. V1's leash mechanic, now the FLOOR only (floaters,
      and a floater with a free principal): on a long random
      leash (45–120 s of OBSERVED time) two eligible fish pick
      each other out, turn toward each other over sweeping arcs,
      flare (fin scale up, wave amplitude up), dash, clash once,
      and separate. The principals' fights come from THE RAILS
      (see THE TWO RAILS above) — geometry, not the leash.
    - OBLITERATION + RESPAWN. A quarter of fights end in a kill:
      the loser bursts into drifting sparks of its own colours
      and dissolves; after a 3–7 s pause a NEW fish spawns at an
      edge — fade and scale in, possibly in a fresh palette —
      and the population holds at four. A respawned PRINCIPAL
      swims free until the tank is quiet, then re-takes a rail.
    - CLOCK. Real device time, the seed's hovering digits in the
      seed's place and size; tick() runs every 200 ms at REST and
      OBSERVED alike (the seed's discipline). At REST the
      principals pose ON the rails at the poles; nothing animates
      at rest.

  THE GLASS HOUSE CRAFT CARRIES (from the seed, unchanged in kind):

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
function $(id){return document.getElementById(id);}
function mk(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function use(parent,href,color,width,opacity){var u=mk("use",{href:href},parent);
  if(color)u.setAttribute("color",color);
  if(width)u.setAttribute("stroke-width",width);
  if(opacity!==undefined)u.setAttribute("opacity",opacity);
  return u;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function angNorm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
function sstep(x){if(x<=0)return 0;if(x>=1)return 1;return x*x*x*(x*(x*6-15)+10);}

/* ================= FIT — the seed's measure-and-jam ================= */
var stage=$("stage"), scene=$("scene");
function layout(){
  var vv=window.visualViewport;
  var W=Math.floor(vv?vv.width:window.innerWidth);
  var H=Math.floor(vv?vv.height:window.innerHeight);
  if(!W||!H){W=document.documentElement.clientWidth||640;H=document.documentElement.clientHeight||480;}
  var S=Math.min(W/640,H/480);
  var sw=Math.round(640*S), sh=Math.round(480*S);
  stage.style.width=sw+"px"; stage.style.height=sh+"px";
  stage.style.left=Math.floor((W-sw)/2)+"px"; stage.style.top=Math.floor((H-sh)/2)+"px";
  scene.style.width=sw+"px"; scene.style.height=sh+"px";
  window.__fit={W:W,H:H,stageW:sw,stageH:sh,S:+S.toFixed(3)};
}
layout();
window.addEventListener("resize",layout);
if(window.visualViewport)window.visualViewport.addEventListener("resize",layout);

/* ================= THE CLOCK — the seed's tick, every 200 ms ========= */
var DAYS=["SU","MO","TU","WE","TH","FR","SA"];
function pad(n){return (n<10?"0":"")+n;}
function setPair(a,b,v){var e1=$(a),e2=$(b); if(e1)e1.textContent=v; if(e2)e2.textContent=v;}
function tick(){
  var d=new Date(), h=d.getHours(), ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
  setPair("dateGlow","dateText",DAYS[d.getDay()]+" "+pad(d.getMonth()+1)+"-"+pad(d.getDate()));
  setPair("timeGlow","timeText",h+":"+pad(d.getMinutes()));
  setPair("secGlow","secText",pad(d.getSeconds()));
  setPair("ampmGlow","ampmText",ap);
}
tick(); setInterval(tick,200);

/* ================= PALETTES — called, solid numbers =================
   under/core/body/fin per fish; opacities are the fin strata:
   body opacity, then fin deep / mid / parasol. Rotation includes
   the two principals' colours — in V2 those seats are the
   owner's named pair (YANG blue, YIN red); a principal NEVER
   changes colours, seat or side, even across a respawn. */
var PALETTES=[
 {name:"yangblue",  under:"#0d3a5c", core:"#57c8ff", body:"#1d5f9e", fin:"#3f8fd2", bOp:0.17, fOp:[0.22,0.13,0.07]},
 {name:"yinred",    under:"#5c140d", core:"#ff5a3c", body:"#9e2414", fin:"#e4572e", bOp:0.16, fOp:[0.21,0.12,0.065]},
 {name:"uapcyan",   under:"#0b3f47", core:"#22e6ff", body:"#0f5f73", fin:"#19b8d8", bOp:0.15, fOp:[0.20,0.115,0.06]},
 {name:"uapmagenta",under:"#470b38", core:"#ff3df0", body:"#73105c", fin:"#d819b8", bOp:0.15, fOp:[0.20,0.115,0.06]},
 {name:"uapteal",   under:"#0b4740", core:"#19f0c8", body:"#0f7363", fin:"#19d8b8", bOp:0.15, fOp:[0.20,0.115,0.06]},
 {name:"uapviolet", under:"#2a0b47", core:"#9a6bff", body:"#3d1f73", fin:"#7a4ae0", bOp:0.15, fOp:[0.20,0.115,0.06]}
];

/* ================= THE TWO RAILS (V2) =================
   The yin-yang figure carries TWO closed curves, sharing its
   centre C=(320,225) and its outside radius 118:
     SOLID  — the figure's boundary S, the path the wallpaper
              always drew: top semicircle r118 T->B, right lobe
              r59 B->M, left lobe r59 M->T.
     DOTTED — the median of the S: right lobe r59 T->M, the
              diameter M->B, left lobe r59 B->M, the diameter
              M->T. Drawn dotted on the wallpaper, as named.
   The curves share exactly two points: the POLES T=(320,107)
   and B=(320,343) — diametrically opposite, TURNING POINTS
   EQUAL AND OPPOSITE. At a pole, and only at a pole, a rider
   may pass from one rail to the other.
   Each rail is precomputed as an arc-length polyline of legs;
   a leg knows its endpoints, its length, and which pole waits
   at each end (pole-holding legs: the diameter legs of the
   dotted rail, and the top-semicircle ends of the solid rail). */
function buildRail(legs){
  var pts=[], lens=[], total=0, i, j, n;
  for(i=0;i<legs.length;i++){
    var L=legs[i], steps=Math.max(4,Math.round(L.len/6)), seg=[];
    for(j=0;j<=steps;j++){
      var th=L.a0+(L.a1-L.a0)*j/steps;
      seg.push({x:L.cx+Math.cos(th)*(L.len/2), y:L.cy+Math.sin(th)*(L.len/2)});
    }
    lens.push(L.len); total+=L.len;
    if(i===0)for(j=0;j<seg.length;j++)pts.push(seg[j]);
    else for(j=1;j<seg.length;j++)pts.push(seg[j]);
  }
  var cum=[0];
  for(i=1;i<pts.length;i++){
    var dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y;
    cum.push(cum[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  total=cum[cum.length-1];
  function sAt(x,y){
    var bi=0, bd=1e12;
    for(var i2=0;i2<pts.length;i2++){
      var ddx=pts[i2].x-x, ddy=pts[i2].y-y, dd=ddx*ddx+ddy*ddy;
      if(dd<bd){ bd=dd; bi=i2; }
    }
    return cum[bi];
  }
  function posAt(s){
    s=((s%total)+total)%total;
    var lo=0, hi=cum.length-1;
    while(lo<hi-1){ var mid=(lo+hi)>>1; if(cum[mid]<=s)lo=mid; else hi=mid; }
    var segL=cum[hi]-cum[lo]||1, fr=(s-cum[lo])/segL;
    var p0=pts[lo], p1=pts[hi];
    return {x:p0.x+(p1.x-p0.x)*fr, y:p0.y+(p1.y-p0.y)*fr,
            a:Math.atan2(p1.y-p0.y,p1.x-p0.x)};
  }
  return {pts:pts, total:total, posAt:posAt, sAt:sAt, legs:legs};
}
var RAIL_T={x:320,y:107}, RAIL_B={x:320,y:343};
var RAILS={
  solid:buildRail([
    {cx:320,cy:225,len:236,a0:-Math.PI/2,a1:Math.PI/2,poleA:"T",poleB:"B"},  /* top semicircle T->B */
    {cx:320,cy:284,len:118,a0:Math.PI/2,a1:-Math.PI/2,poleA:"B",poleB:"M"},  /* right lobe B->M */
    {cx:320,cy:166,len:118,a0:Math.PI/2,a1:Math.PI*1.5,poleA:"M",poleB:"T"}  /* left lobe M->T */
  ]),
  dotted:buildRail([
    {cx:320,cy:166,len:118,a0:-Math.PI/2,a1:Math.PI/2,poleA:"T",poleB:"M"},  /* right lobe T->M */
    {cx:320,cy:284,len:118,a0:-Math.PI/2,a1:Math.PI/2,poleA:"M",poleB:"B"},  /* left lobe M->B */
    {cx:320,cy:225,len:236,a0:Math.PI*1.5,a1:Math.PI/2,poleA:"B",poleB:"T"}  /* diameter straight B->T */
  ])
};
window.__rails={solid:RAILS.solid, dotted:RAILS.dotted, poles:{T:RAIL_T, B:RAIL_B}};
window.__railPoles={
  solid:{T:RAILS.solid.sAt(320,107), B:RAILS.solid.sAt(320,343)},
  dotted:{T:RAILS.dotted.sAt(320,107), B:RAILS.dotted.sAt(320,343)}
};

/* ================= THE FISH — construction =================
   Layer order inside each fish, largest to smallest: backlight,
   anal finnage, caudal finnage (tail segment), body tint, body
   wire (under + core), dorsal finnage, head + pectoral + trail.
   Fins carry three called layers: DEEP tint fill, MID feather-rib
   fan, TOP parasol ribs — translucency earned by the render. */
var fishLayer=$("fishLayer"), burstLayer=$("burstLayer");
function finTriple(parent,deepId,midId,topId,pal,lag){
  var g=mk("g",{},parent);
  var deep=mk("g",{},g); use(deep,deepId,pal.fin,null,pal.fOp[0]);
  var mid=mk("g",{},g);  use(mid,midId,pal.fin,1.1,pal.fOp[1]);
  var top=null;
  if(topId){ top=mk("g",{},g); use(top,topId,pal.core,0.9,pal.fOp[2]); }
  return {g:g,deep:deep,mid:mid,top:top,lag:lag};
}
function buildFish(f){
  var pal=f.pal, root=mk("g",{},fishLayer); f.root=root;
  f.glow=mk("ellipse",{cx:-4,cy:0,rx:f.kind==="hero"?128:64,ry:f.kind==="hero"?70:36,fill:"url(#glowF)"},root);
  var body=mk("g",{},root); f.bodyG=body;
  if(f.kind==="hero"){
    f.finA=finTriple(body,"#finAnalDeep","#finAnalMid","#finAnalTop",pal,1.35);
    f.finA.g.setAttribute("transform-origin","-8px 22px");
    var tail=mk("g",{},body); f.tailG=tail;
    f.finC=finTriple(tail,"#finCaudalDeep","#finCaudalMid","#finCaudalTop",pal,1.8);
    f.finC.g.setAttribute("transform-origin","-51px 0px");
    use(body,"#tintBody",pal.body,null,pal.bOp);
    use(body,"#artBody",pal.under,3.4);
    use(body,"#artBody",pal.core,1.5);
    f.finD=finTriple(body,"#finDorsalDeep","#finDorsalMid","#finDorsalTop",pal,1.1);
    f.finD.g.setAttribute("transform-origin","-2px -23px");
    var head=mk("g",{},body); f.headG=head;
    use(head,"#artHead",pal.under,3.4);
    use(head,"#artHead",pal.core,1.5);
    f.finP=finTriple(head,"#finPectDeep","#finPectMid",null,pal,0.7);
    f.finP.g.setAttribute("transform-origin","21px 5px");
    use(head,"#artPectTrail",pal.core,1.1,0.5);
  } else {
    f.finA=null; f.finD=null; f.finP=null;
    var tail2=mk("g",{},body); f.tailG=tail2;
    f.finC={g:tail2,deep:null,mid:null,top:null,lag:1.8};
    var td=mk("g",{},tail2); use(td,"#finSchoolDeep",pal.fin,null,pal.fOp[0]);
    var tm=mk("g",{},tail2); use(tm,"#finSchoolMid",pal.fin,1.0,pal.fOp[1]);
    tail2.setAttribute("transform-origin","-30px 0px");
    use(body,"#tintSchool",pal.body,null,pal.bOp);
    use(body,"#artSchool",pal.under,2.6);
    use(body,"#artSchool",pal.core,1.2);
    f.headG=null;
  }
}
function setFishTransform(f){
  var sc=f.scale*(f.spawnS<1?0.55+0.45*f.spawnS:1);
  f.root.setAttribute("transform","translate("+f.x.toFixed(1)+" "+f.y.toFixed(1)+") rotate("+(f.head*180/Math.PI).toFixed(1)+") scale("+(f.flip?-sc:sc).toFixed(3)+" "+sc.toFixed(3)+")");
  f.root.setAttribute("opacity",f.dead?0:(f.spawnS<1?(0.25+0.75*f.spawnS):1).toFixed(2));
}
/* the wave — the seed's pure function, exposed for the bench */
function waveAt(w){ return {head:3.0*Math.sin(w), body:5.5*Math.sin(w-0.7), tail:13.0*Math.sin(w-1.5)}; }
window.__wave=function(t,sp){ return waveAt(t*(1.2+2.1*sp)); };
function poseFish(f,t){
  var amp=1+1.1*f.flare;
  var spd=clamp(f.speed/(f.kind==="hero"?26:16),0.4,2.2);
  var wv=waveAt(f.w);
  var bodyA=wv.body*amp, headA=(wv.head-5*f.flare)*amp*0.6, tailA=wv.tail*amp;
  f.bodyG.setAttribute("transform","rotate("+bodyA.toFixed(2)+" 0 0)");
  if(f.headG)f.headG.setAttribute("transform","rotate("+headA.toFixed(2)+" 26 0)");
  f.tailG.setAttribute("transform","rotate("+tailA.toFixed(2)+(f.kind==="hero"?" -40 0":" 0 0")+")");
  var fins=[[f.finD,1.15],[f.finA,1.25],[f.finC,1.05],[f.finP,1.5]];
  for(var i=0;i<fins.length;i++){
    var F=fins[i][0]; if(!F)continue;
    var sw=Math.sin(f.w*0.62-F.lag)*5*amp*fins[i][1];
    var sc=1+0.55*f.flare;
    F.g.setAttribute("transform","rotate("+sw.toFixed(2)+") scale("+sc.toFixed(3)+")");
    if(F.deep)F.deep.setAttribute("opacity",(0.85+0.3*f.flare).toFixed(2));
    if(F.mid)F.mid.setAttribute("opacity",(0.85+0.3*f.flare).toFixed(2));
    if(F.top)F.top.setAttribute("opacity",(0.8+0.45*f.flare).toFixed(2));
  }
  f.wv={head:+(wv.head*amp).toFixed(2),body:+(wv.body*amp).toFixed(2),tail:+(wv.tail*amp).toFixed(2)};
}

/* ================= GRASS + BUBBLES (posed; observed animates) ======= */
var GRASS_COLS=["#27c24c","#39ff6a","#1f9d43","#7dff9a"];
var blades=[]; window.__blades=blades;
(function(){
  var g=$("grass");
  for(var i=0;i<23;i++){
    var wrap=mk("g",{},g);
    use(wrap,"#blade",GRASS_COLS[i%4],null);
    var sc=[1.15,0.8,1.3,0.95,1.2,0.75,1.35,0.9,1.1,0.7,1.25,0.85][i%12]*(i%3===2?-1:1);
    var bx=16+i*28;
    wrap.setAttribute("transform","translate("+bx+" 484) scale("+sc+" "+Math.abs(sc)+")");
    blades.push({g:wrap,x:bx,sx:sc,sy:Math.abs(sc),ph:i*1.37,amp:3.4+((i*7)%10)/4});
  }
  var b=$("bubbles");
  /* BUBBLES PASS (Nov 9, 2026, 22:33 EST): three floor streams —
     anchors on the floor line among the grass roots; four bubbles
     alive per stream, twelve total. Each bubble rides a stream
     phase p in [0,1): floor y=452 -> top waterline y=26, wobbling
     on a swept sine, radius growing x1.00 -> x1.45 across the
     rise, fading out over the last stretch as it pops AT the
     waterline, then respawning at the floor. Speeds are plain
     Math.random (dressing, deliberately NOT the house seat —
     the seat feeds the war, never the weather). */
  var STREAM_X=[140,330,508];
  for(var s=0;s<3;s++)for(var k=0;k<4;k++){
    var c=mk("circle",{cx:0,cy:0,r:3},b);
    window.__bubbles=window.__bubbles||[];
    window.__bubbles.push({el:c,sx:STREAM_X[s],p:k/4+Math.random()*0.18,
      sp:0.028+Math.random()*0.022,r0:2.1+Math.random()*1.7,
      wob:4+Math.random()*4,ph:Math.random()*6.283});
  }
})();
window.__PALETTES=PALETTES; window.__buildFish=buildFish; window.__poseFish=poseFish;
window.__setFishTransform=setFishTransform; window.__poseGrass=poseGrass; window.__poseSlick=poseSlick;
window.__mk=mk; window.__fishLayer=fishLayer; window.__burstLayer=burstLayer;
window.__PALETTES=PALETTES; window.__buildFish=buildFish; window.__poseFish=poseFish;
window.__setFishTransform=setFishTransform; window.__poseGrass=poseGrass; window.__poseSlick=poseSlick;
})();
function poseGrass(t,animate){
  for(var i=0;i<blades.length;i++){
    var bl=blades[i];
    var rot=animate?Math.sin(t*0.9+bl.ph)*bl.amp:Math.sin(bl.ph)*2;
    bl.g.setAttribute("transform","translate("+bl.x+" 484) scale("+bl.sx+" "+bl.sy+") rotate("+rot.toFixed(2)+")");
  }
  var bs=window.__bubbles||[];
  for(var j=0;j<bs.length;j++){
    var bb=bs[j];
    /* BUBBLES PASS: advance the phase only while observed; the
       rest pose (poseGrass(0,false)) freezes each bubble where
       its stream phase stands — parked mid-rise in the still.
       dt = the governor's frame estimate (~1/60 s at 60 Hz),
       the same convention __stepFish runs on. */
    if(animate)bb.p=(bb.p+bb.sp/60)%1;
    var p=bb.p, y=452-426*p,
        x=bb.sx+Math.sin(p*6.283+bb.ph)*bb.wob,

}
function endFight(kill){
  var fight=window.__fight; if(!fight)return;
  [fight.a,fight.b].forEach(function(f){
    if(f.dead)return;
    if(princip(f)){
      /* a principal returns to its rail once clear of the clash —
         it re-takes the rail at the next pole, on the blend */
      if(f.mode!=="rail"){ f.mode="retake"; f.retakeAt=Infinity; f.rail=null; }
      f.wpT=2+Math.random()*4;
    } else { f.mode="roam"; f.wpT=2+Math.random()*4; pickWaypoint(f); }
  });
  window.__fight=null;
  window.__nextFightAt=obsElapsed+45+Math.random()*75;
  fightCooldownUntil=obsElapsed+12;
  fightArmedAt=obsElapsed+20;
}

/* ---- THE VICTORY FLASH (V2, amendment 1) ----
   When a principal wins a principal fight, the whole disc takes
   the winner's colour in a breathing swell: the fill rides
   semi-transparent -> transparent -> opaque (the owner's words)
   as the colour floods the disc, holds a beat at full, then
   releases back to the line-work figure. A few seconds, start to
   finish. The beaten principal's respawn clock starts ONLY when
   the flash completes — the ceremony is paid in full before the
   tank refills. The flash advances only while OBSERVED (the
   governor calls this with frame dt); at REST its envelope
   freezes and the still poses it mid-swell — never broken. */
function flashEnv(k){
  /* k in [0,1]: dip to near-transparent early (the colour first
     THINS as it spreads), swell to opaque, hold, release */
  if(k<0.16){ var u=k/0.16; return 0.55-0.45*u; }        /* ~0.55 -> 0.10 */
  if(k<0.50){ var v=(k-0.16)/0.34; return 0.10+0.90*sstep(v); }
  if(k<0.78){ return 1; }
  var w=(k-0.78)/0.22; return 1-sstep(w);
}
function paintFlash(){
  var disc=document.getElementById("flashDisc"), lab=document.getElementById("flashLabel"),
      labG=document.getElementById("flashLabelGlow");
  var fl=window.__flash;
  if(!disc)return;
  if(!fl){ disc.setAttribute("opacity",0); if(lab)lab.setAttribute("opacity",0); if(labG)labG.setAttribute("opacity",0); return; }
  var k=fl.t/fl.dur, breath=0.92+0.08*Math.sin(fl.t*4.2);
  var op=flashEnv(k)*breath;
  disc.setAttribute("fill",fl.color);
  disc.setAttribute("opacity",op.toFixed(3));
  var lop=(k<0.2?0:Math.min(1,(k-0.2)/0.2))*(k>0.8?Math.max(0,1-(k-0.8)/0.2):1);
  if(lab){ lab.textContent=fl.label; lab.setAttribute("fill",fl.color); lab.setAttribute("opacity",lop.toFixed(2)); }
  if(labG){ labG.textContent=fl.label; labG.setAttribute("opacity",(lop*0.9).toFixed(2)); }
}
function stepFlash(dt){
  var fl=window.__flash; if(!fl)return;
  fl.t+=dt;
  if(fl.t>=fl.dur){
    window.__flash=null;
    /* the ceremony is complete: NOW the beaten fish may return */
    var dr=window.__deferredRespawn;
    if(dr.f){ window.__pendingRespawn=dr.f; window.__respawnAt=obsElapsed+0.4; dr.f=null; }
  }
  paintFlash();
}
window.__stepFlash=stepFlash;
window.__paintFlash=paintFlash;

/* expose the bench handles the driver needs */
window.__fightStep=stepFight; window.__stepFish=stepFish; window.__stepBursts=stepBursts;
window.__doRespawn=doRespawn; window.__respawnState=function(){return {at:window.__respawnAt,pending:!!window.__pendingRespawn};};
window.__pickWaypoint=pickWaypoint;
window.__fightState=function(){var f=window.__fight;return f?{phase:f.phase,t:+f.t.toFixed(2)}:null;};
window.__setNextFight=function(v){ window.__nextFightAt=v; };
window.__obsElapsed=function(){ return obsElapsed; };
})();
</script>
<script>
(function(){
"use strict";
var PALETTES=window.__PALETTES, buildFish=window.__buildFish, poseFish=window.__poseFish,
    setFishTransform=window.__setFishTransform, pickWaypoint=window.__pickWaypoint,
    poseGrass=window.__poseGrass, poseSlick=window.__poseSlick;
/* ================= THE SCHOOL — two riders + two floaters ======
   THE MIRROR (V2, the owner's symmetry principle): ONE rider
   definition, instanced twice under the half-turn symmetry of
   the disc — rotation by PI about the centre (320,225), written
   here as (yin, yang) = (+1,+1) and its transform (-1,-1). The
   SAME code path steps both riders; the second is the first with
   every signed field negated. Nothing about either side is
   hand-written separately: yang rides the geometry as yin does,
   mirrored — the system is exactly fair between the two sides,
   and the war's randomness is the symmetric motion itself: the
   phase drift between the riders, and the choices the house
   seat shuffles at the equal-and-opposite turning points.
     YANG = the BLUE fish (PALETTES[0]), solid rail, dir -1.
     YIN  = the RED fish (PALETTES[1]), dotted rail, dir +1 —
   the owner's mapping (Nov 9, 2026, 22:22 EST). Each rider is
   the other rotated half a turn: position negated about the
   centre, heading negated, arc length on its own rail measured
   from its own pole — mirror images in one routine.
   The floaters (school art, UAP cyan + magenta) swim free as V1. */
function rider(side){
  var m=(side==="yang")?-1:1;
  return {
    kind:"hero", role:"principal", side:side, mirror:m,
    scale:0.92, pal:(side==="yang")?PALETTES[0]:PALETTES[1],
    rail:(side==="yang")?"solid":"dotted",
    x:320, y:(m<0)?107:343, head:(m<0)?-Math.PI/2:Math.PI/2,
    rs:0, rsPrev:0, dir:-m, cruise:22,
    yin:m, yang:m, hex:m,
    statPoles:0, statSwitches:0, vx:0, vy:0,
    speed:22, w:0, flare:0, mode:"rail", dead:false, spawnS:1,
    wpT:6, ph:0, retakeAt:Infinity
  };
}
var fishes=[
 rider("yang"),
 rider("yin"),
 {kind:"school",  scale:1.0,  pal:PALETTES[2], x:150, y:330, head:-0.5,  speed:13, w:1.1, flare:0, mode:"roam", dead:false, spawnS:1, wpT:5, ph:4.0},
 {kind:"school",  scale:0.88, pal:PALETTES[3], x:492, y:150, head:2.6,   speed:13, w:3.3, flare:0, mode:"roam", dead:false, spawnS:1, wpT:7, ph:5.3}
];
/* seat the riders on their rails, at their own poles; their
   opening phases drawn from the house seat — shared stream */
var RP=window.__railPoles, HR=window.__hrng;
fishes.forEach(function(f){
  if(f.role==="principal"){
    f.rs=RP[f.rail][f.mirror<0?"T":"B"]; f.rsPrev=f.rs;
    f.ph=HR()*6.283; f.w=HR()*6.283;
    var p=window.__rails[f.rail].posAt(f.rs); f.x=p.x; f.y=p.y;
  }
  pickWaypoint(f); buildFish(f); poseFish(f,0); setFishTransform(f);
});
window.__fishes=fishes;

/* ================= THE TERM BATTLE PANEL =================
   The counts stand on the face, in the still and in motion
   alike; the record itself is kept by the motion script. */
var term=window.__term;
if(!term.seeded){ term.seeded=1; if(term.spawns<4)term.spawns=4; window.__termSave(); }
function setT(a,b,v){ var e1=document.getElementById(a), e2=document.getElementById(b); if(e1)e1.textContent=v; if(e2)e2.textContent=v; }
function updateTerm(){
  setT("termYinGlow","termYin","YIN "+term.yinWins);
  setT("termYangGlow","termYang","YANG "+term.yangWins);
  setT("termCountsGlow","termCounts","TERM · SPAWNS "+term.spawns+" · RESPAWNS "+term.respawns);
}
window.__updateTerm=updateTerm;
updateTerm();

/* ================= BATTERY V2 GOVERNOR — the house contract =========
   Mirrors Merry's Garden (Nov 9) exactly in mechanism: REST still /
   OBSERVED spectacle, the ApexFace hook, the same signal family,
   12 s auto-exit, no wake-lock of any kind. */
var REST="rest", OBSERVED="observed";
var state=REST, raf=0, exitTimer=0, obsStart=0, lastMs=-1;
var gov={state:"rest", enters:0, rests:0, lastSignal:"boot"};
window.__governor=gov;
window.__faceRest=true;
function stillPass(){
  /* one time-true still pass (V2): the riders posed ON their
     rails — the frozen ride re-seats them exactly on the curve;
     a rider caught off-rail (or a floater) poses where it swims.
     The victory flash, if the face rested mid-ceremony, poses
     its envelope frozen — the disc in the winner's colour,
     mid-swell, never a broken state. Grass in one pose, bubbles
     parked. No loop runs at REST. */
  fishes.forEach(function(f){
    if(f.dead)return;
    if(f.mode==="rail"&&window.__rails){
      var p=window.__rails[f.rail].posAt(f.rs); f.x=p.x; f.y=p.y;
    }
    poseFish(f,0); setFishTransform(f);
  });
  if(window.__paintFlash)window.__paintFlash();
  updateTerm();
  poseGrass(0,false); poseSlick(0);
}
function obsFrame(nowMs){
  if(state!==OBSERVED)return;
  var dt=0;
  if(lastMs>=0)dt=Math.min(0.05,(nowMs-lastMs)/1000);
  lastMs=nowMs;
  obsElapsed=(nowMs-obsStart)/1000;
  var t=obsElapsed;
  window.__fightStep(dt);
  for(var i=0;i<fishes.length;i++)window.__stepFish(fishes[i],dt,t);
  window.__stepBursts(dt);
  if(window.__stepFlash)window.__stepFlash(dt);
  var rs=window.__respawnState();
  if(rs.pending&&rs.at>0&&t>=rs.at)window.__doRespawn();
  poseGrass(t,true); poseSlick(t);
  refreshState(t);
  raf=requestAnimationFrame(obsFrame);
}
function refreshState(t){
  var st={t:+t.toFixed(2), state:state, fish:[], fight:window.__fightState(),
          rails:window.__railState, flash:window.__flash?{side:window.__flash.side,t:+window.__flash.t.toFixed(2)}:null,
          term:{yin:term.yinWins, yang:term.yangWins, spawns:term.spawns, respawns:term.respawns}};
  fishes.forEach(function(f){
    st.fish.push({pal:f.pal.name, kind:f.kind, side:f.side||null, rail:f.rail||null,
      x:+f.x.toFixed(0), y:+f.y.toFixed(0),
      head:+(f.head*180/Math.PI).toFixed(0), flare:+f.flare.toFixed(2),
      dead:f.dead, spawn:+f.spawnS.toFixed(2), mode:f.mode});
  });
  window.__state=st;
}
function setLamp(){ /* this face carries no lamp element; state rides window.__governor */ }
function observe(sig){
  /* every keeper signal joins the face's history — the count is
     part of the house seat's seed, so the war never replays */
  term.sigs++; window.__termSave();
  if(state!==OBSERVED){
    state=OBSERVED; obsStart=performance.now(); lastMs=-1; obsElapsed=0;
    gov.state="observed"; gov.enters++; window.__faceRest=false;
    if(window.__pinFight){ window.__setNextFight(2); window.__pinFight=false; }
    raf=requestAnimationFrame(obsFrame);
  }
  gov.lastSignal=sig||"signal";
  if(exitTimer)clearTimeout(exitTimer);
  exitTimer=setTimeout(function(){ rest("auto-exit"); },12000);   /* 12 s auto-exit */
}
function rest(sig){
  if(state===REST){ gov.lastSignal=sig||gov.lastSignal; stillPass(); return; }
  state=REST;
  gov.state="rest"; gov.rests++; gov.lastSignal=sig||"signal";
  window.__faceRest=true;
  if(raf)cancelAnimationFrame(raf); raf=0;
  if(exitTimer){ clearTimeout(exitTimer); exitTimer=0; }
  obsElapsed=0;
  stillPass();                            /* one time-true still pass */
}
function toggle(){ (state===OBSERVED)?rest("toggle"):observe("toggle"); }
window.ApexFace={
  observe:function(){ observe("container-observe"); },
  rest:function(){ rest("container-rest"); },
  toggle:toggle,
  state:function(){ return state; }
};
window.__pinFight=/[?&]fight=1/.test(window.location.search);
window.addEventListener("apex-face-observe",function(){ observe("event-observe"); });
window.addEventListener("apex-face-rest",function(){ rest("event-rest"); });
window.addEventListener("focus",function(){ if(!document.hidden)observe("focus"); });
window.addEventListener("blur",function(){ rest("blur"); });
window.addEventListener("pointerdown",function(){ observe("pointer"); },true);
window.addEventListener("touchstart",function(){ observe("touch"); },true);
window.addEventListener("keydown",function(){ observe("key"); },true);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ rest("hidden"); }
  else if(document.hasFocus&&document.hasFocus()){ observe("visible"); }
  else { stillPass(); }
});

/* ---- Boot: REST still pass. The clock's own 200 ms interval (part
   1) is the only timer that runs at rest. No wake-lock. ---- */
stillPass(); refreshState(0);
if(/[?&]face=observed/.test(location.search))observe("boot-param");
})();
</script>
