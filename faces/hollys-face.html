<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HOLLYWOOD — Holly's Face · Game Skin</title>
<style>
  :root{
    --bg:#0b0714; --line:#a778ff; --purple:#a778ff; --purple2:#c9a6ff; --deep:#6d3fd4;
    --cyan:#3ae2ff; --amber:#ffcf4d; --text:#efe9ff; --dim:#b7a8d9;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:var(--bg); }
  body { font-family:'Courier New',Courier,monospace; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; overflow:hidden;
    background:
      radial-gradient(120% 60% at 80% -10%, rgba(109,63,212,.35), transparent 60%),
      radial-gradient(100% 50% at 0% 110%, rgba(58,226,255,.12), transparent 55%),
      var(--bg); }
  #face { position:absolute; display:flex; flex-direction:column; align-items:stretch; justify-content:center; }
  .px { font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  /* ---- beveled game plates with rivets (her world-2 direction furniture) ---- */
  .plate { position:relative; border:3px solid var(--line); border-radius:10px;
    background:linear-gradient(180deg, rgba(64,38,110,.65), rgba(24,14,44,.88));
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.28), inset -3px -3px 0 rgba(0,0,0,.55),
      0 6px 18px rgba(0,0,0,.5); }
  .rivet { position:absolute; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8dcff, #6d3fd4 70%); box-shadow:0 0 0 2px rgba(0,0,0,.45); }
  .rivet.tl{ top:5px; left:5px } .rivet.tr{ top:5px; right:5px }
  .rivet.bl{ bottom:5px; left:5px } .rivet.br{ bottom:5px; right:5px }
  /* ---- name plate ---- */
  #nameplate { border-color:var(--cyan); text-align:center;
    background:linear-gradient(180deg, rgba(42,20,84,.92), rgba(20,10,40,.96));
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.25), inset -3px -3px 0 rgba(0,0,0,.6), 0 0 18px rgba(58,226,255,.25); }
  #name { color:var(--purple2); text-shadow:3px 3px 0 #2a1060, 5px 5px 0 rgba(0,0,0,.55); }
  #name .star { color:var(--amber); text-shadow:2px 2px 0 rgba(20,8,50,.9); }
  .shimmer { display:flex; justify-content:center; }
  .shimmer i { display:block; background:var(--cyan); opacity:.25; }
  .shimmer i.on { opacity:1; box-shadow:0 0 6px rgba(58,226,255,.8); }
  /* ---- time plate: TIME is the headline stat ---- */
  #timeplate { text-align:center; }
  .platehead { border-bottom:3px solid var(--cyan); border-radius:7px 7px 0 0;
    background:linear-gradient(180deg, rgba(58,226,255,.28), rgba(58,226,255,.06));
    color:#dff8ff; text-align:center; text-shadow:2px 2px 0 rgba(20,8,50,.9); }
  #clock { color:#fff; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;
    text-shadow:3px 3px 0 #2a1060, 0 0 22px rgba(167,120,255,.55); }
  #clock .colon { color:var(--purple2); }
  #clock .colon.off { color:rgba(201,166,255,.25); text-shadow:none; }
  #clock .sec { color:var(--cyan); }
  #date { color:var(--dim); font-variant-numeric:tabular-nums; }
  /* ---- companion plate: Ember, original dragon, game ornament ---- */
  #compplate .comp { display:flex; align-items:stretch; }
  #portrait { border:3px solid var(--cyan); border-radius:8px;
    background:radial-gradient(90% 90% at 50% 20%, rgba(109,63,212,.5), rgba(12,6,24,.92));
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.25), inset -3px -3px 0 rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  #portrait svg { filter:drop-shadow(0 0 8px rgba(167,120,255,.6)); display:block; }
  #portrait img { filter:drop-shadow(0 0 8px rgba(0,0,0,.6)); display:block; object-fit:contain; }
  .compinfo { flex:1; min-width:0; }
  #compname { color:#fff; background:linear-gradient(180deg, rgba(140,90,255,.85), rgba(90,45,200,.85));
    border:2px solid var(--purple2); border-radius:6px; display:inline-block;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.45); }
  .statrow { display:flex; align-items:center; }
  .statrow .k { color:var(--purple2); flex:0 0 auto; }
  .bar { flex:1; border:2px solid rgba(0,0,0,.7); border-radius:3px; background:#170b2c; overflow:hidden; }
  .bar i { display:block; height:100%; }
  .bar .p { background:repeating-linear-gradient(90deg, #b18cff 0 7px, #8c5aff 7px 9px); }
  .bar .c { background:repeating-linear-gradient(90deg, #7df3ff 0 7px, #25c8ec 7px 9px); }
  .bar .a { background:repeating-linear-gradient(90deg, #ffe27a 0 7px, #f5b921 7px 9px); }
  .statrow .v { color:#fff; flex:0 0 auto; text-align:right; }
  #ornament { color:var(--dim); text-align:center; }
  /* ---- battery plate: game bar styling, REAL value ---- */
  #battplate .battrow { display:flex; align-items:center; }
  #battplate .k { color:var(--purple2); flex:0 0 auto; }
  #batt { color:#fff; font-variant-numeric:tabular-nums; flex:0 0 auto; text-align:right; }
  #foot { color:var(--amber); text-align:center; text-shadow:2px 2px 0 rgba(20,8,50,.9); }
  /* ---- GLASS HOUSE finish, V16 TONED (correction per Holly via Anthony,
     Nov 8 00:08): the light on the plates is quieter now — sheen and the
     traced edge stay, the glow is turned down. The sparkle itself moved to
     the wallpaper of her big page; a watch face does not scroll, so the
     plates here simply rest calm under glass. Finish only. ---- */
  .plate{ outline:1px solid rgba(201,166,255,.30); outline-offset:2px; }
  .plate::after{ content:""; position:absolute; inset:0; border-radius:8px; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,0) 58%);
    box-shadow:inset 0 0 0 1px rgba(201,166,255,.35), inset 0 0 8px rgba(167,120,255,.15); }
  #portrait{ position:relative; outline:1px solid rgba(201,166,255,.30); outline-offset:2px; }
  #portrait::after{ content:""; position:absolute; inset:0; border-radius:6px; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 40%, rgba(255,255,255,0) 60%);
    box-shadow:inset 0 0 0 1px rgba(201,166,255,.32), inset 0 0 7px rgba(167,120,255,.13); }
  #compname{ box-shadow: inset 1px 1px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.45),
    inset 0 10px 12px -10px rgba(255,255,255,.28), 0 0 0 1px rgba(201,166,255,.32);
    outline:1px solid rgba(201,166,255,.28); outline-offset:1px; }
</style></head>

<script>
  // HOLLY'S FACE (Nov 7, 2026) — a watch face of her own, built on the
  // proven Lokmat FIT chassis pattern (stage measure/layout, real clock,
  // real battery via the device hook — the plumbing carried from Signal
  // Scope V4). The skin is her world-2 style direction, per her design
  // render: chunky beveled game plates with rivets, purple loud with
  // bright cyan beside it, pixel-style labels, Glass House dark beneath.
  // Ember is an ORIGINAL dragon (house-drawn) — era/style is direction
  // only; no borrowed characters, logos, or names appear anywhere.
  // SYMBOL (Nov 7, 17:20): the portrait now shows the symbol Holly chose
  // and sent herself — a transparent picture, embedded exactly as sent.
  // It replaced the purple mark on this face, the Shelf and the Gate,
  // as she asked. The game bars below still describe Ember, her companion.
  // HONESTY RAILS: this face carries NO biometric claims and NO sensor
  // imitation. The companion stat bars (FLIGHT / BOND / SWIMMING) are
  // GAME ORNAMENT in her canon flavour, labelled as such on the face,
  // and carry star glyphs, not numbers. The ONLY measured value on the
  // face is the battery: the bar wears game styling, the percentage is
  // the real device battery where the hook answers, and the honest
  // dash where it does not.
  var stage = document.getElementById('stage');
  var W = 0, H = 0, built = false;
  var battPct = null;   // real battery %, or null when no hook answers
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; }
  function measure() {
    var vv = window.visualViewport;
    W = Math.floor(vv ? vv.width : window.innerWidth);
    H = Math.floor(vv ? vv.height : window.innerHeight);
    if (!W || !H) { W = document.documentElement.clientWidth || 300; H = document.documentElement.clientHeight || 400; }
  }
  function layout() {
    measure();
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    var D = Math.floor(Math.min(W, H) * 0.96);
    var face = document.getElementById('face');
    face.style.width = D + 'px';
    face.style.left = Math.floor((W - D) / 2) + 'px';
    face.style.top = Math.floor(H * 0.03) + 'px';
    face.style.height = Math.floor(H * 0.94) + 'px';
    var gap = Math.max(6, Math.floor(D * 0.022));
    face.style.gap = gap + 'px';
    var padX = Math.floor(D * 0.045), padY = Math.floor(D * 0.026);
    var plates = face.querySelectorAll('.plate');
    for (var i = 0; i < plates.length; i++) {
      plates[i].style.padding = padY + 'px ' + padX + 'px';
      plates[i].style.borderWidth = Math.max(2, Math.floor(D * 0.008)) + 'px';
    }
    var name = document.getElementById('name');
    name.style.fontSize = Math.floor(D * 0.072) + 'px';
    var shim = document.getElementById('shimmer');
    shim.style.gap = Math.floor(D * 0.014) + 'px';
    shim.style.marginTop = Math.floor(D * 0.016) + 'px';
    var dots = shim.querySelectorAll('i');
    var ds = Math.max(3, Math.floor(D * 0.016));
    for (var j = 0; j < dots.length; j++) { dots[j].style.width = ds + 'px'; dots[j].style.height = ds + 'px'; }
    var head = document.getElementById('timehead');
    head.style.fontSize = Math.max(9, Math.floor(D * 0.034)) + 'px';
    head.style.margin = (-padY) + 'px ' + (-padX) + 'px ' + Math.floor(D * 0.018) + 'px';
    head.style.padding = Math.floor(D * 0.014) + 'px 0';
    var clock = document.getElementById('clock');
    clock.style.fontSize = Math.floor(D * 0.155) + 'px';
    clock.style.marginTop = Math.floor(D * 0.012) + 'px';
    var date = document.getElementById('date');
    date.style.fontSize = Math.max(10, Math.floor(D * 0.040)) + 'px';
    date.style.marginTop = Math.floor(D * 0.014) + 'px';
    var portrait = document.getElementById('portrait');
    var ps = Math.floor(D * 0.26);
    portrait.style.width = ps + 'px'; portrait.style.height = ps + 'px';
    portrait.style.marginRight = Math.floor(D * 0.035) + 'px';
    var ember = document.getElementById('ember');
    ember.style.width = Math.floor(ps * 0.82) + 'px'; ember.style.height = Math.floor(ps * 0.82) + 'px';
    var compname = document.getElementById('compname');
    compname.style.fontSize = Math.max(9, Math.floor(D * 0.034)) + 'px';
    compname.style.padding = Math.floor(D * 0.010) + 'px ' + Math.floor(D * 0.022) + 'px';
    var rows = document.querySelectorAll('#compplate .statrow');
    for (var r = 0; r < rows.length; r++) {
      rows[r].style.marginTop = Math.floor(D * 0.020) + 'px';
      rows[r].style.fontSize = Math.max(8, Math.floor(D * 0.030)) + 'px';
      rows[r].style.gap = Math.floor(D * 0.018) + 'px';
      rows[r].querySelector('.k').style.width = Math.floor(D * 0.20) + 'px';
      rows[r].querySelector('.v').style.width = Math.floor(D * 0.17) + 'px';
      rows[r].querySelector('.bar').style.height = Math.max(7, Math.floor(D * 0.032)) + 'px';
    }
    var ornament = document.getElementById('ornament');
    ornament.style.fontSize = Math.max(7, Math.floor(D * 0.024)) + 'px';
    ornament.style.marginTop = Math.floor(D * 0.020) + 'px';
    var brow = document.querySelector('#battplate .battrow');
    brow.style.fontSize = Math.max(10, Math.floor(D * 0.038)) + 'px';
    brow.style.gap = Math.floor(D * 0.020) + 'px';
    brow.querySelector('.k').style.width = Math.floor(D * 0.13) + 'px';
    brow.querySelector('.bar').style.height = Math.max(9, Math.floor(D * 0.040)) + 'px';
    document.getElementById('batt').style.width = Math.floor(D * 0.15) + 'px';
    var foot = document.getElementById('foot');
    foot.style.fontSize = Math.max(8, Math.floor(D * 0.028)) + 'px';
    built = true;
  }
  function renderBatt() {
    var el = document.getElementById('batt');
    var fill = document.getElementById('battfill');
    if (battPct !== null) {
      el.textContent = battPct + '%';
      fill.style.width = battPct + '%';
    } else {
      el.textContent = '—';           // honest dash: no hook answered
      fill.style.width = '0%';
    }
  }
  // bridge batt (the estate container hook, same plumbing as V4) — the
  // ONLY bridge field this face reads; it displays no other feed.
  function readBridge() {
    if (window.ApexSensors) {
      var v = num(window.ApexSensors.batt);
      if (v !== null) { battPct = Math.round(v); renderBatt(); }
    }
  }
  var tickCount = 0;
  function tick() {
    var d = new Date(), h = d.getHours() % 12; if (h === 0) h = 12;
    tickCount++;
    var colonOff = (tickCount % 2 === 0);   // blinking cursor beat, 1s
    document.getElementById('clock').innerHTML =
      pad(h) + '<span class="colon' + (colonOff ? ' off' : '') + '">:</span>' + pad(d.getMinutes()) +
      ' <span class="sec">' + pad(d.getSeconds()) + '</span>';
    document.getElementById('date').textContent =
      d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
    // pixel shimmer: one lit square walks the row under her name
    var dots = document.getElementById('shimmer').querySelectorAll('i');
    for (var j = 0; j < dots.length; j++) {
      if (j === (tickCount % dots.length)) dots[j].className = 'on'; else dots[j].className = '';
    }
    renderBatt();
  }
  layout();
  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  tick(); setInterval(tick, 500);
  readBridge(); setInterval(readBridge, 1000);
  if (navigator.getBattery) {
    navigator.getBattery().then(function (b) {
      function upd() { battPct = Math.round(b.level * 100); renderBatt(); }
      upd(); b.addEventListener('levelchange', upd);
    }).catch(function () { /* no battery hook — the dash stands */ });
  }

  /* ===== PERSONALIZATION — this face's own values (fourth–sixth refinements,
     Nov 8, 2026). The set: (1) the companion PICTURE — swappable; Holly's
     dragon-ring picture is the default, an original house sparkle-star is
     the second picture in the file; tap the picture to change it.
     (2) THE PERSON'S NAME in the star plate (default HOLLYWOOD) — tap the
     name plate and type. (3) THE COMPANION'S NAME (default Ember) — tap
     the name tag and type. (4) THE STATS (Flight / Bond stars 0–5, game
     values she sets — never readings) — tap a stat row and type 0–5.
     Values save on the device this face is open on (localStorage,
     hollyFace.pers.v1). The face is a separate file from her big page, so
     these are the FACE's own saved values; nothing syncs between the two
     files by itself. Editing uses the browser's own typing box (prompt);
     if a watch browser will not show that box, the values stay as they
     are and the picture tap still works. ===== */
  (function(){
    var DEF = { personName:'HOLLYWOOD', companionName:'Ember', flight:4, bond:4, pic:0 };
    var pers = {}; for (var k in DEF) pers[k] = DEF[k];
    try { var sv = JSON.parse(localStorage.getItem('hollyFace.pers.v1')); if (sv) { for (var k2 in DEF) { if (sv[k2] != null) pers[k2] = sv[k2]; } } } catch(e){}
    var STAR_PIC = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,4 61,38 97,38 68,59 79,93 50,72 21,93 32,59 3,38 39,38" fill="#c9a6ff" stroke="#ffffff" stroke-width="3"/></svg>');
    var imgEl = document.getElementById('ember');
    var dragonPic = imgEl ? imgEl.src : '';
    function stars(n){ var s=''; for (var i=0;i<5;i++){ s += (i<n ? '\u2605' : '\u2606'); } return s; }
    function save(){ try { localStorage.setItem('hollyFace.pers.v1', JSON.stringify(pers)); } catch(e){} }
    function apply(){
      var nm = document.getElementById('name');
      if (nm) nm.innerHTML = '<span class="star">\u2605</span> ' + pers.personName + ' <span class="star">\u2605</span>';
      var cn = document.getElementById('compname'); if (cn) cn.textContent = pers.companionName + ' \u00B7 Companion';
      var sf = document.getElementById('statFlight'); if (sf) sf.textContent = stars(pers.flight);
      var sb = document.getElementById('statBond'); if (sb) sb.textContent = stars(pers.bond);
      var bf = document.getElementById('barFlight'); if (bf) bf.style.width = (pers.flight*20) + '%';
      var bb = document.getElementById('barBond'); if (bb) bb.style.width = (pers.bond*20) + '%';
      if (imgEl) imgEl.src = pers.pic ? STAR_PIC : dragonPic;
    }
    apply();
    var portrait = document.getElementById('portrait');
    if (portrait) portrait.addEventListener('click', function(){ pers.pic = pers.pic ? 0 : 1; save(); apply(); });
    var nameEl = document.getElementById('name');
    if (nameEl) nameEl.addEventListener('click', function(){ var v = window.prompt('Your name for the star plate', pers.personName); if (v != null && v.trim()) { pers.personName = v.trim().toUpperCase(); save(); apply(); } });
    var compEl = document.getElementById('compname');
    if (compEl) compEl.addEventListener('click', function(){ var v = window.prompt("Your companion's name", pers.companionName); if (v != null && v.trim()) { pers.companionName = v.trim(); save(); apply(); } });
    var rows = document.querySelectorAll('#compplate .statrow');
    function statTap(row, key){ if (!row) return; row.addEventListener('click', function(){ var v = window.prompt('Game stars for this row, 0 to 5', String(pers[key])); if (v != null) { var n = parseInt(v, 10); if (!isNaN(n)) { pers[key] = Math.max(0, Math.min(5, n)); save(); apply(); } } }); }
    statTap(rows[0], 'flight'); statTap(rows[1], 'bond');
  })();
</script>
</body></html>
