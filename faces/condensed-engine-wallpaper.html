  CONDENSED ENGINE FACE No.1 (Nov 8, 2026).

  OWNER VERDICT + ORDER: of the Gemini engine renders, the SQUARE
  portrait is the one he ruled PERFECT (Nov 8, 04:14 EST): "the real
  engine with a digital clock overlay." His order (04:16): "Let's
  see it, man. Produce it. I want to put it on my watch and lay down
  and watch it tick." This file is that portrait REBUILT IN CODE, in
  the house's own hand — drawn machinery, never the render's pixels.

  WATCH-LANDING-FIRST (owner correction, 04:16): no engine graphic
  has ever landed on his actual watch — only small clock faces and
  stills. So this face (1) carries the house's MEASURE-AND-JAM FIT
  ROUTINE (prior art: the Nov 6 live-fit waterfall face): it measures
  the real visible size at runtime — visualViewport, then
  innerWidth/Height, then clientWidth/Height — and lays out in
  EXPLICIT PIXELS from that measurement. The watch's true glass size
  is NOT settled and is never guessed here; the routine measures it.
  (2) It lands via its HOSTED LINK opened in the watch's browser —
  the file-open path on the watch renders BLACK (proven Nov 7) and
  is not relied on. (3) At small measured sizes it applies a
  MEASURED THINNING (the square v3 precedent): the finest pinion
  layer drops first; rings, hub, counters, circuit field and the
  clock stay full-weight, and the seconds tick stays exact.

  THE PIECES (nothing else):
    · The case — chunky frame, four hex bolts, case words
      ADJUST / MODE / LIGHT / START·STOP (hardware vernacular).
    · THE ENGINE, wall-to-wall — the gold HALF-HOUR arc-ring, the
      great translucent blue cadence ring with the DAILY gold hub,
      copper/rust gear masses, meshing pinions, station names in
      the metal (AGGREGATE ENGINE / MATH + CREATION / FACTORY CI /
      DAILY / GROWTH / DOCS PROV / MANUS MIRROR), the three cadence
      counter chips, the green circuit + binary field at the right
      (the waterfall worked into the metal there), STEP-UP ×10,
      the hazard bar.
    · THE CLOCK OVERLAY — live Detroit time, Casio-weight amber
      digits dead centre, big seconds, PM, day-date, ALM SIG /
      SPL TMR. The tick is the real second, stepping.

  MOTION LAW (owner, 04:14: "everything in it moving the way the
  real engine does"): every rotating element turns at the engine's
  TRUE cadence ratios 3:10:30:1440 (pulse 3m : volley 10m :
  half-hour 30m : daily), time-compressed ×10 (display periods
  18s : 60s : 180s : 8640s). Angles are computed from ABSOLUTE
  elapsed time — never accumulated, no drift, pauses hidden.
  The counter chips read TRUE CADENCE POSITIONS computed from
  absolute time (position within the parent cycle block:
  pulses-in-36-min /12, volleys-in-100-min /10, half-hours-in-5-h
  /10) — cadence, not telemetry, the board's standing honesty.

  THE LIVE FEED rides the FACTORY CI station lamp (this face has
  no tach dials — those are the rectangle's): the face embeds the
  last samples of tach-samples.jsonl (the Merge Spindle's ledger)
  and tries a beside-file fetch at runtime. Lamp law: fresh +
  motion (rpm > 0) = lit green steady; fresh + flat with a red PR
  (the stall signature) = lit RED; fresh + flat, no red = soft
  amber; stale (> 20 min) = dimmed to rest; no samples = dark
  (NO MEASURE). No numeric display is invented for this face.

  THE FOUNDING STRIP IS OMITTED — the portrait carries none and
  the owner's piece list for this face is the picture. It stands
  on the square. Styling is a LIBRARY CALL: the LIBRARY_CARD block
  at the head of the script; every styled element reads from it.

  BENCH TIME (measured end-of-run, THE BENCHMARK: total elapsed
  to a completed CORRECT result, cycles counted):
  TOTAL sculpt-to-finished: ~7 MINUTES — dispatch 04:16 EST to
  the verified product with hosted link live at 04:23:11 EST.
  Receipt: build start ~04:17 · first complete file ~04:20 ·

  DIGIT RESTYLE (owner spec, Nov 8, 04:31 EST — surgical revision,
  digits only): "digital like Casio letters with the cutouts in
  the corners. And make them hollow — OLED black in the middle."
  The solid block monospace digits are gone. The clock family —
  time, seconds, AM/PM, day-date, and the ALM SIG / SPL TMR
  indicators — now renders in DSEG7 Classic (Bold), the classic
  Casio segment font, embedded as the @font-face below (SIL Open
  Font License 1.1; asset reused from the house's own Nov 6 APEX
  face — zero external calls, single file), and every glyph is
  HOLLOW: the glyph interiors are painted OLED black (#000, the
  unlit ground — pixel-proven at bench: the open mid-cell of the

  to the glass ground beside it; its flat-black fill is what
  reads there, not the machine behind) ringed by a continuous
  amber outline
  (-webkit-text-stroke + paint-order in the card's digit amber),
  so the digits read as lit segment frames with black hearts.
  Segment cut corners are the font's own cut-corner segment forms.
  Nothing else changed — same composition, motion, fit, feed.
  BENCH TIME (digit restyle): dispatched 04:31 EST → verified

  (1) DATE — font 37 → 33 and placement moved left (292,60) →

  (2) AM/PM — font 29 → 25, moved (64,170) → (58,150): clear

  (3) HALF-HOUR arc lettering — the "stray HA" was this arc text:

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; overflow:hidden; }
  body { font-family:ui-monospace, Menlo, Consolas, monospace; }
  #stage { position:absolute; background:#000; overflow:hidden; }
  #faceSvg { position:absolute; left:0; top:0; display:block; }
  .clk { position:absolute; color:#000;   /* HOLLOW: the glyph heart is
           OLED black — the fill paints the interiors the ground's black */
         font-family:"ApexDigital","Courier New",monospace; font-weight:700;
         -webkit-text-stroke:3.4px var(--digit,#ffb52e); paint-order:stroke fill;
         line-height:1; white-space:nowrap; letter-spacing:.02em;
         text-shadow:0 0 9px rgba(255,181,46,.5), 0 0 26px rgba(255,150,20,.30); }
  /* the seconds sit smaller: a slightly lighter stroke keeps the
     outline continuous at that size without closing the hollow */
  #sec { -webkit-text-stroke-width:3px; }
  /* the small indicator words: plain small caps in the body mono,
     solid face amber — DSEG at 14px muddies the letterforms (its
     M and S exist only as digit-glyph approximations), so these two
     words take the pre-restyle treatment; legibility wins */
  #alm { font-family:ui-monospace, Menlo, Consolas, monospace;
         color:var(--digit,#ffb52e); -webkit-text-stroke:0;
         text-shadow:0 0 6px rgba(255,181,46,.35); }
  /* the AM/PM marker takes the same plain treatment (pass 4):
     DSEG's A/M exist only as digit-glyph approximations and at
     segment weight the marker merged into the leading hour digit;
     plain caps read instantly as letters. DSEG keeps the numbers. */
  #pm { font-family:ui-monospace, Menlo, Consolas, monospace;
        color:var(--digit,#ffb52e); -webkit-text-stroke:0;
        letter-spacing:.08em;
        text-shadow:0 0 6px rgba(255,181,46,.35); }
  #digitShade { position:absolute;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,.55) 30%, rgba(0,0,0,0) 72%); }
  #binaryField { position:absolute; overflow:hidden; color:rgba(126,231,135,.85);
    font-weight:700; white-space:nowrap; pointer-events:none; }
  #binaryField .bcol { display:inline-block; vertical-align:top; }
  .lab { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700;
         fill:#e8d9a0; paint-order:stroke; stroke:rgba(0,0,0,.6); stroke-width:2.5px; }
  .chipT { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700; fill:#ffb52e; }
  body.thin .fine { display:none; }

  var pts=[], N=teeth*4;

var binCols = [], binTimer = null;
function buildBinary(){
  var field = document.getElementById("binaryField");
  field.innerHTML = ""; binCols = [];
  var n = CARD.waterfall.columns;
  for(var c=0;c<n;c++){
    var span=document.createElement("span"); span.className="bcol";
    var chars=[];
    for(var i=0;i<16;i++) chars.push(Math.random()>0.5?"1":"0");
    span.textContent = chars.join("\n");
    span.style.whiteSpace="pre";
    field.appendChild(span);
    binCols.push({el:span, chars:chars});
  }
  if(binTimer) clearInterval(binTimer);
  binTimer = setInterval(function(){
    if(document.hidden) return;
    binCols.forEach(function(col){
      col.chars.pop(); col.chars.unshift(Math.random()>0.5?"1":"0");
      col.el.textContent = col.chars.join("\n");

    for(var i=0;i<ROT.length;i++){

      r.g.setAttribute("transform","rotate("+a.toFixed(2)+" "+r.cx+" "+r.cy+")");

  }
  requestAnimationFrame(frame);
}

var WD2 = { Sun:"SU", Mon:"MO", Tue:"TU", Wed:"WE", Thu:"TH", Fri:"FR", Sat:"SA" };
var lastSec = -1;
function pad(n){ return (n<10?"0":"")+n; }
function tickClock(){
  var parts={}, list=dtf.formatToParts(new Date());
  for(var i=0;i<list.length;i++) parts[list[i].type]=list[i].value;
  var sec=parseInt(parts.second,10);

  document.getElementById("sec").textContent = pad(sec);
  document.getElementById("pm").textContent = h24>=12 ? "PM" : "AM";

    (WD2[parts.weekday]||"—")+" "+parts.month+"-"+parts.day;

  document.getElementById("chip2").textContent = (Math.floor((t%6000)/600)+1)+" / 10";
  document.getElementById("chip3").textContent = (Math.floor((t%18000)/1800)+1)+" / 10";
  window.__clock = { time:h12+":"+parts.minute, sec:pad(sec),

}

  {"atISO":"2026-11-08T03:27:10-05:00","rpm":23,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:37:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:47:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:57:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T04:07:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"}
];
var lampEl=document.getElementById("factoryLamp"),
    haloEl=document.getElementById("factoryLampHalo");
var FEED = { series:[], source:"none", latest:null, mode:"NO MEASURE", ageMin:null };
function validSeries(list){
  if(!Array.isArray(list)) return [];
  return list.filter(function(s){ return s && typeof s.rpm==="number" &&
    isFinite(s.rpm) && !isNaN(Date.parse(s.atISO)); })
    .sort(function(a,b){ return Date.parse(a.atISO)-Date.parse(b.atISO); });
}
function renderFeed(){
  var fill="#15181d", halo="0";
  if(FEED.mode==="LIVE" && FEED.latest){
    if(FEED.latest.rpm>0){ fill="#7ee787"; halo=".4"; }
    else if(FEED.latest.redPRs>0){ fill="#e5534b"; halo=".45"; }   /* the stall signature */
    else { fill="#ffb52e"; halo=".3"; }
    haloEl.setAttribute("fill", fill);
  } else if(FEED.mode==="STALE"){ fill="#2a2e35"; }
  lampEl.setAttribute("fill", fill);
  haloEl.setAttribute("opacity", halo);
  window.__feed = { mode:FEED.mode, source:FEED.source,
    rpm: FEED.latest?FEED.latest.rpm:null,
    redPRs: FEED.latest?FEED.latest.redPRs:null,
    atISO: FEED.latest?FEED.latest.atISO:null,
    ageMin: FEED.ageMin, lamp: fill };
}
function applyFeed(list, source){
  var s=validSeries(list);
  if(!s.length){
    if(!FEED.series.length){ FEED.mode="NO MEASURE"; FEED.latest=null; renderFeed(); }
    return;
  }
  var newest=s[s.length-1];
  if(FEED.latest && Date.parse(newest.atISO)<Date.parse(FEED.latest.atISO)) return;
  FEED.series=s; FEED.source=source; FEED.latest=newest;
  FEED.ageMin=(Date.now()-Date.parse(newest.atISO))/60000;
  FEED.mode=(FEED.ageMin<=CARD.feed.staleAfterMin)?"LIVE":"STALE";
  renderFeed();
}
function recheckFeed(){
  if(!FEED.latest) return;
  FEED.ageMin=(Date.now()-Date.parse(FEED.latest.atISO))/60000;
  var m=(FEED.ageMin<=CARD.feed.staleAfterMin)?"LIVE":"STALE";
  if(m!==FEED.mode){ FEED.mode=m; renderFeed(); } else { window.__feed.ageMin=FEED.ageMin; }
}
applyFeed(FEED_EMBEDDED, "embedded");
if(window.fetch){
  fetch(CARD.feed.file, { cache:"no-store" }).then(function(res){
    if(!res.ok) throw new Error("feed "+res.status);
    return res.text();
  }).then(function(txt){
    var list=txt.split(/\r?\n/).filter(function(l){ return l.trim(); })
      .map(function(l){ try{ return JSON.parse(l); }catch(e){ return null; } });
    applyFeed(list, "fetch");
  }).catch(function(){ /* the snapshot stands */ });
}
setInterval(recheckFeed, CARD.feed.recheckSec*1000);
</script>
