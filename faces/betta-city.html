  APEX GLASS HOUSE — AQUARIUM. Betta Ultra Deluxe V3
  (Nov 10, 2026 — the always-moving, real-board edition).

  *** ULTRA DELUXE V3 — OWNER FIELD VERDICT FIXES (Nov 10, 2026,
  17:43 EST). The owner opened V2 and reported, in substance:
  "the circuits look like shit — put good circuit traces in
  there that look realistic — and it's not moving at all — and
  it definitely needs to be an APK." V3 answers all three:

    FIX 1 — MOTION FROM FIRST PAINT, UNCONDITIONALLY. V2 booted
    INTO its Battery-V2 governor's REST state (boot line:
    stillPass(); state=REST) and only started the animation
    loop if a keeper signal arrived — focus / pointer / touch /
    key / a custom apex-face-observe event / the ?face=observed
    URL param — and even then the governor's 12-SECOND AUTO-EXIT
    (exitTimer=setTimeout(rest,12000) inside observe()) parked
    the scene again. In a plain file viewer none of those
    signals is guaranteed, so the owner's V2 was a still face
    with a live clock — the exact failure shape he reported at
    dawn ("the numbers change but the fish don't move"). V3
    REMOVES the REST/OBSERVED governor entirely: the driver
    starts at boot, runs on requestAnimationFrame forever, and
    nothing can park it. Battery care survives only as a DIM:
    after 60 s without interaction an overlay dims the scene;
    the fish, bubbles, trace, circuits and clash war keep
    moving behind it. The banned shape — a frozen scene under
    a running clock — cannot occur: the clock and the driver
    now share one fate, and any driver throw raises the loud
    DRIVER FAULT plate and records window.__driverFault.

    FIX 2 — THE CIRCUITS ARE A REAL BOARD NOW. V2's eight
    circuits were six-to-eight-point polylines with round joins,
    one thin wire + a halo, ending in a bare ring pad — they
    read as doodles. V3 redraws the circuit layer as a PCB:
    a solder-mask-dark substrate plate under the traces, traces
    routed as proper Manhattan runs with true 45-degree chamfer
    bends (generated by the board builder in the circuit script
    — every diagonal is exactly 45 degrees, runs are axis-true),
    trace WIDTH VARIATION (power runs 3.4 units, signal runs
    1.7), copper pours (hatched ground areas in the corners),
    annular-ring VIAS at direction changes and branch nodes,
    real TERMINAL PADS (octagonal pad + drilled hole + annular
    ring + silkscreen refdes label C1..C12), and silkscreen
    markings (board title, corner marks, dashed board outline).
    Colours stay the face's called greens only — substrate
    #06130b, silk #14532a + the three circuit greens (dim
    #0e5a26 / lit #1f9d43 / bright #39ff6a). The fiction is
    unchanged: every trace terminates in a terminal that charges
    (telegraphed glow) and flashes; a fish at the flash instant
    inside the zap radius is skeletonized, electrocuted,
    particulated. Board geometry is exposed for the bench as
    window.__board (per-trace points, width class, terminal).

  *** ULTRA DELUXE V2 — THE TRAVELLING TRACE + THE LOUD DRIVER
  (Nov 10, 2026). V1 (the Dark Electric Edition) rides forward
  WHOLE — the random free swim, the rails, the clash-flash-kill
  ceremony, the electrocution circuits, the bubbles — with TWO
  ordered changes, and nothing else touched:

    CHANGE 1 — THE TRAVELLING TRACE, built for the first time.
    The owner's motion spec always carried FIVE elements; four
    shipped in V1 and the fifth never existed in ANY build: a
    trace that TRAVELS the dotted line around the FULL CIRCLE of
    the figure. V2 builds it. The trace rides the figure's own
    circle — centre (320,225), radius 118, the outer dotted ring
    the wallpaper draws — as a short bright arc segment with a
    head dot, advanced every observed frame by arc length along
    the true circle geometry (the same getTotalLength /
    getPointAtLength seat the rails use), one full circuit in
    ~24 s of observed time. It is drawn in the figure's own ring
    green, stepped up bright: under-stroke #1f9d43, core #39ff6a
    — no new colours called. At REST it parks at the top pole,
    posed on the ring; travel is observed spectacle, like every
    other motion on this face. Bench handles: window.__trace
    (arc position s, angle, head point, circuits completed) and
    window.__traceState in window.__state.

    CHANGE 2 — THE DRIVER FAILS LOUD, never silent. The failure
    that produced the owner's field report — "the numbers are
    changing on the clock but the fish don't move" — is a driver
    that dies while the clock's own interval keeps ticking: a
    frozen statue wearing a live clock. In V2 the observed-frame
    driver carries NO silent cage: any throw inside a frame is
    caught at the frame boundary ONLY to be reported — the face
    raises a visible DRIVER FAULT marker (a red plate at the
    disc's centre naming the fault), records window.__driverFault
    {message, t}, cancels the animation loop, and stops. A dead
    driver can never again pass for a sleeping tank. The guarded
    localStorage reads/writes (term ledger) keep their guards —
    storage failure degrading to in-session counts is a data
    fallback, not motion machinery, and is unchanged.

    Also under change 2: window.__zapHits is now INITIALISED by
    the face itself (V1 read it but never created it, so the
    discharge log the electrocution layer promised went to a
    global nobody owned — discharges were silently dropped from
    the log; the zap kills themselves always fired).

    BUBBLES audited, not rebuilt: in V1 the bubble traffic is a
    parametric rise (each bubble's height is a direct function
    of observed time — 330 units of rise at its own speed, with
    a lateral sway — not DOM-observed, so it cannot stall), and
    it rides poseGrass(t,true), which the driver calls every
    observed frame. V2 keeps that math untouched and proves it
    on the bench instead.

var PALETTES=[

/* ================= THE TWO RAILS (V2) =================
   The yin-yang figure carries TWO closed curves, sharing its
   centre C=(320,225) and its outside radius 118:
     SOLID  — the figure's boundary S, the path the wallpaper
              always drew: top semicircle r118 T->B, right lobe
              r59 B->M, left lobe r59 M->T.
     DOTTED — the median of the S: right lobe r59 T->M, the
              diameter M->B, left lobe r59 B->M, the diameter
              M->T. Drawn dotted on the wallpaper, as named.
   The curves share exactly two points: the POLES T=(320,107)
   and B=(320,343) — diametrically opposite, TURNING POINTS
   EQUAL AND OPPOSITE. At a pole, and only at a pole, a rider
   may pass from one rail to the other.
   Each rail is precomputed as an arc-length polyline of legs;
   a leg knows its endpoints, its length, and which pole waits
   at each end (pole-holding legs: the diameter legs of the
   dotted rail, and the top-semicircle ends of the solid rail). */
function buildRail(legs){
  var pts=[], lens=[], total=0, i, j, n;
  for(i=0;i<legs.length;i++){
    var L=legs[i], steps=Math.max(4,Math.round(L.len/6)), seg=[];
    for(j=0;j<=steps;j++){
      var th=L.a0+(L.a1-L.a0)*j/steps;
      seg.push({x:L.cx+Math.cos(th)*(L.len/2), y:L.cy+Math.sin(th)*(L.len/2)});
    }
    lens.push(L.len); total+=L.len;
    if(i===0)for(j=0;j<seg.length;j++)pts.push(seg[j]);
    else for(j=1;j<seg.length;j++)pts.push(seg[j]);
  }
  var cum=[0];
  for(i=1;i<pts.length;i++){
    var dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y;
    cum.push(cum[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  total=cum[cum.length-1];
  function sAt(x,y){
    var bi=0, bd=1e12;
    for(var i2=0;i2<pts.length;i2++){
      var ddx=pts[i2].x-x, ddy=pts[i2].y-y, dd=ddx*ddx+ddy*ddy;
      if(dd<bd){ bd=dd; bi=i2; }
    }
    return cum[bi];
  }
  function posAt(s){
    s=((s%total)+total)%total;
    var lo=0, hi=cum.length-1;
    while(lo<hi-1){ var mid=(lo+hi)>>1; if(cum[mid]<=s)lo=mid; else hi=mid; }
    var segL=cum[hi]-cum[lo]||1, fr=(s-cum[lo])/segL;
    var p0=pts[lo], p1=pts[hi];
    return {x:p0.x+(p1.x-p0.x)*fr, y:p0.y+(p1.y-p0.y)*fr,
            a:Math.atan2(p1.y-p0.y,p1.x-p0.x)};
  }
  return {pts:pts, total:total, posAt:posAt, sAt:sAt, legs:legs};
}
var RAIL_T={x:320,y:107}, RAIL_B={x:320,y:343};
var RAILS={
  solid:buildRail([
    {cx:320,cy:225,len:236,a0:-Math.PI/2,a1:Math.PI/2,poleA:"T",poleB:"B"},  /* top semicircle T->B */
    {cx:320,cy:284,len:118,a0:Math.PI/2,a1:-Math.PI/2,poleA:"B",poleB:"M"},  /* right lobe B->M */
    {cx:320,cy:166,len:118,a0:Math.PI/2,a1:Math.PI*1.5,poleA:"M",poleB:"T"}  /* left lobe M->T */
  ]),
  dotted:buildRail([
    {cx:320,cy:166,len:118,a0:-Math.PI/2,a1:Math.PI/2,poleA:"T",poleB:"M"},  /* right lobe T->M */
    {cx:320,cy:284,len:118,a0:-Math.PI/2,a1:Math.PI/2,poleA:"M",poleB:"B"},  /* left lobe M->B */
    {cx:320,cy:225,len:236,a0:Math.PI*1.5,a1:Math.PI/2,poleA:"B",poleB:"T"}  /* diameter straight B->T */
  ])
};

/* ================= THE FISH — construction =================
   Layer order inside each fish, largest to smallest: backlight,
   anal finnage, caudal finnage (tail segment), body tint, body
   wire (under + core), dorsal finnage, head + pectoral + trail.
   Fins carry three called layers: DEEP tint fill, MID feather-rib
   fan, TOP parasol ribs — translucency earned by the render. */
var fishLayer=$("fishLayer"), burstLayer=$("burstLayer");
function finTriple(parent,deepId,midId,topId,pal,lag){
  var g=mk("g",{},parent);
  var deep=mk("g",{},g); use(deep,deepId,pal.fin,null,pal.fOp[0]);
  var mid=mk("g",{},g);  use(mid,midId,pal.fin,1.1,pal.fOp[1]);
  var top=null;
  if(topId){ top=mk("g",{},g); use(top,topId,pal.core,0.9,pal.fOp[2]); }
  return {g:g,deep:deep,mid:mid,top:top,lag:lag};
}
function buildFish(f){
  var pal=f.pal, root=mk("g",{},fishLayer); f.root=root;
  f.glow=mk("ellipse",{cx:-4,cy:0,rx:f.kind==="hero"?128:64,ry:f.kind==="hero"?70:36,fill:"url(#glowF)"},root);
  var body=mk("g",{},root); f.bodyG=body;
  if(f.kind==="hero"){
    f.finA=finTriple(body,"#finAnalDeep","#finAnalMid","#finAnalTop",pal,1.35);
    f.finA.g.setAttribute("transform-origin","-8px 22px");
    var tail=mk("g",{},body); f.tailG=tail;
    f.finC=finTriple(tail,"#finCaudalDeep","#finCaudalMid","#finCaudalTop",pal,1.8);
    f.finC.g.setAttribute("transform-origin","-51px 0px");
    use(body,"#tintBody",pal.body,null,pal.bOp);
    use(body,"#artBody",pal.under,3.4);
    use(body,"#artBody",pal.core,1.5);
    f.finD=finTriple(body,"#finDorsalDeep","#finDorsalMid","#finDorsalTop",pal,1.1);
    f.finD.g.setAttribute("transform-origin","-2px -23px");
    var head=mk("g",{},body); f.headG=head;
    use(head,"#artHead",pal.under,3.4);
    use(head,"#artHead",pal.core,1.5);
    f.finP=finTriple(head,"#finPectDeep","#finPectMid",null,pal,0.7);
    f.finP.g.setAttribute("transform-origin","21px 5px");
    use(head,"#artPectTrail",pal.core,1.1,0.5);
  } else {
    f.finA=null; f.finD=null; f.finP=null;
    var tail2=mk("g",{},body); f.tailG=tail2;
    f.finC={g:tail2,deep:null,mid:null,top:null,lag:1.8};

    var tm=mk("g",{},tail2); use(tm,"#finSchoolMid",pal.fin,1.0,pal.fOp[1]);
    tail2.setAttribute("transform-origin","-30px 0px");
    use(body,"#tintSchool",pal.body,null,pal.bOp);
    use(body,"#artSchool",pal.under,2.6);
    use(body,"#artSchool",pal.core,1.2);
    f.headG=null;
  }
}
function setFishTransform(f){
  var sc=f.scale*(f.spawnS<1?0.55+0.45*f.spawnS:1);
  f.root.setAttribute("transform","translate("+f.x.toFixed(1)+" "+f.y.toFixed(1)+") rotate("+(f.head*180/Math.PI).toFixed(1)+") scale("+(f.flip?-sc:sc).toFixed(3)+" "+sc.toFixed(3)+")");
  f.root.setAttribute("opacity",f.dead?0:(f.spawnS<1?(0.25+0.75*f.spawnS):1).toFixed(2));
}
/* the wave — the seed's pure function, exposed for the bench */
function waveAt(w){ return {head:3.0*Math.sin(w), body:5.5*Math.sin(w-0.7), tail:13.0*Math.sin(w-1.5)}; }
window.__wave=function(t,sp){ return waveAt(t*(1.2+2.1*sp)); };
function poseFish(f,t){
  var amp=1+1.1*f.flare;
  var spd=clamp(f.speed/(f.kind==="hero"?26:16),0.4,2.2);
  var wv=waveAt(f.w);
  var bodyA=wv.body*amp, headA=(wv.head-5*f.flare)*amp*0.6, tailA=wv.tail*amp;
  f.bodyG.setAttribute("transform","rotate("+bodyA.toFixed(2)+" 0 0)");
  if(f.headG)f.headG.setAttribute("transform","rotate("+headA.toFixed(2)+" 26 0)");
  f.tailG.setAttribute("transform","rotate("+tailA.toFixed(2)+(f.kind==="hero"?" -40 0":" 0 0")+")");
  var fins=[[f.finD,1.15],[f.finA,1.25],[f.finC,1.05],[f.finP,1.5]];
  for(var i=0;i<fins.length;i++){
    var F=fins[i][0]; if(!F)continue;
    var sw=Math.sin(f.w*0.62-F.lag)*5*amp*fins[i][1];
    var sc=1+0.55*f.flare;
    F.g.setAttribute("transform","rotate("+sw.toFixed(2)+") scale("+sc.toFixed(3)+")");
    if(F.deep)F.deep.setAttribute("opacity",(0.85+0.3*f.flare).toFixed(2));
    if(F.mid)F.mid.setAttribute("opacity",(0.85+0.3*f.flare).toFixed(2));
    if(F.top)F.top.setAttribute("opacity",(0.8+0.45*f.flare).toFixed(2));
  }
  f.wv={head:+(wv.head*amp).toFixed(2),body:+(wv.body*amp).toFixed(2),tail:+(wv.tail*amp).toFixed(2)};
}

/* ================= GRASS + BUBBLES (posed; observed animates) ======= */
var GRASS_COLS=["#27c24c","#39ff6a","#1f9d43","#7dff9a"];
var blades=[]; window.__blades=blades;
(function(){
  var g=$("grass");
  for(var i=0;i<23;i++){
    var wrap=mk("g",{},g);
    use(wrap,"#blade",GRASS_COLS[i%4],null);
    var sc=[1.15,0.8,1.3,0.95,1.2,0.75,1.35,0.9,1.1,0.7,1.25,0.85][i%12]*(i%3===2?-1:1);
    var bx=16+i*28;
    wrap.setAttribute("transform","translate("+bx+" 484) scale("+sc+" "+Math.abs(sc)+")");
    blades.push({g:wrap,x:bx,sx:sc,sy:Math.abs(sc),ph:i*1.37,amp:3.4+((i*7)%10)/4});
  }
  var b=$("bubbles");
  for(var j=0;j<5;j++){
    var c=mk("circle",{cx:0,cy:0,r:[4,3,2.6,3.4,2.2][j]},b);
    window.__bubbles=window.__bubbles||[]; window.__bubbles.push({el:c,x:[508,140,420,238,330][j],sp:14+((j*13)%22),ph:j*2.1});
  }
})();
window.__PALETTES=PALETTES; window.__buildFish=buildFish; window.__poseFish=poseFish;
window.__setFishTransform=setFishTransform; window.__poseGrass=poseGrass; window.__poseSlick=poseSlick;
window.__mk=mk; window.__fishLayer=fishLayer; window.__burstLayer=burstLayer;
window.__PALETTES=PALETTES; window.__buildFish=buildFish; window.__poseFish=poseFish;
window.__setFishTransform=setFishTransform; window.__poseGrass=poseGrass; window.__poseSlick=poseSlick;
})();
function poseGrass(t,animate){
  for(var i=0;i<blades.length;i++){
    var bl=blades[i];
    var rot=animate?Math.sin(t*0.9+bl.ph)*bl.amp:Math.sin(bl.ph)*2;
    bl.g.setAttribute("transform","translate("+bl.x+" 484) scale("+bl.sx+" "+bl.sy+") rotate("+rot.toFixed(2)+")");
  }
  var bs=window.__bubbles||[];
  for(var j=0;j<bs.length;j++){
    var bb=bs[j], y=animate?(452-((t*bb.sp+bb.ph*40)%330)):430-j*14, x=bb.x+(animate?Math.sin(t*0.8+bb.ph)*6:0);
    bb.el.setAttribute("cx",x.toFixed(1)); bb.el.setAttribute("cy",y.toFixed(1));
    bb.el.setAttribute("opacity",animate?0.75:0.4);
  }
}
/* the oil slick breathes between its called steps — observed only */
var SLICKS=[["#16283c","#17352a","#201a38"],["#1d1430","#16283c","#17352a"],["#123528","#1d1430","#16283c"],["#122e20","#16283c","#201a38"],["#182a42","#122e20","#1d1430"]];
var blades=window.__blades;
var slickEls=document.querySelectorAll("[data-slick]");
function poseSlick(t){
  for(var i=0;i<slickEls.length;i++){
    var cyc=SLICKS[i], k=(Math.sin(t*0.24+i*1.7)+1)/2;
    slickEls[i].setAttribute("stroke",k<0.5?cyc[0]:(k<0.8?cyc[1]:cyc[2]));
  }
}
</script>

var TERM_KEY="apexBetta.term.ultra";

    if(dr.f){ window.__pendingRespawn=dr.f; window.__respawnAt=obsElapsed+0.4; dr.f=null; }
  }
  paintFlash();
}
window.__stepFlash=stepFlash;
window.__paintFlash=paintFlash;

/* expose the bench handles the driver needs */
window.__fightStep=stepFight; window.__stepFish=stepFish; window.__stepBursts=stepBursts;
window.__doRespawn=doRespawn; window.__respawnState=function(){return {at:window.__respawnAt,pending:!!window.__pendingRespawn};};
window.__pickWaypoint=pickWaypoint;
window.__fightState=function(){var f=window.__fight;return f?{phase:f.phase,t:+f.t.toFixed(2)}:null;};
window.__setNextFight=function(v){ window.__nextFightAt=v; };
window.__obsElapsed=function(){ return obsElapsed; };
})();
</script>
<script>
(function(){
"use strict";
var PALETTES=window.__PALETTES, buildFish=window.__buildFish, poseFish=window.__poseFish,
    setFishTransform=window.__setFishTransform, pickWaypoint=window.__pickWaypoint,
    poseGrass=window.__poseGrass, poseSlick=window.__poseSlick;
/* ================= THE SCHOOL — two riders + two floaters ======
   THE MIRROR (V2, the owner's symmetry principle): ONE rider
   definition, instanced twice under the half-turn symmetry of
   the disc — rotation by PI about the centre (320,225), written
   here as (yin, yang) = (+1,+1) and its transform (-1,-1). The
   SAME code path steps both riders; the second is the first with
   every signed field negated. Nothing about either side is
   hand-written separately: yang rides the geometry as yin does,
   mirrored — the system is exactly fair between the two sides,
   and the war's randomness is the symmetric motion itself: the
   phase drift between the riders, and the choices the house
   seat shuffles at the equal-and-opposite turning points.
     YANG = the BLUE fish (PALETTES[0]), solid rail, dir -1.
     YIN  = the RED fish (PALETTES[1]), dotted rail, dir +1 —
   the owner's mapping (Nov 9, 2026, 22:22 EST). Each rider is
   the other rotated half a turn: position negated about the
   centre, heading negated, arc length on its own rail measured
   from its own pole — mirror images in one routine.
   The floaters (school art, UAP cyan + magenta) swim free as V1. */
function rider(side){
  var m=(side==="yang")?-1:1;
  return {
    kind:"hero", role:"principal", side:side, mirror:m,
    scale:0.92, pal:(side==="yang")?PALETTES[0]:PALETTES[1],
    rail:(side==="yang")?"solid":"dotted",
    x:320, y:(m<0)?107:343, head:(m<0)?-Math.PI/2:Math.PI/2,
    rs:0, rsPrev:0, dir:-m, cruise:22,
    yin:m, yang:m, hex:m,
    statPoles:0, statSwitches:0, vx:0, vy:0,
    speed:22, w:0, flare:0, mode:"rail", dead:false, spawnS:1,
    wpT:6, ph:0, retakeAt:Infinity
  };
}
var fishes=[
 rider("yang"),
 rider("yin"),
 {kind:"school",  scale:1.0,  pal:PALETTES[2], x:150, y:330, head:-0.5,  speed:13, w:1.1, flare:0, mode:"roam", dead:false, spawnS:1, wpT:5, ph:4.0},
 {kind:"school",  scale:0.88, pal:PALETTES[3], x:492, y:150, head:2.6,   speed:13, w:3.3, flare:0, mode:"roam", dead:false, spawnS:1, wpT:7, ph:5.3}
];
/* seat the riders on their rails, at their own poles; their
   opening phases drawn from the house seat — shared stream */
var RP=window.__railPoles, HR=window.__hrng;
fishes.forEach(function(f){
  if(f.role==="principal"){
    f.rs=RP[f.rail][f.mirror<0?"T":"B"]; f.rsPrev=f.rs;
    f.ph=HR()*6.283; f.w=HR()*6.283;
    var p=window.__rails[f.rail].posAt(f.rs); f.x=p.x; f.y=p.y;
  }
  pickWaypoint(f); buildFish(f); poseFish(f,0); setFishTransform(f);
});
window.__fishes=fishes;

/* ================= THE TERM BATTLE PANEL =================
   The counts stand on the face, in the still and in motion
   alike; the record itself is kept by the motion script. */
var term=window.__term;
if(!term.seeded){ term.seeded=1; if(term.spawns<4)term.spawns=4; window.__termSave(); }
function setT(a,b,v){ var e1=document.getElementById(a), e2=document.getElementById(b); if(e1)e1.textContent=v; if(e2)e2.textContent=v; }
function updateTerm(){
  setT("termYinGlow","termYin","YIN "+term.yinWins);
  setT("termYangGlow","termYang","YANG "+term.yangWins);
  setT("termCountsGlow","termCounts","TERM · SPAWNS "+term.spawns+" · RESPAWNS "+term.respawns);
  setT("termZapGlow","termZap",(term.zapped>0)?("ZAPPED "+term.zapped):"");
}
window.__updateTerm=updateTerm;
updateTerm();

/* ================= THE ALWAYS-LIVE DRIVER — ULTRA DELUXE V3 ======
   The V2 Battery Governor is REMOVED, root and branch. Its law
   was: boot into REST (a still pass), start the animation loop
   only on a keeper signal (focus / pointer / touch / key / a
   custom event / a URL param), and auto-exit back to REST after
   12 s. In a plain file viewer — the owner's hands, Nov 10,
   17:43 EST — none of those signals is guaranteed, so he got a
   still face with a live clock: "it's not moving at all." V3's
   law is the opposite: THE DRIVER STARTS AT BOOT AND NEVER
   STOPS while the face is open. There is no rest state, no
   observe signal, no auto-exit, nothing that can park the fish
   while the clock runs — that failure shape is banned on this
   face. Battery care survives as a DIM ONLY (below): after 60 s
   without interaction the scene dims behind an overlay; the
   fish keep swimming behind it. The ApexFace hook is kept for
   container compatibility, but observe/rest/toggle now only
   feed the dim layer — they can never stop the driver. */
var state="live", raf=0, obsStart=0, lastMs=-1;
var gov={state:"live", enters:1, rests:0, lastSignal:"boot-live"};
window.__governor=gov;
window.__faceRest=false;
var lastInteract=performance.now();
function noteInteract(){ lastInteract=performance.now(); }
/* THE DIM — brightness only, motion untouched. A full-stage
   black overlay at 0.45 opacity after 60 s idle; any pointer,
   touch, key or focus clears it instantly. The fish, bubbles,
   trace, circuits and war keep running behind the dim — a
   dimmed live tank, never a frozen one. */
var dimEl=document.createElement("div");
dimEl.id="faceDim";
dimEl.style.cssText="position:absolute;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;transition:opacity 0.8s ease;z-index:5;";
(function seatDim(){ var st=document.getElementById("stage"); if(st)st.appendChild(dimEl); else document.body.appendChild(dimEl); })();
setInterval(function(){
  dimEl.style.opacity=((performance.now()-lastInteract)>60000)?"0.45":"0";
},1000);
function obsFrame(nowMs){
  try{
    obsFrameBody(nowMs);
  }catch(err){
    /* THE LOUD FAILURE (kept from V2, strengthened in V3): a
       throw inside the driver is caught at the frame boundary
       ONLY so it can be reported — never swallowed. The fault
       is written to the bench handle, the DRIVER FAULT plate is
       raised on the face, and the loop is cancelled: the face
       stops and SAYS it stopped. No silent cage, no frozen
       statue behind a live clock. */
    window.__driverFault={message:String(err&&err.message||err), t:+(((nowMs-obsStart)/1000)||0).toFixed(2)};
    var dfEl=document.getElementById("driverFault");
    if(dfEl)dfEl.setAttribute("opacity",1);
    if(raf)cancelAnimationFrame(raf); raf=0;
    return;
  }
  raf=requestAnimationFrame(obsFrame);
}
function obsFrameBody(nowMs){
  var dt=0;
  if(lastMs>=0)dt=Math.min(0.05,(nowMs-lastMs)/1000);
  lastMs=nowMs;
  obsElapsed=(nowMs-obsStart)/1000;
  var t=obsElapsed;
  window.__fightStep(dt);
  if(window.__stepCircuits)window.__stepCircuits(dt);
  if(window.__stepTrace)window.__stepTrace(dt);
  for(var i=0;i<fishes.length;i++)window.__stepFish(fishes[i],dt,t);
  window.__stepBursts(dt);
  if(window.__stepFlash)window.__stepFlash(dt);
  if(window.__stepZaps)window.__stepZaps(dt);
  var rs=window.__respawnState();
  if(rs.pending&&rs.at>0&&t>=rs.at)window.__doRespawn();
  poseGrass(t,true); poseSlick(t);
  refreshState(t);
}
function refreshState(t){
  var st={t:+t.toFixed(2), state:state, fish:[], fight:window.__fightState(),
          rails:window.__railState, flash:window.__flash?{side:window.__flash.side,t:+window.__flash.t.toFixed(2)}:null,
          term:{yin:term.yinWins, yang:term.yangWins, spawns:term.spawns, respawns:term.respawns, zapped:(term.zapped||0)}, zaps:(window.__zapLog?window.__zapLog.length:0), zapHits:(window.__zapHits?window.__zapHits.length:0), trace:(window.__trace||null), driverFault:(window.__driverFault||null), circuits:(window.__circuits||[]).map(function(C){return C.state;})};
  fishes.forEach(function(f){
    st.fish.push({pal:f.pal.name, kind:f.kind, side:f.side||null, rail:f.rail||null,
      x:+f.x.toFixed(0), y:+f.y.toFixed(0),
      head:+(f.head*180/Math.PI).toFixed(0), flare:+f.flare.toFixed(2),
      dead:f.dead, spawn:+f.spawnS.toFixed(2), mode:f.mode});
  });
  window.__state=st;
}
function setLamp(){ /* this face carries no lamp element; state rides window.__governor */ }
/* Container-compat hook (V3): the calls exist so a container
   that speaks the old ApexFace contract doesn't error — but on
   this face they only register interaction (clearing the dim).
   NOTHING here can start, stop, or park the driver. */
window.ApexFace={
  observe:function(){ noteInteract(); gov.lastSignal="container-observe(noop)"; },
  rest:function(){ noteInteract(); gov.lastSignal="container-rest(noop)"; },
  toggle:function(){ noteInteract(); },
  state:function(){ return "live"; }
};
window.__pinFight=/[?&]fight=1/.test(window.location.search);
["pointerdown","touchstart","keydown"].forEach(function(ev){
  window.addEventListener(ev,function(){ noteInteract(); },true);
});
window.addEventListener("focus",function(){ noteInteract(); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden)noteInteract(); });

/* ---- Boot: THE DRIVER STARTS NOW, unconditionally — first
   paint is already a swimming face. The fight pin, if the URL
   carries it, schedules its fight on the live clock. No
   wake-lock; the system sleep governs the screen itself. ---- */
obsStart=performance.now(); lastMs=-1; obsElapsed=0;
if(window.__pinFight){ window.__setNextFight(2); window.__pinFight=false; term.sigs++; window.__termSave(); }
refreshState(0);
raf=requestAnimationFrame(obsFrame);
})();
</script>

<script>
(function(){
"use strict";
/* ================= THE APEX FRAME - apex-frame v1 =================
   Ported geometry (see the V3.1 header): the engine face family's
   LOKMAT FRAME. Case under the tank, trim over it, and the tank
   seated into the glass by one uniform transform when ON. */
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("scene");
var btn=document.getElementById("frameBtn");
function mk(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
var world=mk("g",{id:"tankWorld"},null);
var kids=[];
for(var i=0;i<svg.childNodes.length;i++){var n=svg.childNodes[i];if(n.nodeType===1&&n.tagName!=="defs")kids.push(n);}
if(kids.length)svg.insertBefore(world,kids[0]);
kids.forEach(function(n){world.appendChild(n);});
var caseG=mk("g",{id:"apexFrameCase"},null); svg.insertBefore(caseG,world);
mk("rect",{x:5,y:5,width:630,height:470,rx:38,fill:"#14161a",stroke:"#2c2f36","stroke-width":2},caseG);
mk("rect",{x:20,y:20,width:600,height:440,rx:30,fill:"#0a0c0e",stroke:"rgba(255,181,46,.35)","stroke-width":1.5},caseG);
var trim=mk("g",{id:"apexFrameTrim"},svg);
mk("rect",{x:20,y:20,width:600,height:440,rx:30,fill:"none",stroke:"rgba(255,181,46,.35)","stroke-width":1.5},trim);
var words=mk("g",{fill:"#565b63"},trim);
words.setAttribute("style","font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700");
function word(txt,x,y,size,ls,rot){var t=mk("text",{x:x,y:y,"font-size":size,"letter-spacing":ls,"text-anchor":"middle",transform:"rotate("+rot+" "+x+" "+y+")"},words);t.textContent=txt;return t;}
word("ADJUST",15,160,13,3,-90); word("MODE",15,320,13,3,-90);
word("LIGHT",625,160,13,3,90); word("START\u00b7STOP",625,320,11,2,90);
var bolts=mk("g",{fill:"#22252b",stroke:"#3a3e46","stroke-width":1.5},trim);
[[34,34],[606,34],[34,446],[606,446]].forEach(function(c){
  var pts=[];
  for(var i=0;i<6;i++){var a=i*Math.PI/3-Math.PI/2;pts.push((c[0]+13*Math.cos(a)).toFixed(1)+","+(c[1]+13*Math.sin(a)).toFixed(1));}
  mk("polygon",{points:pts.join(" ")},bolts);
  mk("circle",{cx:c[0],cy:c[1],r:4,fill:"#14161a",stroke:"#3a3e46","stroke-width":1.2},bolts);
});
var frameOn=true;
function applyFrame(){

    world.setAttribute("transform","translate(45.5 34) scale(0.858333)");

    caseG.style.display="none"; trim.style.display="none";
  }
  if(btn)btn.textContent=frameOn?"FRAME ON":"FRAME OFF";
  window.__apexFrame={on:frameOn,
    caseSource:"LOKMAT FRAME of the condensed engine face (640x480 case geometry, verbatim)",
    glass:{x:34,y:34,width:572,height:412,rx:22},
    tankTransform:frameOn?"translate(45.5 34) scale(0.858333)":"none"};
}
window.__toggleFrame=function(){frameOn=!frameOn;applyFrame();};
if(btn)btn.addEventListener("click",function(ev){ev.stopPropagation();window.__toggleFrame();});
applyFrame();
})();
</script>
