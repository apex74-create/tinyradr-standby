<title>APEX GLASS HOUSE \u2014 Aquarium (Betta Yin-Yang Clock Face V2)</title>
<!--
  APEX GLASS HOUSE \u2014 AQUARIUM. Betta Yin-Yang Clock Face V2 (Nov 8, 2026).

  THE NAME (owner coinage, Nov 8, 07:08 EST): APEX GLASS HOUSE \u2014 the
  effect is his Glass House effect in aquarium form. His craft history:
  mirrors sandblasted with the design, painted in fluorescent paint, a
  UV light bounced off the piece so the painted fish GLOWED and looked
  like they were FLOATING, then glass layers and mirror layers
  sandwiched so each stratum held part of the scene at a different
  depth. Here: glow-stepped wireframe line work over OLED black, strata
  separated by line weight and brightness steps alone \u2014 the sandwich
  made of strokes.

  CONCEPT (owner, Nov 8, 06:27\u201306:31): two betta fish swimming a
  yin-yang circuit in an OLED tank, neon grass springing from the
  bottom, fish that fight, fall out, and fall back in; live digits
  hovering. V1 (filled paint) shipped 06:55\u201307:03 and LANDED on his
  watch \u2014 and his eye ruled it (07:05): "two flat fish that look dead
  and stiff, floating around in the current eddies... very dead and
  very inactive, with a yin-yang symbol in the background." His
  standard: the generated animation (imagine_media, \u2026782.mp4) \u2014
  "the video you showed me was killer."

  OWNER VERDICT ON THE FIRST WIREFRAME ITERATION (07:13 EST) - THE
  PLATE CURE: "That's very cool, that first iteration with the
  wireframes - EXCEPT they're swimming around on STACKED OPAQUE
  PLATES - the very fucking thing we don't want." The wire passed;
  the strata failed. CURE APPLIED IN THIS FILE: depth comes from
  LINE, LIGHT, and BACKLIGHT GLOW ONLY. The yin-yang is a LINE
  drawing on the void (no filled lobes, no filled disc); the
  backlight is a radial glow gradient whose edges dissolve into
  black (light added, no panel); the oil slick is stroked
  contours; the grass is curved lines from the void floor. NO
  opaque filled plate sits in the stack as a visible stratum -
  remaining fills are the void itself (true black), light points
  (stars), the digits (standing legibility exception), and tints
  INSIDE the wireframe contours only.

  OWNER LIVE TUNING (07:13-07:14 EST): MORE TRANSLUCENT (tints
  leaned down: A body 0.26 to 0.17, B body 0.24 to 0.16, fins to
  0.11/0.10, school 0.12 to 0.08) - MORE FLUID (smootherstep
  envelopes on every fight transient, splined SMIL ripples,
  low-passed surge) - LESS POP, LESS JERK (no snapped onsets:
  flare, dart and tumble all ride zero-slope envelopes) - A
  LITTLE MORE FORWARD (circuit pace 64 s to 54 s loop, school
  eddies x0.85).

  DIRECTION CHANGE (owner, 07:06\u201307:08, supersedes V1's filled paint):
  the fish are WIREFRAME \u2014 "like a mechanical drawing" \u2014 outline and
  construction lines only, in a FLAT PLANE (a drawing-board elevation,
  like his hero plate; no 3D, no volume program). Lines are light, so
  the tank holds A BUNCH OF THEM: two hero principals on the circuit
  plus a school of smaller wireframe bettas on slow eddies. Life comes
  from articulation in the plane: a segmented spine chain (head / body
  / tail pivots, travelling wave), fin-rib fans that ripple and spread,
  pectoral flutter, surge-and-ease pacing. Wireframe does not excuse
  stiffness \u2014 the construction lines SHOW the bend.

  THE BACKLIGHT (owner permission, 07:08): each principal carries a
  stepped glow field UNDER its wire \u2014 the UV bounce as its own layer.
  A backlight ADDS light behind; the condemned dark sheet SUBTRACTED
  light in front. Opposite acts; the sheet stays banned.

  PALETTE TABLE (his semi-opaque custom colouring method, applied to
  the wireframe fish ONLY; every tint a chosen colour, numbers showing):
    Fish A (blue-green wire):  under-stroke #0d3a5c w3.4 / core #6fd8ff w1.5
      body tint #1d5f9e @ 0.17 / fin membrane tint #3f8fd2 @ 0.11
      backlight steps (solid): #051a12 outer / #092e1f inner
    Fish B (amber-red wire):   under-stroke #5c1f0d w3.4 / core #ffb37c w1.5
      body tint #c1441a @ 0.16 / fin membrane tint #e4572e @ 0.10
      backlight steps (solid): #051a12 outer / #092e1f inner
    School (dimmer strata):    line steps #14401f / #1d5c33 / #173f5c /
      #4a3410 by fish, w1.7 / shared body tint #2f9e44 @ 0.08 /
      backlight #051c14 solid
    Yin-yang wallpaper:        lobes #04140f + #050816 / ring #123c26 w2
    Digits: solid ice #c8fbff on solid glow step #0b5563 \u2014 never tinted.
  Tint lives INSIDE the wire only. If tint muddied wire at glass scale
  the instruction was: thin the tint, keep the wire.

  ASSEMBLY ORDER (One-Shot Rule / Cupboard, largest to smallest \u2014
  owner restatement 07:07: "Stacked out from the wallpaper first"):
    1. WALLPAPER: OLED void + starfield + oil-slick steps + the
       SUBDUED yin-yang (the circuit the heroes ride, riding WITH the
       wallpaper now, not as a mid layer) + ambient bubbles
    2. the grass field (neon blades, bottom edge, billowing)
    3. the SCHOOL: six small wireframe bettas on slow eddies
    4. the PRINCIPALS: two hero wireframe bettas (backlight field
       first inside each fish group, then tint, then wire)
    5. TONE/LIGHT LAST: the hovering digits (teacups) \u2014 date, time,
       seconds, AM/PM, solid paint, solid glow step

  MOTION: a small guarded JS driver (requestAnimationFrame, interval
  fallback). Principals: arc-length swim with surge/ease pacing; spine
  wave phase-locked to speed (fight = wave amplitude doubled, fin fans
  spread, dart out, tumble, glide back). School: SMIL tail-wag inside
  each fish + JS eddy transport. If script dies: fish stand posed on
  the circuit in their static transforms, grass sways (CSS), slick
  shimmers (SMIL), digits read honest dashes \u2014 the house blank.
  Test pin: ?fight=1 locks fish A mid-flare for bench captures.
  window.__wave(t, speed) and window.__state expose the pose math for
  bench frame-state proof.

  NO fake instruments. The generated art's HUD paint (DEPTH / OIL /
  pH) was the generator's brushwork, never a spec. Live device time
  and date only. Zero data calls. ONE FILE, ZERO EXTERNAL REFERENCES.

  FIT: MEASURE-AND-JAM (visualViewport > inner > client), explicit
  pixels, letterbox. Design stage 640x480 landscape (Lokmat by record).

  TIMING BLOCK (house law): T0 = this V2 dispatch, Nov 8, 2026,
  ~07:06 EST (owner's verdict + wireframe direction) -> finished
  verified product: stamped at ship in the delivery report.
-->

<script>
(function(){
"use strict";
var stage=document.getElementById("stage"), scene=document.getElementById("scene");
function layout(){
  var vv=window.visualViewport;
  var W=Math.floor(vv?vv.width:window.innerWidth);
  var H=Math.floor(vv?vv.height:window.innerHeight);
  if(!W||!H){W=document.documentElement.clientWidth||640;H=document.documentElement.clientHeight||480;}
  var S=Math.min(W/640,H/480);
  var sw=Math.round(640*S), sh=Math.round(480*S);
  stage.style.width=sw+"px"; stage.style.height=sh+"px";
  stage.style.left=Math.floor((W-sw)/2)+"px"; stage.style.top=Math.floor((H-sh)/2)+"px";
  scene.style.width=sw+"px"; scene.style.height=sh+"px";
  window.__fit={W:W,H:H,stageW:sw,stageH:sh,S:+S.toFixed(3)};
}
layout();
window.addEventListener("resize",layout);
if(window.visualViewport)window.visualViewport.addEventListener("resize",layout);

var DAYS=["SU","MO","TU","WE","TH","FR","SA"];
function pad(n){return (n<10?"0":"")+n;}
function setPair(a,b,v){var e1=document.getElementById(a),e2=document.getElementById(b); if(e1)e1.textContent=v; if(e2)e2.textContent=v;}
function tick(){
  var d=new Date(), h=d.getHours(), ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
  setPair("dateGlow","dateText",DAYS[d.getDay()]+" "+pad(d.getMonth()+1)+"-"+pad(d.getDate()));
  setPair("timeGlow","timeText",h+":"+pad(d.getMinutes()));
  setPair("secGlow","secText",pad(d.getSeconds()));
  setPair("ampmGlow","ampmText",ap);
}
tick(); setInterval(tick,200);

/* THE WAVE - one pure function, exposed for bench frame-state proof.
   Travelling wave down the spine: head leads, body follows, tail lags
   most and swings widest. Frequency rises with swim speed. */
function waveAt(w){
  return {head:3.0*Math.sin(w), body:5.5*Math.sin(w-0.7), tail:13.0*Math.sin(w-1.5)};
}
window.__wave=function(t,sp){ return waveAt(t*(1.2+2.1*sp)); };

try{
  var circuit=document.getElementById("circuit");
  var LEN=circuit.getTotalLength();
  var PIN=/[?&]fight=1/.test(window.location.search);
  function $(id){return document.getElementById(id);}
  function sstep(x){ if(x<=0)return 0; if(x>=1)return 1; return x*x*x*(x*(x*6-15)+10); }
  function fightEnv(p){ return sstep(p/0.30)*(1-sstep((p-0.55)/0.45)); }
  function dartEnv(p){ return sstep(p/0.38)*(1-sstep((p-0.50)/0.50)); }
  function makeFish(tag,dist0,w0,off,fightStart){
    return {pos:$( "pos"+tag), body:$("bodySeg"+tag), head:$("headSeg"+tag), tail:$("tailSeg"+tag),
      fanD:$("fanDorsal"+tag), fanA:$("fanAnal"+tag), fanC:$("fanCaudal"+tag),
      dist:dist0, w:w0, off:off, fightStart:fightStart, flare:0, x:0, y:0, ang:0, wv:waveAt(0)};
  }
  var fishA=makeFish("A",0,0,0,32);
  var fishB=makeFish("B",LEN/2,2.1,2.4,0);
  var school=[];
  var SC=[[120,118,55,24,98,0.0,1],[522,128,48,21,82,1.7,-1],[108,332,50,28,114,3.4,1],
          [530,338,58,26,102,5.1,-1],[320,398,95,15,128,2.6,1],[320,76,115,13,119,4.4,-1]];
  for(var i=0;i<6;i++){ school.push({el:$("school"+(i+1)), c:SC[i], ph:i*1.37}); }
  var lastMs=-1;
  function frame(nowMs){
    var tSec=PIN?34.0:nowMs/1000;
    var dt=0;
    if(lastMs>=0&&!PIN){ dt=Math.min(0.05,(nowMs-lastMs)/1000); }
    lastMs=nowMs;
    var state={t:+tSec.toFixed(2)};
    [fishA,fishB].forEach(function(f){
      var cyc=tSec%64;
      var fp=(cyc>=f.fightStart&&cyc<f.fightStart+5)?(cyc-f.fightStart)/5:-1;
      var flare=fp>=0?fightEnv(fp):0;
      f.flare=flare;
      var surgeT=1+0.45*Math.sin(tSec*0.13+f.off)+0.20*Math.sin(tSec*0.047+f.off*2.0)+(fp>=0?0.9*fightEnv(fp):0);
      if(f.surgeS===undefined)f.surgeS=surgeT; f.surgeS+=(surgeT-f.surgeS)*Math.min(1,dt*3+0.02); var surge=f.surgeS;
      var rate=LEN/54*surge;
      f.dist=(f.dist+rate*dt)%LEN;
      f.w+=dt*(1.2+2.1*surge);
      var pt=circuit.getPointAtLength(f.dist);
      var pt2=circuit.getPointAtLength((f.dist+2.5)%LEN);
      var ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
      var dx=0, dy=0, tumble=0;
      if(fp>=0){
        var vx=320-pt.x, vy=225-pt.y, dd=Math.sqrt(vx*vx+vy*vy)||1;
        var k=54*dartEnv(fp);
        dx=vx/dd*k; dy=vy/dd*k;
        if(fp>0.30&&fp<0.70)tumble=26*Math.sin((fp-0.30)/0.40*Math.PI);
        tumble*=fightEnv(fp);
      }
      var amp=1+1.1*flare;
      var wv=waveAt(f.w);
      f.wv={head:+(wv.head*amp).toFixed(2), body:+(wv.body*amp).toFixed(2), tail:+(wv.tail*amp).toFixed(2)};
      f.x=+(pt.x+dx).toFixed(1); f.y=+(pt.y+dy).toFixed(1); f.ang=+(ang+tumble).toFixed(1);
      f.pos.setAttribute("transform","translate("+f.x+" "+f.y+") rotate("+f.ang+")");
      f.body.setAttribute("transform","rotate("+f.wv.body+" 0 0)");
      f.head.setAttribute("transform","rotate("+(f.wv.head-5*flare).toFixed(2)+" 26 0)");
      f.tail.setAttribute("transform","rotate("+f.wv.tail+" -40 0)");
      if(f.fanD)f.fanD.setAttribute("transform","scale(1 "+(1+0.55*flare).toFixed(3)+")");
      if(f.fanA)f.fanA.setAttribute("transform","scale(1 "+(1+0.55*flare).toFixed(3)+")");
      if(f.fanC)f.fanC.setAttribute("transform","scale("+(1+0.30*flare).toFixed(3)+" "+(1+0.45*flare).toFixed(3)+")");
    });
    state.A={x:fishA.x,y:fishA.y,ang:fishA.ang,head:fishA.wv.head,body:fishA.wv.body,tail:fishA.wv.tail,flare:+fishA.flare.toFixed(2)};
    state.B={x:fishB.x,y:fishB.y,ang:fishB.ang,head:fishB.wv.head,body:fishB.wv.body,tail:fishB.wv.tail,flare:+fishB.flare.toFixed(2)};
    state.school=[];
    school.forEach(function(s,idx){
      var u=s.c[5]+s.c[6]*tSec*2*Math.PI/s.c[4];
      var x=s.c[0]+s.c[2]*Math.cos(u), y=s.c[1]+s.c[3]*Math.sin(u);
      var vx=-s.c[2]*Math.sin(u)*s.c[6], vy=s.c[3]*Math.cos(u)*s.c[6];
      var hd=Math.atan2(vy,vx)*180/Math.PI+3*Math.sin(tSec*1.3+s.ph);
      s.el.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+") rotate("+hd.toFixed(1)+")");
      state.school.push({x:+x.toFixed(0),y:+y.toFixed(0),h:+hd.toFixed(0)});
    });
    window.__state=state;
  }
  frame(0);
  if(window.requestAnimationFrame){
    var loop=function(ms){ frame(ms); window.requestAnimationFrame(loop); };
    window.requestAnimationFrame(loop);
  } else {
    setInterval(function(){ frame(Date.now()); },50);
  }
}catch(e){ /* driver absent: static poses, CSS grass, SMIL slick stand */ }
})();
</script>
</body>
</html>
