<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>APEX — Signal Watch · SIGNAL SCOPE V2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#010502; }
  body { font-family:ui-monospace,Menlo,Consolas,monospace; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; overflow:hidden; background:radial-gradient(circle at center, #03140a 0%, #020403 70%, #010502 100%); }
  #scope { position:absolute; display:block; }
  #pulse { position:absolute; display:block; }
  .vignette { position:absolute; left:0; top:0; background:radial-gradient(ellipse at center, rgba(0,0,0,.05) 45%, rgba(0,0,0,.75) 100%); pointer-events:none; }
  #brand { position:absolute; text-align:center; color:#39ff6a; font-weight:700; letter-spacing:.35em; text-shadow:0 0 12px rgba(57,255,106,.55); }
  #batt { position:absolute; text-align:right; color:#b6ffd0; font-weight:700; font-variant-numeric:tabular-nums; text-shadow:0 0 8px rgba(57,255,106,.5); }
  #clock { position:absolute; text-align:center; color:#eaffef; font-weight:800; line-height:1; text-shadow:0 0 10px rgba(57,255,106,.9), 0 0 42px rgba(57,255,106,.45); font-variant-numeric:tabular-nums; }
  #date { position:absolute; text-align:center; color:#8fd9a4; font-variant-numeric:tabular-nums; }
  #mode { position:absolute; text-align:center; color:#ffc95c; font-weight:700; letter-spacing:.18em; text-shadow:0 0 8px rgba(255,201,92,.35); }
  #tag { position:absolute; text-align:center; color:#b6ffd0; font-weight:700; font-variant-numeric:tabular-nums; text-shadow:0 0 8px rgba(57,255,106,.5); }
  #mapline { position:absolute; left:0; text-align:center; color:#3f6b4d; width:100%; }
  .strip { position:absolute; left:0; text-align:center; color:#3f6b4d; width:100%; }
</style></head>
<body>
<div id="stage">
  <canvas id="scope"></canvas>
  <canvas id="pulse"></canvas>
  <div class="vignette"></div>
  <div id="brand">SIGNAL WATCH</div>
  <div id="batt"></div>
  <div id="clock">--:--</div>
  <div id="date">—</div>
  <div id="mode">SCOPE STANDBY</div>
  <div id="tag"></div>
  <div id="mapline">FREQUENCY RINGS — AMBER 2.4 GHZ · GREEN 5 GHZ · BLUE 6 GHZ · ANGLE = CHANNEL · PEAK = RSSI · DENT = CO-CHANNEL CROWD · RIPPLE = RSSI WANDER</div>
  <div class="strip">APEX SIGNAL WATCH · BLIP RADIUS = RSSI · NO POSITION FIX · SRC NAMES THE PIPE · TINYRADAR.COM</div>
</div>
<script>
// SWEEP-CLOCK PRIMING (SWEEP FIX, Nov 11, 2026; corrected same day after a
// post-merge bench caught the first version freezing the pulse/freq loops):
// drawScope used to trust the raw rAF timestamp; under a hidden tab or a
// throttled WebView the delivered timestamps warp, and % 4000 turned that warp
// into needle teleports. This wrapper gives EVERY rAF callback of the face a
// timestamp from a MONOTONIC SWEEP CLOCK: __sweepTime advances only by real
// frame deltas (performance.now), each clamped to 50ms, so no callback can
// ever see time jump or run backwards. drawScope advances on its own
// performance.now clock (see SWEEP FIX in drawScope); this wrapper exists so
// the face's OTHER timestamp-driven loops (pulse ECG phase, freq strip) ride
// the same warp-proof clock instead of the raw rAF timestamp. The wrapper
// stays installed for the life of the page; it adds one closure per frame.
(function () {
  var real = window.requestAnimationFrame.bind(window);
  var last = -1;
  window.__sweepTime = 0;
  window.requestAnimationFrame = function (cb) {
    return real(function () {
      var t = performance.now();
      if (last >= 0) window.__sweepTime += Math.min(50, Math.max(0, t - last));
      last = t;
      cb(window.__sweepTime);
    });
  };
})();
</script>
<script>
  // SIGNAL SCOPE V2: the face from the Signal Watch video — a green radar scope
  // on black, sweep turning over range rings. V2 adds the HEARTBEAT INDICATOR
  // from the video's other watch face (the dusk close-up): a green ECG pulse
  // trace running across the display's lower third, with green heart markers
  // in the field. HONESTY RAILS: the trace is a drawn STYLE element only —
  // it measures nothing, shows NO BPM number, makes NO medical claim; its
  // marker swells on real scan landings and on nothing else. The scope's
  // data layer (ingest script, end of body) plots scrubbed Wi-Fi returns:
  // ANGLE = CHANNEL and RADIUS = RSSI — it claims NO bearing, NO position,
  // NO fix. The battery readout rides the device's real battery hook
  // and hides itself where the hook does not exist.
  var stage = document.getElementById('stage');
  var cv = document.getElementById('scope');
  var ctx = cv.getContext('2d');
  var pv = document.getElementById('pulse');
  var pctx = pv.getContext('2d');
  var PW = 0, PH = 0, heartP = 0;
  var W = 0, H = 0, CX = 0, CY = 0, R = 0, built = false;
  var GREEN = '#39ff6a', GREEN_DIM = '#166b32', GREEN_FAINT = 'rgba(57,255,106,.28)';
  var sweepNow = 0, sweepPrev = -1; // monotonic sweep clock (see SWEEP FIX in drawScope); sweepPrev -1 = unprimed
  function measure() {
    // Direct Parameter Load: the container's sensed bound governs;
    // the viewport is the fallback (web / bench), never the master.
    var b = window.ApexBound;
    if (b && typeof b.getW === 'function' && b.getW() > 0 && b.getH() > 0) {
      W = Math.floor(b.getW()); H = Math.floor(b.getH()); return;
    }
    var vv = window.visualViewport;
    W = Math.floor(vv ? vv.width : window.innerWidth);
    H = Math.floor(vv ? vv.height : window.innerHeight);
    if (!W || !H) { W = document.documentElement.clientWidth || 300; H = document.documentElement.clientHeight || 400; }
  }
  function layout() {
    measure();
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    var vg = document.querySelector('.vignette'); vg.style.width = W + 'px'; vg.style.height = H + 'px';
    var D = Math.floor(Math.min(W, H) * 0.94);
    R = Math.floor(D / 2);
    CX = Math.floor(W / 2); CY = Math.floor(H / 2);
    cv.width = D; cv.height = D;
    cv.style.width = D + 'px'; cv.style.height = D + 'px';
    cv.style.left = (CX - R) + 'px'; cv.style.top = (CY - R) + 'px';
    PW = Math.floor(D * 0.86); PH = Math.floor(D * 0.17);
    pv.width = PW; pv.height = PH;
    pv.style.width = PW + 'px'; pv.style.height = PH + 'px';
    pv.style.left = Math.floor(CX - PW / 2) + 'px';
    pv.style.top = Math.floor(CY + D * 0.435) + 'px';
    var brand = document.getElementById('brand');
    brand.style.left = '0px'; brand.style.width = W + 'px';
    brand.style.top = Math.floor(CY - R + D * 0.055) + 'px';
    brand.style.fontSize = Math.max(11, Math.floor(D * 0.038)) + 'px';
    var batt = document.getElementById('batt');
    batt.style.width = Math.floor(D * 0.30) + 'px';
    batt.style.left = Math.floor(CX + R - D * 0.34) + 'px';
    batt.style.top = Math.floor(CY - R + D * 0.115) + 'px';
    batt.style.fontSize = Math.max(11, Math.floor(D * 0.042)) + 'px';
    var clock = document.getElementById('clock');
    clock.style.left = '0px'; clock.style.width = W + 'px';
    clock.style.top = Math.floor(CY + D * 0.145) + 'px';
    clock.style.fontSize = Math.floor(D * 0.155) + 'px';
    var date = document.getElementById('date');
    date.style.left = '0px'; date.style.width = W + 'px';
    date.style.top = Math.floor(CY + D * 0.295) + 'px';
    date.style.fontSize = Math.max(11, Math.floor(D * 0.040)) + 'px';
    var mode = document.getElementById('mode');
    mode.style.left = '0px'; mode.style.width = W + 'px';
    mode.style.top = Math.floor(CY + D * 0.352) + 'px';
    mode.style.fontSize = Math.max(10, Math.floor(D * 0.030)) + 'px';
    var tag = document.getElementById('tag');
    tag.style.left = '0px'; tag.style.width = W + 'px';
    tag.style.top = Math.floor(CY + D * 0.398) + 'px';
    tag.style.fontSize = Math.max(10, Math.floor(D * 0.032)) + 'px';
    var mapline = document.getElementById('mapline');
    mapline.style.fontSize = Math.max(8, Math.floor(H * 0.017)) + 'px';
    mapline.style.bottom = Math.floor(H * 0.040) + 'px';
    var strip = document.querySelector('.strip');
    strip.style.fontSize = Math.max(9, Math.floor(H * 0.020)) + 'px';
    strip.style.bottom = Math.floor(H * 0.014) + 'px';
    built = true;
  }
  function drawScope(now) {
    if (!built) return;
    var d = R * 2, c = R; // canvas-local center
    ctx.clearRect(0, 0, d, d);
    // face glass
    ctx.beginPath(); ctx.arc(c, c, R - 1, 0, Math.PI * 2);
    ctx.fillStyle = '#02140a'; ctx.fill();
    // range rings (video furniture: five rings, metre scale on the scope face)
    var rings = 5;
    ctx.lineWidth = Math.max(1, Math.floor(R * 0.006));
    for (var i = 1; i <= rings; i++) {
      ctx.beginPath(); ctx.arc(c, c, (R - 4) * i / rings, 0, Math.PI * 2);
      ctx.strokeStyle = i === rings ? GREEN : GREEN_FAINT; ctx.stroke();
    }
    // radial spokes every 30 degrees
    ctx.strokeStyle = 'rgba(57,255,106,.16)';
    for (var a = 0; a < 12; a++) {
      var t = a * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(c + Math.cos(t) * R * 0.08, c + Math.sin(t) * R * 0.08);
      ctx.lineTo(c + Math.cos(t) * (R - 4), c + Math.sin(t) * (R - 4));
      ctx.stroke();
    }
    // rim degree ticks + cardinal degree labels (scope scale, not a heading)
    ctx.fillStyle = GREEN_DIM;
    ctx.font = '700 ' + Math.max(10, Math.floor(R * 0.075)) + 'px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var degs = ['0', '90', '180', '270'];
    for (var k = 0; k < 4; k++) {
      var ta = k * Math.PI / 2 - Math.PI / 2;
      ctx.fillText(degs[k], c + Math.cos(ta) * R * 0.885, c + Math.sin(ta) * R * 0.885);
    }
    for (var m = 0; m < 72; m++) {
      var tt = m * Math.PI / 36, long = (m % 6 === 0);
      ctx.beginPath();
      ctx.moveTo(c + Math.cos(tt) * (R - 4), c + Math.sin(tt) * (R - 4));
      ctx.lineTo(c + Math.cos(tt) * (R - 4 - (long ? R * 0.045 : R * 0.022)), c + Math.sin(tt) * (R - 4 - (long ? R * 0.045 : R * 0.022)));
      ctx.strokeStyle = long ? GREEN : GREEN_FAINT; ctx.stroke();
    }
    // frequency rings + blips — the data layer, drawn from the
    // scrubbed scan state (see the ingest script at the end of body).
    if (typeof drawDataRings === 'function') drawDataRings(ctx, c, R);
    // sweep: bright leading edge + fading wedge trail (one turn per 4s).
    // SWEEP FIX (Nov 11, 2026): the bearing rides a MONOTONIC SWEEP CLOCK,
    // never the raw frame timestamp. The old code fed the rAF timestamp
    // straight into (now % 4000): a backgrounded tab, a throttled WebView,
    // or any compositor hitch froze rAF and then TIME-WARPED the needle
    // to whatever phase the next delivered timestamp carried - the
    // tumbling/teleporting sweep the owner caught. The sweep clock now
    // advances ONLY by real frame deltas, each clamped to 50ms, so the
    // needle can never jump and never runs backwards; a stalled frame
    // costs at most 50ms of sweep. Period stays one turn per 4s (90 deg/s).
    if (sweepPrev < 0) sweepPrev = performance.now();
    else { var sd = performance.now() - sweepPrev; sweepNow += sd > 500 ? 16.7 : Math.min(50, Math.max(0, sd)); sweepPrev = performance.now(); }
    var ang = (sweepNow % 4000) / 4000 * Math.PI * 2 - Math.PI / 2;
    // the trail: ONE true sector of FIXED width (54 deg) drawn as 18 arc
    // slices of exactly 3 deg each, fading from the leading edge, always on
    // the trailing side - a real arc edge, never a chord polygon. Opacity is
    // kept LOW (peak 0.075): the old 162 deg trail peaked at 0.21, so its
    // accumulated glow lit over half the disc and the fainter half read as
    // a second, wandering wedge on dim watch glass.
    var trail = Math.PI * 0.30, slices = 18;
    for (var s = slices; s >= 1; s--) {
      var a0 = ang - trail * s / slices, a1 = ang - trail * (s - 1) / slices;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R - 5, a0, a1); ctx.closePath();
      ctx.fillStyle = 'rgba(57,255,106,' + (0.006 + 0.069 * (1 - (s - 1) / slices)) + ')'; ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(c, c);
    ctx.lineTo(c + Math.cos(ang) * (R - 5), c + Math.sin(ang) * (R - 5));
    ctx.strokeStyle = '#b6ffd0'; ctx.lineWidth = Math.max(2, Math.floor(R * 0.012)); ctx.stroke();
    // outer bezel ring
    ctx.beginPath(); ctx.arc(c, c, R - 2, 0, Math.PI * 2);
    ctx.strokeStyle = GREEN; ctx.lineWidth = Math.max(2, Math.floor(R * 0.014)); ctx.stroke();
    // center hub + the wearer's own marker (origin only — no fix is computed)
    ctx.beginPath(); ctx.arc(c, c, Math.max(3, R * 0.022), 0, Math.PI * 2);
    ctx.fillStyle = '#b6ffd0'; ctx.fill();
    ctx.fillStyle = GREEN;
    ctx.font = '700 ' + Math.max(10, Math.floor(R * 0.070)) + 'px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillText('YOU', c, c + R * 0.16);
    requestAnimationFrame(drawScope);
  }
  // THE HEARTBEAT INDICATOR — the video's dusk face carries a green ECG trace
  // across the display with heart markers in the field. Here it runs as a
  // strip under the clock block: one heartbeat drawn in ~1.1s, a heart marker
  // at the strip's left that swells on each QRS spike, and fainter hearts
  // standing in the field at the strip's ends (as the video's hearts stand in
  // its falling-digit field). Style only — no number, no measurement.
  function heartPath(g, x, y, s) {
    g.beginPath();
    g.moveTo(x, y + s * 0.92);
    g.bezierCurveTo(x - s * 1.15, y + s * 0.18, x - s * 0.62, y - s * 0.78, x, y - s * 0.22);
    g.bezierCurveTo(x + s * 0.62, y - s * 0.78, x + s * 1.15, y + s * 0.18, x, y + s * 0.92);
    g.closePath();
  }
  function ecgY(p, base, amp) {
    // one beat: flat, small P bump, sharp QRS spike, T bump, flat
    if (p < 0.30) return base;
    if (p < 0.38) return base - amp * 0.16 * Math.sin((p - 0.30) / 0.08 * Math.PI);
    if (p < 0.43) return base + amp * 0.14 * ((p - 0.38) / 0.05);
    if (p < 0.50) return base - amp * (((p - 0.43) / 0.07) < 0.55 ? ((p - 0.43) / 0.07) / 0.55 : 1 - (((p - 0.43) / 0.07) - 0.55) / 0.45);
    if (p < 0.56) return base + amp * 0.30 * (1 - (p - 0.50) / 0.06);
    if (p < 0.60) return base + amp * 0.30 - amp * 0.30 * ((p - 0.56) / 0.04);
    if (p < 0.78) return base - amp * 0.20 * Math.sin((p - 0.60) / 0.18 * Math.PI);
    return base;
  }
  function drawPulse(now) {
    if (!built || !PW) { requestAnimationFrame(drawPulse); return; }
    pctx.clearRect(0, 0, PW, PH);
    var base = PH * 0.60, amp = PH * 0.46, span = PW * 2.4;
    var off = (now % 1100) / 1100 * (span / 3);
    var headP = ((now % 1100) / 1100 - 0.43 + 1) % 1;
    var beat = Math.max(0, 1 - Math.abs(headP - 0.5) * 6); // 1 at the QRS moment
    // the marker also swells on a REAL scan landing (ingest script
    // stamps __scanBeatPerf); the trace itself stays a style element.
    if (window.__scanBeatPerf) {
      var lb = 1 - (performance.now() - window.__scanBeatPerf) / 700;
      if (lb > beat) beat = Math.max(0, lb);
    }
    pctx.lineWidth = Math.max(2, Math.floor(PH * 0.045));
    pctx.lineJoin = 'round'; pctx.lineCap = 'round';
    pctx.shadowColor = 'rgba(57,255,106,.8)'; pctx.shadowBlur = PH * 0.10;
    // faint baseline, as the trace rides a ruled line in the video
    pctx.beginPath(); pctx.moveTo(0, base); pctx.lineTo(PW, base);
    pctx.strokeStyle = 'rgba(57,255,106,.18)'; pctx.stroke();
    // two passes of the waveform: drawn span + afterglow trail
    for (var pass = 0; pass < 2; pass++) {
      pctx.beginPath();
      for (var x = 0; x <= PW; x += 2) {
        var gp = ((x + off) % span) / span, lp = gp * 3 % 1;
        var y = ecgY(lp, base, amp);
        if (x === 0) pctx.moveTo(x, y); else pctx.lineTo(x, y);
      }
      pctx.strokeStyle = pass === 0 ? 'rgba(57,255,106,.30)' : GREEN;
      pctx.lineWidth = pass === 0 ? Math.max(3, Math.floor(PH * 0.075)) : Math.max(2, Math.floor(PH * 0.045));
      pctx.stroke();
    }
    pctx.shadowBlur = 0;
    // the marker heart — swells on the beat, like the video's hearts glow in the field
    var hs = PH * 0.17 * (1 + 0.30 * beat);
    pctx.save();
    pctx.shadowColor = 'rgba(57,255,106,.9)'; pctx.shadowBlur = PH * 0.16 * (0.5 + beat);
    heartPath(pctx, PW * 0.055, PH * 0.30, hs);
    pctx.fillStyle = GREEN; pctx.fill();
    pctx.restore();
    // fainter hearts standing in the field at the strip's far end
    heartPath(pctx, PW * 0.945, PH * 0.30, PH * 0.13);
    pctx.strokeStyle = 'rgba(57,255,106,.55)'; pctx.lineWidth = Math.max(1, Math.floor(PH * 0.03)); pctx.stroke();
    requestAnimationFrame(drawPulse);
  }
  layout();
  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  requestAnimationFrame(drawScope);
  requestAnimationFrame(drawPulse);
  function tick() {
    var d = new Date(), h = d.getHours() % 12; if (h === 0) h = 12;
    function p(n) { return (n < 10 ? '0' : '') + n; }
    document.getElementById('clock').textContent = h + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    document.getElementById('date').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
  }
  tick(); setInterval(tick, 250);
  if (navigator.getBattery) {
    navigator.getBattery().then(function (b) {
      var el = document.getElementById('batt');
      function upd() { el.textContent = Math.round(b.level * 100) + '%'; }
      upd(); b.addEventListener('levelchange', upd);
    }).catch(function () { /* no battery hook — readout stays hidden */ });
  }
</script>
<script>
  // ANALYZER LOGIC INGEST (signal-fleet rollout, Nov 23, 2026). The
  // shell pushes ApexWifiPush snapshots — src ANALYZER (the Apex
  // Wi-Fi Analyzer's ApexWifi/1 set, via the shell's pipe) or src
  // CONTAINER (the shell's own scan). Each snapshot passes the
  // five-step scrub on its way to the glass:
  //   1 PRE-TREAT — tagged src required; an entry needs a BSSID and
  //     an RSSI in [-100,-15]; dedupe by BSSID, strongest wins.
  //   2 WHIP — band from bandGhz; channel -> dial angle; RSSI raw
  //     for print, clamped copy for paint.
  //   3 NARROW — per band, the 8 strongest paint.
  //   4 ±SPEED TRACKS — per-BSSID RSSI history (last 6): variance
  //     feeds the ring ripple, the last step feeds the tag arrow,
  //     and a fresh snapshot timestamp is a scan LANDING — the
  //     pulse marker's beat.
  //   5 HANG STILLS — the last scrubbed picture holds; past 20 s
  //     without a snapshot the mode line prints FEED STALE + the
  //     last update clock. Nothing blanks, nothing invents motion.
  var RING_BANDS = {
    '2.4': { base: 0.90, color: '#ffc95c', label: '2.4' },
    '5':   { base: 0.72, color: '#39ff6a', label: '5' },
    '6':   { base: 0.54, color: '#57c8ff', label: '6' }
  };
  var ringState = { src: null, at: 0, aps: [] };
  var apHistory = {};
  var lastLandingAt = 0;
  window.__scopeState = { src: null, aps: 0, bands: {}, strongest: null, stale: false, landings: 0 };

  function bandOf(ghz) { return ghz >= 5.9 ? '6' : (ghz >= 4.9 ? '5' : '2.4'); }
  function chanAngle(band, ch) {
    if (band === '2.4') return (Math.min(14, Math.max(1, ch)) - 1) / 13 * Math.PI * 2;
    if (band === '5') return (Math.min(177, Math.max(36, ch)) - 36) / 141 * Math.PI * 2;
    return (Math.min(233, Math.max(1, ch)) - 1) / 232 * Math.PI * 2;
  }
  function clampRssi(r) { return Math.min(-35, Math.max(-95, r)); }

  window.ApexWifiPush = function (p) {
    if (!p || !Array.isArray(p.aps)) return;
    if (p.src !== 'ANALYZER' && p.src !== 'CONTAINER') return;
    var byBssid = {};
    for (var i = 0; i < p.aps.length; i++) {
      var a = p.aps[i];
      if (!a || !a.bssid || typeof a.rssi !== 'number' || a.rssi < -100 || a.rssi > -15) continue;
      if (!byBssid[a.bssid] || a.rssi > byBssid[a.bssid].rssi) byBssid[a.bssid] = a;
    }
    var clean = [];
    for (var bssid in byBssid) {
      var ap = byBssid[bssid];
      var band = bandOf(ap.bandGhz || 0);
      var h = apHistory[bssid] || (apHistory[bssid] = []);
      h.push(ap.rssi); if (h.length > 6) h.shift();
      var mean = 0, k;
      for (k = 0; k < h.length; k++) mean += h[k];
      mean /= h.length;
      var variance = 0;
      for (k = 0; k < h.length; k++) variance += (h[k] - mean) * (h[k] - mean);
      variance = h.length > 1 ? variance / h.length : 0;
      clean.push({
        ssid: ap.ssid || '', bssid: bssid, band: band,
        channel: ap.channel || 0, angle: chanAngle(band, ap.channel || 0),
        rssi: ap.rssi, plot: clampRssi(ap.rssi), variance: variance,
        delta: h.length > 1 ? ap.rssi - h[h.length - 2] : 0,
        connected: !!p.connectedBssid && p.connectedBssid === bssid
      });
    }
    clean.sort(function (x, y) { return y.rssi - x.rssi; });
    var perBand = {}, kept = [];
    for (var j = 0; j < clean.length; j++) {
      perBand[clean[j].band] = (perBand[clean[j].band] || 0) + 1;
      if (perBand[clean[j].band] <= 8) kept.push(clean[j]);
    }
    var at = (typeof p.at === 'number' && p.at > 0) ? p.at : Date.now();
    if (at > lastLandingAt) {
      lastLandingAt = at;
      window.__scanBeatPerf = performance.now();
      window.__scopeState.landings++;
    }
    ringState = { src: p.src, at: at, aps: kept };
    var bands = {};
    for (var q = 0; q < kept.length; q++) bands[kept[q].band] = (bands[kept[q].band] || 0) + 1;
    window.__scopeState.src = p.src;
    window.__scopeState.aps = kept.length;
    window.__scopeState.bands = bands;
    window.__scopeState.strongest = kept.length ? { ssid: kept[0].ssid, rssi: kept[0].rssi, delta: kept[0].delta } : null;
    window.__scopeState.stale = false;
  };

  function angDiff(a, b) {
    var d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // One ring per band present. Radius offset at each angle: AP peaks
  // (RSSI) minus co-channel dents (crowding) plus ripple (the band's
  // worst RSSI variance). A clean band draws a near-perfect circle;
  // a crowded, wandering band malforms. Blips: angle = channel,
  // radius = RSSI (strong near the hub). No bearing is claimed.
  function drawDataRings(g, c, R) {
    if (!ringState.aps.length) return;
    var maxR = R - 4;
    var bandKeys = ['2.4', '5', '6'];
    for (var bi = 0; bi < bandKeys.length; bi++) {
      var bk = bandKeys[bi], spec = RING_BANDS[bk];
      var inBand = [];
      for (var i = 0; i < ringState.aps.length; i++) if (ringState.aps[i].band === bk) inBand.push(ringState.aps[i]);
      if (!inBand.length) continue;
      var chanCount = {};
      for (var j = 0; j < inBand.length; j++) chanCount[inBand[j].channel] = (chanCount[inBand[j].channel] || 0) + 1;
      var worstVar = 0;
      for (var v = 0; v < inBand.length; v++) if (inBand[v].variance > worstVar) worstVar = inBand[v].variance;
      var rippleAmp = Math.min(1, worstVar / 36) * R * 0.018;
      var base = spec.base * maxR;
      g.beginPath();
      for (var s = 0; s <= 72; s++) {
        var th = s / 72 * Math.PI * 2;
        var r = base + Math.sin(th * 36) * rippleAmp;
        for (var a = 0; a < inBand.length; a++) {
          var dth = angDiff(th, inBand[a].angle);
          r += ((inBand[a].plot + 95) / 60) * R * 0.085 * Math.exp(-(dth * dth) / (2 * 0.16 * 0.16));
        }
        for (var chKey in chanCount) {
          if (chanCount[chKey] > 1) {
            var dch = angDiff(th, chanAngle(bk, parseInt(chKey, 10)));
            r -= (chanCount[chKey] - 1) * R * 0.028 * Math.exp(-(dch * dch) / (2 * 0.16 * 0.16));
          }
        }
        var x = c + Math.cos(th - Math.PI / 2) * r, y = c + Math.sin(th - Math.PI / 2) * r;
        if (s === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath();
      g.strokeStyle = spec.color; g.globalAlpha = 0.85;
      g.lineWidth = Math.max(1.5, R * 0.008); g.stroke(); g.globalAlpha = 1;
      g.fillStyle = spec.color;
      g.font = '700 ' + Math.max(10, Math.floor(R * 0.062)) + 'px ui-monospace,Menlo,Consolas,monospace';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(spec.label, c + R * 0.16, c - base + R * 0.045);
      for (var b2 = 0; b2 < inBand.length; b2++) {
        var bp = inBand[b2];
        var br = (1 - (bp.plot + 95) / 60) * 0.75 + 0.18;
        var bx = c + Math.cos(bp.angle - Math.PI / 2) * maxR * br;
        var by = c + Math.sin(bp.angle - Math.PI / 2) * maxR * br;
        g.beginPath(); g.arc(bx, by, Math.max(2.5, R * 0.016), 0, Math.PI * 2);
        g.fillStyle = spec.color; g.fill();
        if (bp.connected) {
          g.beginPath(); g.arc(bx, by, Math.max(5, R * 0.032), 0, Math.PI * 2);
          g.strokeStyle = '#eaffef'; g.lineWidth = 1.5; g.stroke();
        }
      }
    }
  }

  setInterval(function () {
    var mode = document.getElementById('mode');
    var tag = document.getElementById('tag');
    if (!ringState.src) { mode.textContent = 'SCOPE STANDBY'; tag.textContent = ''; return; }
    var stale = Date.now() - ringState.at > 20000;
    window.__scopeState.stale = stale;
    var n = ringState.aps.length;
    if (stale) {
      var d = new Date(ringState.at);
      var p2 = function (x) { return (x < 10 ? '0' : '') + x; };
      mode.textContent = 'FEED STALE · LAST ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + ' · SRC ' + ringState.src;
    } else {
      mode.textContent = 'SCOPE LIVE · ' + n + ' AP · SRC ' + ringState.src;
    }
    if (n) {
      var s0 = ringState.aps[0];
      var arrow = s0.delta > 0 ? ' ▲' + s0.delta : (s0.delta < 0 ? ' ▼' + (-s0.delta) : '');
      tag.textContent = (s0.ssid || '(HIDDEN)') + ' ' + s0.rssi + ' DBM' + arrow;
    } else tag.textContent = '';
  }, 500);
</script>
</body></html>
