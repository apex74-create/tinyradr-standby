  mostly avoid the machinery, and periodically misjudge: a slow

  nearest turning wheel). Contact with a TURNING wheel's disc or
  ring band (the hazard set is exactly the machinery gear map's six
  rotating forms; a still gear never eats) catches the fish: it is
  dragged around the rim for a beat, struggling, then DISSOLVES
  into little red line particles - 26 short segments in the face's
  own factory-lamp red #e5534b - that disperse, fade, and are gone.
  A new fish then spawns SMALL (scale 0.38) at the tank edge safest
  from the gears, swims, and GROWS to full size over 150 seconds -
  until it gets caught in the machinery. Respawn is staggered so
  the tank is never empty. NO counters, NO score, NO tally printed
  anywhere: the joke stays sardonic, not gamified. The school keeps
  its elliptical schooling as scenery; the yin-yang fight dart does

  html, body { background:#000; overflow:hidden; }

  #stage { position:absolute; background:#000; overflow:hidden; }
  #faceSvg { position:absolute; left:0; top:0; display:block; }
  .clk { position:absolute; color:var(--digit,#ffb52e);   /* SOLID: the glyph
           is filled outright with the card's digit amber, no stroke —
           the variant's one change from the traced face's HOLLOW digits */
         font-family:"ApexDigital","Courier New",monospace; font-weight:700;
         -webkit-text-stroke:0; paint-order:stroke fill;
         line-height:1; white-space:nowrap; letter-spacing:.02em;
         text-shadow:0 0 9px rgba(255,181,46,.5), 0 0 26px rgba(255,150,20,.30); }
  /* the seconds sit smaller: solid like the rest of the clock in
     this variant — no stroke width to carry over */
  #sec { -webkit-text-stroke-width:0; }
  /* the small indicator words: plain small caps in the body mono,
     solid face amber — DSEG at 14px muddies the letterforms (its
     M and S exist only as digit-glyph approximations), so these two
     words take the pre-restyle treatment; legibility wins */
  #alm { font-family:ui-monospace, Menlo, Consolas, monospace;
         color:var(--digit,#ffb52e); -webkit-text-stroke:0;
         text-shadow:0 0 6px rgba(255,181,46,.35); }
  /* the AM/PM marker takes the same plain treatment (pass 4):
     DSEG's A/M exist only as digit-glyph approximations and at
     segment weight the marker merged into the leading hour digit;
     plain caps read instantly as letters. DSEG keeps the numbers. */
  #pm { font-family:ui-monospace, Menlo, Consolas, monospace;
        color:var(--digit,#ffb52e); -webkit-text-stroke:0;
        letter-spacing:.08em;
        text-shadow:0 0 6px rgba(255,181,46,.35); }
  /* digitShade REMOVED with the sheet (Nov 8, 06:35): it was a
     translucent dark radial wash behind the digits — only dimming. */
  #binaryField { position:absolute; overflow:hidden; color:rgba(126,231,135,.85);
    font-weight:700; white-space:nowrap; pointer-events:none; }
  #binaryField .bcol { display:inline-block; vertical-align:top; }
  .lab { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700;
         fill:#e8d9a0; paint-order:stroke; stroke:rgba(0,0,0,.6); stroke-width:2.5px; }
  .chipT { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700; fill:#ffb52e; }
  body.thin .fine { display:none; }
  /* PCB TRACES ON THE GLASS — the final layer (Nov 8, 06:35):
     an overlay SVG above every face element, the aquarium-glass paint.
     Colours are CALLS from the card's call table (traceLine / tracePad /
     pulseCore), never a painted backing. */
  #traceSvg { position:absolute; left:0; top:0; display:block; pointer-events:none; }
  #traceSvg .tr { fill:none; stroke:#1e6b34; stroke-width:2; stroke-linejoin:round; }
  #traceSvg .pad { fill:#2ea043; }
  #traceSvg .padHole { fill:#05070a; }
  #traceSvg .pulseHalo { fill:#7ee787; opacity:.30; }
  #traceSvg .pulseCore { fill:#b7f7c3; }
  /* TANK (from Betta V2): grass sway/spring + bubble rise. The
     .sway/.spring classes ride betta's grass and bubbles only. */
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  .spring{transform-box:fill-box;transform-origin:50% 100%;animation:spring 128s linear infinite}
  @keyframes spring{0%{transform:scaleY(0)}3%{transform:scaleY(1)}46%{transform:scaleY(1)}
    49%{transform:scaleY(0)}52%{transform:scaleY(1)}96%{transform:scaleY(1)}
    98%{transform:scaleY(0)}100%{transform:scaleY(0)}}
  .rise{animation:rise 9s linear infinite}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-300px)}}
  /* ENPHASE BAND (new): the amber aggregated-conditions line over
     the hazard band — the flagship's #alm/#pm plain-caps treatment. */
  #wxLine { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700;
    color:var(--digit,#ffb52e); letter-spacing:.06em; white-space:nowrap;
    text-shadow:0 0 6px rgba(255,181,46,.35); }

         thinBelow:420, thinDrops:"finest pinion layer (class .fine)" },

/* ================= colour helpers ================= */
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function rgba(c,a){ var v=hx(c); return "rgba("+v[0]+","+v[1]+","+v[2]+","+a+")"; }

/* ================= THE MACHINE — gears from a spec =================
   Each spec: [cx, cy, rOut, rRoot, teeth, paletteKey, fillAlpha,
   strokeAlpha, periodSec (display, ×10), dir, fine?, skeleton?]
   periodSec 0 = static. Rings add an inner radius (annulus).
   skeleton? (index 11, owner cue Nov 8, 06:07) = open framework:
   rim + spokes + hub at strength, web fill dropped to a whisper. */
var NS = "http://www.w3.org/2000/svg";
function gearPts(cx,cy,rOut,rRoot,teeth){
  var pts=[], N=teeth*4;
  for(var i=0;i<N;i++){
    var seg=i%4, r=(seg===1||seg===2)?rOut:rRoot;
    var a=(i/N)*Math.PI*2 - Math.PI/2;
    pts.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));
  }
  return "M"+pts.join("L")+"Z";
}
function circPath(cx,cy,r){
  return "M"+(cx-r)+","+cy+" a"+r+","+r+" 0 1,0 "+(2*r)+",0 a"+r+","+r+" 0 1,0 "+(-2*r)+",0";
}
function el(name, attrs, parent){
  var e=document.createElementNS(NS,name);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

var ROT = [];   /* {g, period, dir, cx, cy, fine} — angles from absolute time */
function addRot(g, period, dir, cx, cy, fine){
  if(period>0) ROT.push({g:g, period:period, dir:dir, cx:cx, cy:cy, fine:!!fine});
}

  var cx=spec[0], cy=spec[1], key=spec[5], col=CARD.palette[key];
  var g=el("g",{},machine);
  var d = gearPts(cx,cy,spec[2],spec[3],spec[4]);
  if(ringInner) d += " " + circPath(cx,cy,ringInner);
  var shadow="drop-shadow("+CARD.light.gearShadowDx+"px "+CARD.light.gearShadowDy+
    "px "+CARD.light.gearShadowBlur+"px rgba(0,0,0,"+CARD.light.gearShadowOpacity+"))";
  if(spec[11]){   /* SKELETON (owner cue, Nov 8, 06:07): rim + spokes + hub
       at FULL strength; the solid web is dropped to a .05 whisper so the
       plate reads through the gear's own body. Teeth, motion, hub kept. */
    var web=el("path",{d:d, fill:rgba(col,0.05), stroke:"none",
      "fill-rule":"evenodd"},g);
    web.style.filter=shadow;
    var rimIn = ringInner ? ringInner : spec[3]*0.80;
    var rim=el("path",{d:gearPts(cx,cy,spec[2],spec[3],spec[4])+" "+circPath(cx,cy,rimIn),
      fill:rgba(col,Math.min(1,spec[6]+0.25)), stroke:rgba(col,spec[7]),
      "stroke-width":1.4, "fill-rule":"evenodd"},g);
    rim.style.filter=shadow;
    var hubR=Math.max(3,spec[3]*0.16), nSp=Math.max(4,Math.round(spec[4]/3));
    for(var si=0;si<nSp;si++){
      var a0=(si/nSp)*Math.PI*2, spW=Math.max(2.2,spec[3]*0.055);
      var px=Math.cos(a0+Math.PI/2), py=Math.sin(a0+Math.PI/2);
      var x1=cx+Math.cos(a0)*hubR,      y1=cy+Math.sin(a0)*hubR;
      var x2=cx+Math.cos(a0)*(rimIn-1), y2=cy+Math.sin(a0)*(rimIn-1);
      el("line",{x1:(x1+px*spW/2).toFixed(1), y1:(y1+py*spW/2).toFixed(1),
                 x2:(x2+px*spW/2).toFixed(1), y2:(y2+py*spW/2).toFixed(1),
                 stroke:rgba(col,Math.min(1,spec[6]+0.25)), "stroke-width":spW.toFixed(1)},g);
      el("line",{x1:(x1-px*spW/2).toFixed(1), y1:(y1-py*spW/2).toFixed(1),
                 x2:(x2-px*spW/2).toFixed(1), y2:(y2-py*spW/2).toFixed(1),
                 stroke:rgba(col,Math.min(1,spec[6]+0.25)), "stroke-width":spW.toFixed(1)},g);
    }
  } else {
    var p=el("path",{d:d, fill:rgba(col,spec[6]), stroke:rgba(col,spec[7]),
      "stroke-width":1.4, "fill-rule":"evenodd"},g);
    p.style.filter=shadow;
  }
  el("circle",{cx:cx, cy:cy, r:Math.max(3,spec[3]*0.16), fill:rgba(col,Math.min(1,spec[6]+0.25)),
    stroke:rgba(col,spec[7]), "stroke-width":1},g);

/* ================= THE BINARY FIELD — the fall, in the metal ======
   Columns of ones and zeros in the circuit field; the head glyph is
   lit. Style only, as on every board — no caption, no data claim. */
var binCols = [], binTimer = null;
function buildBinary(){
  var field = document.getElementById("binaryField");
  field.innerHTML = ""; binCols = [];
  var n = CARD.waterfall.columns;
  for(var c=0;c<n;c++){
    var span=document.createElement("span"); span.className="bcol";
    var chars=[];
    for(var i=0;i<16;i++) chars.push(Math.random()>0.5?"1":"0");
    span.textContent = chars.join("\n");
    span.style.whiteSpace="pre";
    field.appendChild(span);
    binCols.push({el:span, chars:chars});
  }
  if(binTimer) clearInterval(binTimer);
  binTimer = setInterval(function(){
    if(document.hidden) return;
    binCols.forEach(function(col){
      col.chars.pop(); col.chars.unshift(Math.random()>0.5?"1":"0");
      col.el.textContent = col.chars.join("\n");
    });
  }, CARD.waterfall.stepMs);
}

/* ================= PCB TRACES — the electrons ======================
   Pads are stamped at every run's ends (some with a via hole); four
   pulses ride the runs on absolute time — position is a pure function
   of the clock like every angle on this face, so a hidden face resumes
   exactly on cadence. A pulse runs its trace's length, turning the
   45-degree corners by the path's own geometry, and loops at the pad. */
var TRACE_PATHS = ["tp0","tp1","tp2","tp3","tp4","tp5"].map(function(id){
  return document.getElementById(id); });
var PULSES = [
  { p:0, period:9.0,  phase:0.00 }, { p:2, period:11.0, phase:0.35 },
  { p:5, period:8.0,  phase:0.60 }, { p:1, period:10.0, phase:0.15 } ];
(function buildTraces(){
  var pg = document.getElementById("pads"), ug = document.getElementById("pulses");
  TRACE_PATHS.forEach(function(path, i){
    var L = path.getTotalLength();
    [0, L].forEach(function(at, k){
      var pt = path.getPointAtLength(at);
      var c = el("circle",{ cx:pt.x.toFixed(1), cy:pt.y.toFixed(1), r:(k? 3.4 : 2.8) }, pg);
      c.setAttribute("class","pad");
      if(k && i % 2 === 0){
        var h = el("circle",{ cx:pt.x.toFixed(1), cy:pt.y.toFixed(1), r:1.3 }, pg);
        h.setAttribute("class","padHole");
      }
    });
  });
  PULSES.forEach(function(pu){
    pu.halo = el("circle",{ r:6.5 }, ug); pu.halo.setAttribute("class","pulseHalo");
    pu.core = el("circle",{ r:2.8 }, ug); pu.core.setAttribute("class","pulseCore");
    pu.len = TRACE_PATHS[pu.p].getTotalLength();
  });
})();
function movePulses(now){
  window.__pulses = PULSES.map(function(pu){
    var frac = ((now / pu.period) + pu.phase) % 1;
    var pt = TRACE_PATHS[pu.p].getPointAtLength(frac * pu.len);
    var fade = Math.pow(Math.sin(Math.PI * frac), 0.6);
    pu.core.setAttribute("cx", pt.x.toFixed(1)); pu.core.setAttribute("cy", pt.y.toFixed(1));
    pu.halo.setAttribute("cx", pt.x.toFixed(1)); pu.halo.setAttribute("cy", pt.y.toFixed(1));
    pu.core.setAttribute("opacity", (0.25 + 0.75 * fade).toFixed(2));
    pu.halo.setAttribute("opacity", (0.30 * fade).toFixed(2));
    return { p:pu.p, x:+pt.x.toFixed(1), y:+pt.y.toFixed(1) };
  });
}

/* ================= MOTION — angles from ABSOLUTE time ==============
   Machinery build: the registered rotators are the H-1 train only
   (see the train map above). Every angle is a pure function of the
   clock - angle = (now mod period)/period x 360 x dir - so there is
   no drift, a hidden face resumes exactly on cadence, and each
   wheel's angle can be verified against the displayed time. Periods
   are H-1's own: centre 3600 s, third 450 s, fourth 60 s, escape 5 s
   (stages 8 x 7.5 x 12). Nothing else on the plate rotates. */
function machineFrame(){
  if(!document.hidden){
    var now = Date.now()/1000;
    for(var i=0;i<ROT.length;i++){
      var r=ROT[i];
      if(FIT.thin && r.fine) continue;      /* thinned motion at small glass */
      var a = ((now % r.period)/r.period)*360*r.dir;
      r.g.setAttribute("transform","rotate("+a.toFixed(2)+" "+r.cx+" "+r.cy+")");
    }
    movePulses(now);
    window.__rot0 = ROT.length ? ROT[3].g.getAttribute("transform") : null;
  }
  requestAnimationFrame(machineFrame);
}

   Travelling wave down the spine: head leads, body follows, tail lags
   most and swings widest. Frequency rises with swim speed. */
function waveAt(w){
  return {head:3.0*Math.sin(w), body:5.5*Math.sin(w-0.7), tail:13.0*Math.sin(w-1.5)};
}
window.__wave=function(t,sp){ return waveAt(t*(1.2+2.1*sp)); };

        f.tail.setAttribute("transform","rotate("+f.wv.tail+" -40 0)");
        if(f.fanD)f.fanD.setAttribute("transform","scale(1 "+(1+0.55*f.flare).toFixed(3)+")");
        if(f.fanA)f.fanA.setAttribute("transform","scale(1 "+(1+0.55*f.flare).toFixed(3)+")");
        if(f.fanC)f.fanC.setAttribute("transform","scale("+(1+0.30*f.flare).toFixed(3)+" "+(1+0.45*f.flare).toFixed(3)+")");
      }
    });
    stepParticles(dt);
    state.A={x:+fishA.x.toFixed(1),y:+fishA.y.toFixed(1),ang:+fishA.ang.toFixed(1),scale:+fishA.scale.toFixed(2),mode:fishA.mode};
    state.B={x:+fishB.x.toFixed(1),y:+fishB.y.toFixed(1),ang:+fishB.ang.toFixed(1),scale:+fishB.scale.toFixed(2),mode:fishB.mode};
    state.school=[];
    school.forEach(function(s,idx){
      var u=s.c[5]+s.c[6]*tSec*2*Math.PI/s.c[4];
      var x=s.c[0]+s.c[2]*Math.cos(u), y=s.c[1]+s.c[3]*Math.sin(u);
      var vx=-s.c[2]*Math.sin(u)*s.c[6], vy=s.c[3]*Math.cos(u)*s.c[6];
      var hd=Math.atan2(vy,vx)*180/Math.PI+3*Math.sin(tSec*1.3+s.ph);
      s.el.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+") rotate("+hd.toFixed(1)+")");
      state.school.push({x:+x.toFixed(0),y:+y.toFixed(0),h:+hd.toFixed(0)});
    });
    window.__tank=state;
  }
  frame(0);
  if(window.requestAnimationFrame){
    var loop=function(ms){ frame(ms); window.requestAnimationFrame(loop); };
    window.requestAnimationFrame(loop);
  } else {
    setInterval(function(){ frame(Date.now()); },50);
  }
}catch(e){ /* driver absent: static poses, CSS grass, SMIL slick stand */ }

}catch(e){ /* tank driver absent: fish stand posed on the circuit */ }
requestAnimationFrame(machineFrame);

/* ================= THE CLOCK + CADENCE COUNTERS =================
   Detroit time from the real clock; the second steps on the true
   second. Counters are cadence positions from absolute time. */
var dtf = new Intl.DateTimeFormat("en-US",{ timeZone:"America/Detroit", hour12:false,
  weekday:"short", month:"2-digit", day:"2-digit",
  hour:"2-digit", minute:"2-digit", second:"2-digit" });
var WD2 = { Sun:"SU", Mon:"MO", Tue:"TU", Wed:"WE", Thu:"TH", Fri:"FR", Sat:"SA" };
var lastSec = -1;
function pad(n){ return (n<10?"0":"")+n; }
function tickClock(){
  var parts={}, list=dtf.formatToParts(new Date());
  for(var i=0;i<list.length;i++) parts[list[i].type]=list[i].value;
  var sec=parseInt(parts.second,10);
  if(sec===lastSec) return;
  lastSec=sec;
  var h24=parseInt(parts.hour,10)%24, h12=h24%12; if(h12===0) h12=12;
  document.getElementById("time").textContent = h12+":"+parts.minute;
  document.getElementById("sec").textContent = pad(sec);
  document.getElementById("pm").textContent = h24>=12 ? "PM" : "AM";
  document.getElementById("date").textContent =
    (WD2[parts.weekday]||"—")+" "+parts.month+"-"+parts.day;
  var t=Math.floor(Date.now()/1000);
  document.getElementById("chip1").textContent = (Math.floor((t%2160)/180)+1)+" / 12";
  document.getElementById("chip2").textContent = (Math.floor((t%6000)/600)+1)+" / 10";
  document.getElementById("chip3").textContent = (Math.floor((t%18000)/1800)+1)+" / 10";
  window.__clock = { time:h12+":"+parts.minute, sec:pad(sec),
                     date:document.getElementById("date").textContent };
}
tickClock(); setInterval(tickClock, 150);

/* ================= THE LIVE FEED — FACTORY CI LAMP =================
   EMBEDDED SNAPSHOT: the feed as read at build time from
   ~/workspace/goals/apex-ground-crew/hidden_files/tach-samples.jsonl
   (the Merge Spindle's ledger, 13 samples, notes trimmed). At runtime
   a fetched tach-samples.jsonl beside the face replaces it when its
   newest sample is newer. Staleness law as on the rectangle. */
var FEED_EMBEDDED = [
  {"atISO":"2026-11-07T22:37:00-05:00","rpm":0,"openPRs":5,"redPRs":2,"src":"backtest"},
  {"atISO":"2026-11-08T02:02:00-05:00","rpm":3141,"openPRs":6,"redPRs":2,"src":"backtest"},
  {"atISO":"2026-11-08T02:25:00-05:00","rpm":528,"openPRs":3,"redPRs":2,"src":"backtest"},
  {"atISO":"2026-11-08T02:37:10-05:00","rpm":1196,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T02:47:10-05:00","rpm":603,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T02:57:10-05:00","rpm":298,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:07:10-05:00","rpm":119,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:17:10-05:00","rpm":46,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:27:10-05:00","rpm":23,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:37:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:47:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T03:57:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"},
  {"atISO":"2026-11-08T04:07:10-05:00","rpm":0,"openPRs":1,"redPRs":1,"src":"spindle-turn"}
];
var lampEl=document.getElementById("factoryLamp"),
    haloEl=document.getElementById("factoryLampHalo");
var FEED = { series:[], source:"none", latest:null, mode:"NO MEASURE", ageMin:null };
function validSeries(list){
  if(!Array.isArray(list)) return [];
  return list.filter(function(s){ return s && typeof s.rpm==="number" &&
    isFinite(s.rpm) && !isNaN(Date.parse(s.atISO)); })
    .sort(function(a,b){ return Date.parse(a.atISO)-Date.parse(b.atISO); });
}
function renderFeed(){
  var fill="#15181d", halo="0";
  if(FEED.mode==="LIVE" && FEED.latest){
    if(FEED.latest.rpm>0){ fill="#7ee787"; halo=".4"; }
    else if(FEED.latest.redPRs>0){ fill="#e5534b"; halo=".45"; }   /* the stall signature */
    else { fill="#ffb52e"; halo=".3"; }
    haloEl.setAttribute("fill", fill);
  } else if(FEED.mode==="STALE"){ fill="#2a2e35"; }
  lampEl.setAttribute("fill", fill);
  haloEl.setAttribute("opacity", halo);
  window.__feed = { mode:FEED.mode, source:FEED.source,
    rpm: FEED.latest?FEED.latest.rpm:null,
    redPRs: FEED.latest?FEED.latest.redPRs:null,
    atISO: FEED.latest?FEED.latest.atISO:null,
    ageMin: FEED.ageMin, lamp: fill };
}
function applyFeed(list, source){
  var s=validSeries(list);
  if(!s.length){
    if(!FEED.series.length){ FEED.mode="NO MEASURE"; FEED.latest=null; renderFeed(); }
    return;
  }
  var newest=s[s.length-1];
  if(FEED.latest && Date.parse(newest.atISO)<Date.parse(FEED.latest.atISO)) return;
  FEED.series=s; FEED.source=source; FEED.latest=newest;
  FEED.ageMin=(Date.now()-Date.parse(newest.atISO))/60000;
  FEED.mode=(FEED.ageMin<=CARD.feed.staleAfterMin)?"LIVE":"STALE";
  renderFeed();
}
function recheckFeed(){
  if(!FEED.latest) return;
  FEED.ageMin=(Date.now()-Date.parse(FEED.latest.atISO))/60000;
  var m=(FEED.ageMin<=CARD.feed.staleAfterMin)?"LIVE":"STALE";
  if(m!==FEED.mode){ FEED.mode=m; renderFeed(); } else { window.__feed.ageMin=FEED.ageMin; }
}
applyFeed(FEED_EMBEDDED, "embedded");
if(window.fetch){
  fetch(CARD.feed.file, { cache:"no-store" }).then(function(res){
    if(!res.ok) throw new Error("feed "+res.status);
    return res.text();
  }).then(function(txt){
    var list=txt.split(/\r?\n/).filter(function(l){ return l.trim(); })
      .map(function(l){ try{ return JSON.parse(l); }catch(e){ return null; } });
    applyFeed(list, "fetch");
  }).catch(function(){ /* the snapshot stands */ });
}
setInterval(recheckFeed, CARD.feed.recheckSec*1000);
</script>

<script>
/* ================= THE ENPHASE CALL (new, Nov 8, 21:15) =================
   The prediction engine's own outputs, aggregated in AMBER over the
   hazard band: today's synthesized temp + the held window's peak
   call + the engine's confidence — read from the Enphase
   application's public endpoint (the same wave-collapse synthesis
   tinyradr.com/forecast displays; coordinates are the app's own
   published site, Camp Apex 44.98,-84.60).
   FAILURE-ISOLATED BY CONSTRUCTION: this block is its own <script>,
   the fetch is async and timeout-bounded (8 s), every step sits in
   try/catch, and the worst case writes "PREDICTION ENGINE · NO
   MEASURE" into its own line only. It defines no globals the clock,
   the machine or the tank read, and it runs after all of them.
   Refreshed every 15 minutes while the face lives. */
(function(){
  "use strict";
  var WX_URL="https://tinyradr.com/api/public/forecast?lat=44.98&lon=-84.60";
  function paint(txt){ try{ var el=document.getElementById("wxLine"); if(el) el.textContent=txt; }catch(e){} }
  function blank(){ paint("PREDICTION ENGINE \u00b7 NO MEASURE"); }
  function wxFetch(){
    try{
      if(!window.fetch){ blank(); return; }
      var ctl=("AbortController" in window)?new AbortController():null;
      var to=ctl?setTimeout(function(){ try{ctl.abort();}catch(e){} },8000):null;
      fetch(WX_URL,{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(res){
        if(to)clearTimeout(to);
        if(!res.ok) throw new Error("wx "+res.status);
        return res.json();
      }).then(function(j){
        try{
          var md=j&&j.metadata, tl=j&&j.timeline;
          if(!md||!tl||!tl.length||typeof tl[0].temp!=="number") { blank(); return; }
          var conf=(typeof md.confidence_score==="number")?Math.round(md.confidence_score*100)+"%":"--";
          var peak=(typeof md.peak_intensity==="number")?Math.round(md.peak_intensity):null;
          var txt="PREDICTION ENGINE \u00b7 TODAY "+Math.round(tl[0].temp)+"\u00b0F";
          if(peak!==null&&md.peak_date) txt+=" \u00b7 PEAK "+peak+"\u00b0 "+String(md.peak_date).slice(5);
          txt+=" \u00b7 CONF "+conf;
          paint(txt);
          try{ window.__wx={mode:"LIVE",today:tl[0].temp,peak:md.peak_intensity,peakDate:md.peak_date,conf:md.confidence_score,source:j.source||null}; }catch(e){}
        }catch(e){ blank(); }
      }).catch(function(){ if(to)clearTimeout(to); blank(); });
    }catch(e){ blank(); }
  }
  window.__wx={mode:"PENDING"};
  wxFetch();
  setInterval(wxFetch, 15*60*1000);
})();
</script>
