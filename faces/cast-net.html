<title>APEX — CAST NET (Hierographic Series)</title>
<!--
  APEX — CAST NET · Hierographic Series (Nov 10, 2026).
  Package Scope Inspector BUILD ORDER BO-2a (Specimen One, the
  Cast Net Package, verdict BOUNCE — variance named: the called
  app does not yet exist as a build; the FACE half fits its hole
  today). THE TEAM LAW (owner): the face tells time and CALLS its
  teammate; the app is the working surface. Engine inherited
  whole from Globe Tracker (Hierographic Series face 01) via
  The 19 (BO-1, the reference implementation).

   * THE PLATE: ONE plate ships — the CASTNET plate (Hierographic
     Plate 3): the wrist communicator casting the green mesh over
     drones at sunset. PROTECTED HOUSE ASSET
     (src/assets/hero-wrist-castnet.jpg) — the source bytes are
     used read-only and are never modified; the face embeds the
     squared crop (768x768, q80) this house already ships.
     A plate is a PLATE: a static hang behind the face's own
     moving elements (owner rule, Nov 8). One plate — no switcher.

   * THE MODEL — SEE · TALK · LOCATE: the ratified mesh model,
     PRESENTED as three labelled legs on a panel at the face's
     foot. Presentation only: the panel claims no live mesh
     state. Its state words ride the same native-bucket contract
     as the drone tags — the web build's bucket is EMPTY, so
     every leg reads its honest empty state: NO STATE. No nodes,
     no peers, no links, no positions, no traffic are drawn or
     implied anywhere in this face. The 3D floor mesh the partner
     is found on is the BO-2b wrist app's surface; that app is
     NOT BUILT, and this face says so on the panel itself.

   * THE CALL — RUNG B (owner order, Nov 20, 2026): NATIVE FIRST,
     WEB SECOND. The panel's button hands off to the Cast Net app
     in its native container first — shell bridge, then the app
     intent — where the licence is checked and the mesh is built
     and discovered natively. The web surface
     (https://castnetmesh.com) opens ONLY when no native container
     answers. (Rung A, the BO-2a build, opened the web surface
     only; the owner struck that order.) The BO-2b spinnable 3D
     floor remains the app's own surface, not the face's.
     window.__callCast is the bench handle { rung: "B",
     nativeFirst, intent, fallbackUrl, appPackage }.

   * TWO READOUTS — THE OWNER'S OPTIONS (the paper's BO-2a
     scope: "both readout variants (Casio / analog-smooth) as
     the owner's options"): DIGITAL (default) is the house Casio
     readout — DSEG7 segment digits (the house embed, SIL OFL
     1.1, zero external calls), HOLLOW, OLED-black hearts, bright
     green stroke, seated on a solid near-black chip. HANDS is
     the analog-smooth reading of the same clock: hour, minute
     and second hands SWEPT on the real clock from the centre
     post pin (Face Law 1) on the same chip. The READOUT button
     (bottom-left, the frame button's mirror) switches; the two
     readings never show at once. window.__readout is the bench
     handle; window.__toggleReadout() is the switch.

   * WIREFRAME DRONES: line-art quadcopters in the plate's green
     that FLY — smooth closed patrol loops with bank and bob —
     each carrying a TRACKING treatment: a lock bracket, a fading
     trail, a small label tag. Labels come from the NATIVE
     BUCKET contract below (empty here — generic TRK tags).

   * PULSE CURVE: a long trace sweeping the face's lower band,
     stopwatch feel — ONE full pulse per second, phase locked to
     the real clock's seconds fraction, with a millisecond
     shimmer riding it. It moves from first paint.

   * GPS LINE: one small line. The watch tells the time first;
     GPS is a line, not a gate. A real fix (host-granted) shows
     lat/lon + accuracy; otherwise the honest empty state
     "GPS — NO FIX". Coordinates are NEVER invented.

   * APEX GLYPHS: a sparse band of small vector marks in the
     house iconography idiom down the left edge. Decorative,
     sparse. The word APEX rides the top bar.

   * SHAPE IS BAKED AT PURCHASE (owner's ruling, Nov 10, 20:28
     EST): the single SHAPE constant below is the whole
     mechanism — no in-face shape buttons. This file is the
     SQUARE build. FRAME ON/OFF (the Apex Frame) is a button
     bottom-right per the Betta V3.1 pattern; the world seats
     into the frame glass by ONE uniform transform when ON.
     Default ON.

   * LAWS: motion from first paint — no REST/OBSERVED governor;
     battery care is the DIM-ONLY overlay after 60 s idle (never
     stops motion). Face Law 1 governs the HANDS readout (hands
     on the centre post pin, rotating on the real clock). No
     compass bezel exists here, so Face Law 2 has nothing to
     govern and none was invented.

  ================================================================
  NATIVE BUCKET CONTRACT — readNativeBucket()
  ================================================================
  The drone tags AND the mesh panel's state words read from ONE
  function:

      readNativeBucket() -> Array of { id, label, rssi }

  THIS WEB BUILD RETURNS THE EMPTY ARRAY, ALWAYS. A browser face
  has no radio access; there is nothing honest to report. Empty
  bucket: generic TRK tags on the drones, NO STATE on every leg
  of the mesh panel. NO sample SSIDs, NO invented nodes, peers,
  links or readings may ever be hardcoded here — fabricated
  entries are forbidden by the estate fabrication ban. The
  native Android container feeds real results through this same
  shape later; the face code does not change.

  PALETTE — CALLED COLOURS ONLY, solid tones, never washed:
  void #010403, chip #020a06 (readout backing, near-black green),
  plate green #39ff8e (drone wireframe + lock), track green
  #7dffb0 (trails/tags), pulse #46ffb4, shimmer #baffd9,
  glyph #2bd97c (dim), brand #baffd9, amber #ffb52e (frame trim +
  fault), GPS text #9fe8c0, fault red #ff4d4d, white #f2fff7.
-->
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#010403;}
  #stage{position:absolute;left:0;top:0;overflow:hidden;}
  #scene{position:absolute;left:0;top:0;display:block;}
  #world{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;}
  #backdropSlot{position:absolute;left:0;top:0;width:100%;height:100%;}
  .plateImg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;max-width:none;max-height:none;}
  canvas.fx{position:absolute;left:0;top:0;display:block;}
  #caseSvg{position:absolute;left:0;top:0;z-index:1;pointer-events:none;}
  #trimSvg{position:absolute;left:0;top:0;z-index:6;pointer-events:none;}
  #dim{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:7;}
  .hud{position:absolute;z-index:4;color:#baffd9;}
  #topbar{left:0;top:0;width:100%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;}
  #brand{margin:10px 0 0 14px;}
  #brandWord{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:21px;letter-spacing:7px;color:#baffd9;text-shadow:0 1px 6px #000,0 0 2px #000;}
  #brandSub{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;letter-spacing:3px;color:#2bd97c;margin-top:2px;text-shadow:0 1px 4px #000;}
  #dateBox{margin:12px 14px 0 0;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:2px;color:#9fe8c0;text-shadow:0 1px 4px #000;}
  #clockChip{position:absolute;left:50%;transform:translateX(-50%);top:12.5%;z-index:4;background:#020a06;border:1px solid rgba(57,255,142,.55);padding:6px 14px 7px;text-align:center;box-shadow:0 2px 14px rgba(0,0,0,.65);}
  #clock{font-family:"ApexDigital","Courier New",monospace;font-size:64px;line-height:1;color:#000;-webkit-text-stroke:2.6px #39ff8e;paint-order:stroke fill;letter-spacing:2px;white-space:nowrap;text-shadow:0 0 9px rgba(57,255,142,.40);}
  #secLine{margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:4px;color:#7dffb0;}
  #gpsLine{position:absolute;left:50%;transform:translateX(-50%);bottom:26.5%;z-index:4;background:rgba(2,10,6,.82);border:1px solid rgba(57,255,142,.28);border-radius:8px;padding:3px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:2px;color:#9fe8c0;white-space:nowrap;text-align:center;max-width:82%;}
  /* The plain-words line (owner, Nov 20, 2026): NO FIX must say
     what a fix IS and what its absence means, on the face itself —
     no mystery readouts. Rides inside the GPS chip as a second,
     smaller line; hidden the moment a real fix lands. */
  #gpsWhy{margin-top:2px;font-size:8px;letter-spacing:1px;color:#7dffb0;white-space:normal;line-height:1.35;}
  #fault{position:absolute;left:4%;top:5%;width:92%;z-index:8;display:none;background:#ff4d4d;color:#f2fff7;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:13px;text-align:center;padding:6px 0;letter-spacing:1px;}
  /* BOTTOM NO-FLY ZONE (house law, Nov 11 2026; fix Nov 18 2026): the
     bottom row - this button, its READOUT mirror, and the mesh panel -
     must never sit in the band where Android's three-button navigation
     lands. Clearance = the live safe-area bottom inset plus the row's
     own design offset; the native shell also pads the WebView by the
     same window inset (faces-library module MainActivity), so the row
     clears the bar in the APK and in the browser alike. */
  /* BUTTONS — APEX FLAVOUR (owner field report, Nov 20, 2026):
     small, round-ended pills, tucked to the corners — never big
     blocky boxes. The bottom no-fly clearance above still holds. */
  #frameBtn{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);z-index:10;background:rgba(10,12,14,.85);color:#39ff8e;border:1px solid rgba(31,157,67,.8);border-radius:999px;font-family:"Courier New",monospace;font-weight:bold;font-size:11px;letter-spacing:1.5px;padding:4px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  #frameBtn:active{color:#baffd9;}
  /* THE READOUT SWITCH — bottom-left, the frame button's mirror.
     A mode control, not a shape control: SHAPE stays baked. */
  #readoutBtn{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);z-index:10;background:rgba(10,12,14,.85);color:#39ff8e;border:1px solid rgba(31,157,67,.8);border-radius:999px;font-family:"Courier New",monospace;font-weight:bold;font-size:11px;letter-spacing:1.5px;padding:4px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  #readoutBtn:active{color:#baffd9;}
  /* THE ANALOG-SMOOTH READOUT — hands swept on the real clock,
     mounted on the centre post pin (Face Law 1), riding the same
     chip the Casio readout sits on. Shown only in HANDS mode. */
  #analogChip{position:absolute;left:50%;transform:translateX(-50%);top:12.5%;z-index:4;background:#020a06;border:1px solid rgba(57,255,142,.55);box-shadow:0 2px 14px rgba(0,0,0,.65);display:none;line-height:0;}
  #analogSvg{display:block;}
  /* THE MESH PANEL — SEE · TALK · LOCATE, the model presented,
     at the face's foot. A labelled diagram of the doctrine, not
     a sensor: every state word is NO STATE while the native
     bucket is empty (see the contract in the header). Its one
     live element is THE CALL button (Rung A, below). */
  /* Panel compaction (owner field report, Nov 20, 2026): the panel
     rides slimmer and a touch more transparent so the plate reads
     through its edges, and its tuck pill collapses the legs + note
     to a slim head-and-button bar — nothing it holds buries the
     face. The CALL button always stays. */
  #meshPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6.2% + env(safe-area-inset-bottom, 0px));z-index:4;background:rgba(2,10,6,.84);border:1px solid rgba(57,255,142,.40);border-radius:10px;padding:5px 12px 6px;text-align:center;}
  #meshHead{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;letter-spacing:2.5px;color:#2bd97c;white-space:nowrap;}
  #meshLegs{display:flex;gap:12px;justify-content:center;margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.2px;color:#9fe8c0;white-space:nowrap;}
  #meshLegs b{color:#baffd9;font-weight:700;}
  #meshNote{margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8px;letter-spacing:1.6px;color:#ffb52e;white-space:nowrap;}
  #meshTuck{position:absolute;top:1px;right:2px;width:21px;height:21px;border-radius:50%;border:1px solid rgba(57,255,142,.45);background:rgba(10,12,14,.7);color:#7dffb0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  /* NOTE (bench finding, BO-2a): the mesh panel carries NO
     box-shadow. A soft black shadow over the plate quantised,
     at its fully-opaque core against this plate's dark
     foreground, to the case colour #0a0c0e — an exact-colour
     census cannot tell that shadow from case fill, and the
     Frame Doctrine's census must read clean. The readout chips
     keep their shadows (their colour over this plate never
     lands on the case colour — measured), the panel drops its
     own: a labelled instrument panel needs no shadow to read. */
  /* THE CALL — RUNG B (owner order, Nov 20, 2026): NATIVE FIRST,
     WEB SECOND. The button asks the device for the Cast Net app
     in its native container first (shell bridge, then the app
     intent); the web surface opens ONLY when no native container
     answers. See the script block at window.__callCastGo. */
  #callCast{margin-top:5px;background:rgba(10,12,14,.85);color:#67e8f9;border:1px solid rgba(103,232,249,.75);border-radius:999px;font-family:"Courier New",monospace;font-weight:bold;font-size:11px;letter-spacing:1.5px;padding:4px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  #callCast:active{color:#baffd9;border-color:#baffd9;}

   exactly one, so there is no switcher and no cycle handle.
   window.__backdrop stays as the bench/diagnostic handle.
   ================================================================ */
var BACKDROPS = [
  { name: "castnet", label: "CASTNET", el: "plateGlobe" }
];
var backdropIdx = 0;
function applyBackdrop(){
  var slot = document.getElementById("backdropSlot");
  var cur = BACKDROPS[backdropIdx];
  if (slot) slot.setAttribute("data-backdrop", cur.name);
  window.__backdrop = { name: cur.name,
    plates: BACKDROPS.map(function(b){ return b.name; }) };
}

/* ================================================================
   THE CALL — RUNG B (owner order, Nov 20, 2026, 01:02 EST):
   NATIVE FIRST, WEB SECOND. Rung A opened the web surface and
   only the web surface; the owner struck that order — on his
   devices the Cast Net app is INSTALLED, and the button's first
   act is to hand off to the native container, where the licence
   lives and the mesh is built and discovered (a venue's local
   feed/mesh is found by the app's own native discovery, never
   by a web page). The web surface is the FALLBACK, fired only
   when no native container answers:
     1. a shell bridge, if the native container injected one
        (window.ApexNative.openCastNet) — the container performs
        its licence check and opens its mesh surface;
     2. the Android app intent for the house app
        (app.lovable.apexsignal, the build castnetmesh.com
        installs) with the web URL as its declared fallback;
     3. after a short beat, if this page is still in front (the
        app did not take the hand-off), the web surface opens.
   Nothing here claims a native answer that did not happen: the
   button reports what it is doing while it does it, and step 3
   is the honest residue when no app is on the device.
   Bench handle: window.__callCast { rung, nativeFirst, intent,
   fallbackUrl, appPackage }; window.__callCastGo() is the exact
   function the tap fires.
   ================================================================ */
var CAST_URL = "https://castnetmesh.com";
var CAST_APP_PACKAGE = "app.lovable.apexsignal";
var CAST_APP_INTENT = "intent://castnetmesh.com/#Intent;scheme=https;package=" +
  CAST_APP_PACKAGE + ";S.browser_fallback_url=" +
  encodeURIComponent(CAST_URL) + ";end";
window.__callCast = { rung: "B", nativeFirst: true,
  intent: CAST_APP_INTENT, fallbackUrl: CAST_URL,
  appPackage: CAST_APP_PACKAGE };
var callCastEl = document.getElementById("callCast");
window.__callCastGo = function(){
  var answered = false;
  var onVis = function(){ if (document.hidden) answered = true; };
  document.addEventListener("visibilitychange", onVis);
  var settle = function(){
    document.removeEventListener("visibilitychange", onVis);
  };
  /* 1 — the native container's own bridge, when a shell offers one. */
  var bridge = window.ApexNative || window.AndroidBridge || null;
  if (bridge && typeof bridge.openCastNet === "function"){
    try { bridge.openCastNet(); answered = true; settle(); return; }
    catch (e) { /* the bridge declined — fall through to the intent */ }
  }
  /* 2 — the installed app, by intent. */
  if (callCastEl) callCastEl.textContent = "OPENING THE APP…";
  try { window.location.href = CAST_APP_INTENT; } catch (e) {}
  /* 3 — web fallback: only if the app did not take us away. */
  setTimeout(function(){
    settle();
    if (!answered && !document.hidden){
      if (callCastEl) callCastEl.textContent = "NO APP — OPENING WEB…";
      window.open(CAST_URL, "_blank");
      setTimeout(function(){
        if (callCastEl) callCastEl.textContent = "OPEN CAST NET";
      }, 1200);
    } else if (callCastEl) {
      callCastEl.textContent = "OPEN CAST NET";
    }
  }, 1600);
};
if (callCastEl) callCastEl.addEventListener("click", function(ev){
  ev.stopPropagation(); window.__callCastGo();
});

/* THE PANEL TUCK — the mesh panel's pill collapses its legs and
   note to a slim head-and-button bar, so the plate underneath is
   never buried (owner field report, Nov 20, 2026). The CALL
   button stays in both states. */
var meshTuckEl = document.getElementById("meshTuck");
var meshTucked = false;
if (meshTuckEl) meshTuckEl.addEventListener("click", function(ev){
  ev.stopPropagation();
  meshTucked = !meshTucked;
  document.getElementById("meshLegs").style.display = meshTucked ? "none" : "";
  document.getElementById("meshNote").style.display = meshTucked ? "none" : "";
  meshTuckEl.textContent = meshTucked ? "+" : "–";
  meshTuckEl.setAttribute("aria-label",
    meshTucked ? "Untuck the mesh panel" : "Tuck the mesh panel to a slim bar");
});

/* ================================================================
   THE TWO READOUTS — the owner's options (BO-2a scope). DIGITAL
   (default): the Casio chip. HANDS: the analog-smooth reading —
   hour/minute/second hands swept on the real clock, mounted on
   the centre post pin of the analog chip's dial (Face Law 1).
   One reading at a time; the switch is a MODE control — SHAPE
   stays baked at purchase and has no control here.
   Bench handle: window.__readout { mode };
   window.__toggleReadout() is the switch the button fires.
   ================================================================ */
var readoutMode = "digital";
var readoutBtnEl = document.getElementById("readoutBtn");
function applyReadout(){
  var dig = readoutMode === "digital";
  /* visibility rides INLINE style on purpose: the readout chips
     are position:absolute with NO display in the stylesheet, so
     computed display is block even when the inline style hides
     them — the inline style IS the state */
  document.getElementById("clockChip").style.display = dig ? "" : "none";
  document.getElementById("analogChip").style.display = dig ? "none" : "block";
  if (readoutBtnEl) readoutBtnEl.textContent = dig ? "READOUT · DIGITAL" : "READOUT · HANDS";
  window.__readout = { mode: readoutMode };
}
window.__toggleReadout = function(){
  readoutMode = (readoutMode === "digital") ? "hands" : "digital";
  applyReadout();
};
if (readoutBtnEl) readoutBtnEl.addEventListener("click", function(ev){
  ev.stopPropagation(); window.__toggleReadout();
});
(function buildAnalogTicks(){
  var g = document.getElementById("analogTicks");
  if (!g) return;
  var NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 12; i++){
    var a = i * Math.PI / 6, big = (i % 3 === 0);
    var r1 = big ? 47 : 51, r2 = 55;
    var ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", (60 + r1 * Math.sin(a)).toFixed(1));
    ln.setAttribute("y1", (60 - r1 * Math.cos(a)).toFixed(1));
    ln.setAttribute("x2", (60 + r2 * Math.sin(a)).toFixed(1));
    ln.setAttribute("y2", (60 - r2 * Math.cos(a)).toFixed(1));
    ln.setAttribute("stroke", "#2bd97c");
    ln.setAttribute("stroke-width", big ? 2.4 : 1.2);
    g.appendChild(ln);
  }
})();
function drawAnalog(now){
  if (readoutMode !== "hands") return;
  var s = now.getSeconds() + now.getMilliseconds() / 1000;
  var m = now.getMinutes() + s / 60;
  var h = (now.getHours() % 12) + m / 60;
  var set = function(id, deg){
    var el = document.getElementById(id);
    if (el) el.setAttribute("transform", "rotate(" + deg.toFixed(2) + " 60 60)");
  };
  set("handH", h * 30); set("handM", m * 6); set("handS", s * 6);
}
/* the mesh panel's state words: the bucket is the only source,
   and it is empty in this build — the words stay NO STATE. The
   function exists so the native container's real bucket drives
   the same words later without a face rewrite. */
function drawMeshPanel(){
  var st = bucket.length ? "STATE" : "NO STATE";
  ["legSee", "legTalk", "legLocate"].forEach(function(id){
    var el = document.getElementById(id);
    if (el && el.textContent !== st) el.textContent = st;
  });
}
applyReadout();

/* ================================================================
   NATIVE BUCKET CONTRACT — see the header comment block for the
   full contract. readNativeBucket() returns an array of
   { id, label, rssi }. THIS WEB BUILD RETURNS [] — a browser
   face has no radio access, and fabricated entries are
   forbidden. The native Android container will feed real Wi-Fi
   scan results through this same shape later.
   ================================================================ */
function readNativeBucket(){
  return [];
}
var bucket = readNativeBucket();

/* ---------------- stage + sizing ---------------- */
var stage = document.getElementById("stage");
var world = document.getElementById("world");
var cv = document.getElementById("fx");
var ctx = cv.getContext("2d");
for (var pi = 0; pi < BACKDROPS.length; pi++){
  var pimg = document.getElementById(BACKDROPS[pi].el);
  if (pimg) pimg.style.objectPosition = platePosition();
}
applyBackdrop();

var VW = 512, VH = 512;              /* measured viewport px */
var frameInset = 0, frameInsetY = 0; /* set by the frame layer:
                                        the frame glass inset in
                                        world coordinates */
function innerW(){ return Math.max(1, VW - 2 * frameInset); }
function innerH(){ return Math.max(1, VH - 2 * frameInsetY); }
var frameWasOn = true;               /* seating state tracker */

function sizeStage(){
  /* measure: the viewport is the stage, capped to a square by
     the size of the layout viewport's shorter side — the face's
     canonical build is SQUARE (shape-at-purchase), and the frame
     seats into the largest centred square the window offers. */
  var nVW = Math.max(1, Math.round(Math.min(window.innerWidth, window.innerHeight)));
  var nVH = nVW;
  var moved = (nVW !== VW || nVH !== VH);
  VW = nVW; VH = nVH;
  stage.style.width = VW + "px"; stage.style.height = VH + "px";
  /* CENTRED IN THE VIEWPORT (owner field report, Nov 20, 2026):
     the square stage seats in the middle of the window, letterboxed
     — black strips left/right in landscape, black bands top/bottom
     in portrait — never hugged to the left or pushed to the top.
     The page behind the stage is the void colour, so the bands
     read as the letterbox they are. */
  stage.style.left = Math.round((window.innerWidth - VW) / 2) + "px";
  stage.style.top = Math.round((window.innerHeight - VH) / 2) + "px";
  document.documentElement.style.height = VH + "px";
  document.body.style.height = VH + "px";
  /* the stage is positioned, so html/body collapse to their
     (zero) in-flow height unless told — pin them to the
     viewport so any containing-block percentage below the
     stage resolves against the real stage height */
  world.style.height = VH + "px";
  var bslot = document.getElementById("backdropSlot");
  if (bslot){ bslot.style.height = VH + "px"; bslot.style.width = VW + "px"; }
  /* coordinate map: the driver's drawing space is the frame
     glass in world coordinates — canvas backing = inner size,
     canvas element offset by the frame inset — so when the world
     seats into the glass by its transform, the drawing lands
     exactly inside it. Frame OFF: inset 0, full-stage canvas. */
  cv.width = innerW(); cv.height = innerH();
  cv.style.left = frameInset + "px"; cv.style.top = frameInsetY + "px";
  cv.style.width = innerW() + "px"; cv.style.height = innerH() + "px";
  layoutHud();
  /* the patrol is fraction-seeded against the stage, so a real
     viewport change reseeds it — but a bare frame toggle is not
     a viewport change and must not teleport the craft */
  if (moved) seedDrones();
}
function layoutHud(){
  var m = Math.min(VW, VH);
  var clock = document.getElementById("clock");
  /* Clock readout +12% (owner, Nov 20, 2026: 0.125 -> 0.140 of the
     stage). Checked against the patrol: drone 0's loop already
     transits behind the opaque chip; the widened chip takes ~7px
     more per side at full size and the craft still flank it on
     both ends. */
  clock.style.fontSize = Math.round(m * 0.140) + "px";
  clock.style.webkitTextStrokeWidth = Math.max(1.6, m * 0.005) + "px";
  var brand = document.getElementById("brandWord");
  brand.style.fontSize = Math.round(m * 0.041) + "px";
  var chip = document.getElementById("clockChip");
  chip.style.top = Math.round(VH * 0.125) + "px";
  var achip = document.getElementById("analogChip");
  var achipWas = achip.style.display || "block";
  achip.style.display = "block";
  achip.style.top = Math.round(VH * 0.125) + "px";
  var asvg = document.getElementById("analogSvg");
  var asz = Math.round(m * 0.203);
  asvg.setAttribute("width", asz); asvg.setAttribute("height", asz);
  achip.style.display = achipWas;   /* restore the mode's own state:
                                       style.width reads 0 on a
                                       display:none chip — the
                                       transform in applyFrame
                                       depends on this */
  var gps = document.getElementById("gpsLine");
  /* 0.265 -> 0.295 (Nov 20, 2026): the chip now carries the
     plain-words second line, and at small stage heights the
     taller chip met the mesh panel's top edge. The raise seats
     the chip clear of the panel in both orientations. */
  gps.style.bottom = Math.round(VH * 0.295) + "px";
  gps.style.fontSize = Math.max(10, Math.round(m * 0.023)) + "px";
  var gpsWhy = document.getElementById("gpsWhy");
  if (gpsWhy) gpsWhy.style.fontSize = Math.max(8, Math.round(m * 0.0165)) + "px";
}
var resizeTimer = 0;
window.addEventListener("resize", function(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(sizeStage, 60);
});

/* ---------------- wireframe drones ----------------
   Three patrol craft on smooth closed Lissajous loops (the
   bench reads these same parameters, so what it samples is what
   flies). Each drone: a line-art quadcopter — body diamond, four
   arms, four rotor rings that shimmer, a belly eye — drawn in
   the plate's green, thin strokes. The TRACKING treatment rides
   with it: corner-bracket lock box, a fading trail of past
   positions, and a label tag under the box. */
function makeDrone(i, cx, cy, rx, ry, sp, ph){
  return { i:i, cx:cx, cy:cy, rx:rx, ry:ry, sp:sp, ph:ph,
           x:0, y:0, vx:0, vy:0, trail:[] };
}
var drones = [];
function seedDrones(){
  var W = innerW(), H = innerH();
  drones = [
    makeDrone(0, 0.66*W, 0.30*H, 0.150*W, 0.085*H, 0.55, 0.0),
    makeDrone(1, 0.40*W, 0.52*H, 0.170*W, 0.100*H, 0.42, 2.1),
    makeDrone(2, 0.72*W, 0.60*H, 0.120*W, 0.075*H, 0.68, 4.2)
  ];
}
function dronePos(d, t){
  var x = d.cx + d.rx * Math.sin(d.sp * t + d.ph);
  var y = d.cy + d.ry * Math.sin(2 * d.sp * t + d.ph * 1.7);
  return [x, y];
}
function droneTag(d){
  var b = bucket[d.i];
  if (b && b.label) return String(b.label).slice(0, 14);
  return "TRK-0" + (d.i + 1);
}
function drawDrone(d, t, nowMs){
  var W = innerW();
  var s = Math.max(9, W * 0.021);              /* drone half-size */
  var x = d.x, y = d.y;
  var bank = Math.max(-0.45, Math.min(0.45, d.vx * 0.0016));
  /* trail — past positions, fading */
  ctx.lineWidth = 1;
  for (var i = 1; i < d.trail.length; i++){
    var a = i / d.trail.length;
    ctx.strokeStyle = PAL.trail; ctx.globalAlpha = 0.05 + 0.20 * a;
    ctx.beginPath();
    ctx.moveTo(d.trail[i-1][0], d.trail[i-1][1]);
    ctx.lineTo(d.trail[i][0], d.trail[i][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  /* the craft — wireframe, thin strokes in the plate's green */
  ctx.save();
  ctx.translate(x, y); ctx.rotate(bank);
  ctx.strokeStyle = PAL.drone; ctx.lineWidth = 1.3;
  ctx.beginPath();                              /* body diamond */
  ctx.moveTo(0, -s*0.45); ctx.lineTo(s*0.55, 0); ctx.lineTo(0, s*0.45); ctx.lineTo(-s*0.55, 0);
  ctx.closePath(); ctx.stroke();
  var arms = [[-1,-1],[1,-1],[-1,1],[1,1]];
  for (var k = 0; k < 4; k++){
    var ax = arms[k][0] * s, ay = arms[k][1] * s * 0.72;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ax, ay); ctx.stroke();
    var rr = s * 0.34 * (1 + 0.10 * Math.sin(nowMs * 0.05 + k * 1.7 + d.i));
    ctx.beginPath(); ctx.ellipse(ax, ay, rr, rr * 0.36, 0, 0, 6.2832); ctx.stroke();
  }
  ctx.fillStyle = PAL.drone;                    /* belly eye */
  ctx.beginPath(); ctx.arc(0, 0, Math.max(1.2, s * 0.10), 0, 6.2832); ctx.fill();
  ctx.restore();
  /* tracking lock — corner brackets that ride the craft */
  var b = s * 1.9, bl = s * 0.55;
  ctx.strokeStyle = PAL.drone; ctx.lineWidth = 1.4;
  var cs = [[-1,-1],[1,-1],[-1,1],[1,1]];
  for (var c = 0; c < 4; c++){
    var px = x + cs[c][0] * b, py = y + cs[c][1] * b;
    ctx.beginPath();
    ctx.moveTo(px - cs[c][0] * bl, py);
    ctx.lineTo(px, py);
    ctx.lineTo(px, py - cs[c][1] * bl);
    ctx.stroke();
  }
  /* dashed track line from the box down to the tag */
  ctx.save();
  ctx.setLineDash([2, 3]);
  ctx.strokeStyle = PAL.trail; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y + b); ctx.lineTo(x, y + b + 7); ctx.stroke();
  ctx.restore(); ctx.globalAlpha = 1;
  /* label tag */
  var tag = droneTag(d);
  ctx.font = "600 " + Math.max(8, Math.round(W * 0.017)) + "px ui-monospace, Menlo, Consolas, monospace";
  var tw = ctx.measureText(tag).width;
  var tx = Math.max(2, Math.min(innerW() - tw - 8, x - tw / 2 - 4));
  var ty = y + b + 8;
  ctx.fillStyle = "rgba(2,10,6,.78)";
  ctx.fillRect(tx, ty, tw + 8, 13);
  ctx.strokeStyle = PAL.drone; ctx.lineWidth = 0.8;
  ctx.strokeRect(tx + 0.5, ty + 0.5, tw + 7, 12);
  ctx.fillStyle = PAL.tag; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(tag, tx + 4, ty + 7);
}

/* ---------------- the pulse curve ----------------
   One full pulse per second: phase = the real clock's position
   inside its current second. A smooth trace (fundamental + one
   harmonic) sweeps the lower band; a millisecond shimmer — a
   fast fine ripple whose phase runs on the millisecond fraction
   — rides the same line, and a bright head dot runs the sweep. */
function drawPulse(now, nowMs){
  var W = innerW(), H = innerH();
  var x0 = W * 0.06, x1 = W * 0.94;
  var yBase = H * 0.775, amp = H * 0.052;
  /* NAMED (owner, Nov 20, 2026): the ribbon is the face's
     multi-purpose signal trace — gate state and pulse-class
     (heart-rate class) signals ride it when the app feeds them.
     Its name and purpose sit under its left end — above the
     trace they collided with the GPS chip — in the trace's own
     hand. The trace itself stays what it has always been: one
     pulse per second on the real clock. */
  ctx.fillStyle = PAL.trail; ctx.globalAlpha = 0.6;
  ctx.font = "600 " + Math.max(7, H * 0.016) + "px ui-monospace, Menlo, Consolas, monospace";
  ctx.fillText("PULSE RIBBON", x0, yBase + amp + 13);
  ctx.fillText("GATE · BODY SIGNALS", x0, yBase + amp + 22);
  ctx.globalAlpha = 1;
  var secFrac = (now.getSeconds() % 60) / 60 +
                (now.getMilliseconds() / 1000) / 60;
  var phase = secFrac * 6.2832;                 /* one pulse / second */
  var msFrac = now.getMilliseconds() / 1000;    /* the ms shimmer */
  ctx.strokeStyle = "rgba(70,255,180,.28)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, yBase); ctx.lineTo(x1, yBase); ctx.stroke();
  ctx.strokeStyle = PAL.pulse; ctx.lineWidth = 2;
  ctx.beginPath();
  for (var px = x0; px <= x1; px += 3){
    var f = (px - x0) / (x1 - x0);
    var y = yBase
      - Math.sin(f * 6.2832 - phase) * amp
      - Math.sin(f * 12.566 - phase * 2) * amp * 0.32
      + Math.sin(f * 51.0 - msFrac * 25.13) * amp * 0.10;
    if (px === x0) ctx.moveTo(px, y); else ctx.lineTo(px, y);
  }
  ctx.stroke();
  var hx = x0 + ((nowMs / 1000) % 4) / 4 * (x1 - x0);   /* 4 s sweep */
  var hf = (hx - x0) / (x1 - x0);
  var hy = yBase
    - Math.sin(hf * 6.2832 - phase) * amp
    - Math.sin(hf * 12.566 - phase * 2) * amp * 0.32
    + Math.sin(hf * 51.0 - msFrac * 25.13) * amp * 0.10;
  ctx.fillStyle = PAL.shimmer;
  ctx.beginPath(); ctx.arc(hx, hy, 2.6, 0, 6.2832); ctx.fill();
}
</script>
<script>
"use strict";
/* ================================================================
   THE APEX FRAME — apex-frame v1, geometry ported from the
   LOKMAT FRAME of the condensed engine face (Betta V3.1's port),
   re-based per stage by K = min(stage) / 640 — same case, same
   trim, same words, same bolts, all derived from the one glass
   rect so the seating can never disagree with the frame the
   user sees. Case under the world, trim over it;
   FRAME ON seats the whole world inside the glass by ONE uniform
   transform (translate + scale about the frame centre): no clip
   path, nothing stretched. FRAME OFF is the full-bleed face.
   Bench handle: window.__apexFrame / window.__toggleFrame().
   ================================================================ */
(function(){
  var caseSvg = document.getElementById("caseSvg");
  var trimSvg = document.getElementById("trimSvg");
  /* the frame design space is the face's own measured stage:
     Betta's 640×480 case re-based by K = min(VW,VH) / 640, so the
     trim words and bolts ride the case at its real edges on any
     stage aspect (a square viewBox stretched over a tall stage
     would pull the bolts off the glass corners). */
  /* CLIP FIX (Nov 16, 2026): the geometry below is BUILT, not
     baked — buildFrameGeometry() derives K, the case and the
     glass from the CURRENT measured stage (VW/VH) every time it
     runs, and applyFrame() measures first, then builds, then
     seats. The shipped defect: this block ran ONCE at boot,
     when VW/VH were still the 512x512 defaults (the first real
     sizeStage() measurement happens inside applyFrame, after
     the geometry was already computed), so on any screen that
     was not 512x512 the case stayed 512px wide, the glass kept
     its 512-stage rect, and the world seated as a fixed
     329.6x329.6 square offset 91.2px right and down — the left
     quarter of the glass empty, the face's right side off the
     stage and clipped. At exactly 512x512 the numbers agreed,
     which is why the bench never saw it. */
  var caseG = null, trim = null;
  var GLASS = { x:0, y:0, width:0, height:0 };
  function buildFrameGeometry(){
    while (caseSvg.firstChild) caseSvg.removeChild(caseSvg.firstChild);
    while (trimSvg.firstChild) trimSvg.removeChild(trimSvg.firstChild);
    var K = Math.min(VW, VH) / 640;
    caseSvg.setAttribute("viewBox", "0 0 " + VW + " " + VH);
  trimSvg.setAttribute("viewBox", "0 0 " + VW + " " + VH);
  caseSvg.style.width = VW + "px"; caseSvg.style.height = VH + "px";
  trimSvg.style.width = VW + "px"; trimSvg.style.height = VH + "px";
  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  /* PAINT ORDER (the Casio rule — owner's frame doctrine, Nov 10,
     21:36-21:37 EST): case (z 1) UNDER the world (z 2), trim
     (z 6) OVER it. As Betta's single SVG enforces with insert
     order (case, then #tankWorld, then trim); here two stacked
     SVG layers sandwich a DOM subtree, so the order rides on
     z-index — and #world MUST carry its 2 explicitly. At z auto
     the world paints in the level-0 layer, UNDER the z-1 case,
     whose opaque inner field then covers the glass solid
     (the Nov 10 black-glass defect: glass interior 100.0% flat
     #0a0c0e by pixel census; convicted by the case-hidden test).
     THE CASE IS A HOLLOW RING, never a cover: its opaque field
     exists ONLY in the rim between the case rect and the glass
     rect (a ring drawn as outer rect minus glass window, via
     fill-rule evenodd — the same ring-only construction as
     Betta's case group). The glass window itself is genuinely
     open: no frame layer paints any pixel or alpha inside it.
     Only the seated world shows there, exactly as a dial shows
     through a real Casio case window. (The trim's amber line
     and the hex bolts live in the rim/gasket zone, over the
     case — never over the window interior.)
     Geometry: Betta's case (630×470 in 640×480) becomes the
     case FOR THIS STAGE, centred; the glass is the case's
     inner rect (572×412 in the design space), scaled by K and
     centred. One source rect — case, trim, bolts and the
     world seating all read from it. */
  var caseW = 630*K, caseH = 470*K;
  var caseX = (VW - caseW) / 2, caseY = (VH - caseH) / 2;
  var glassW = 572*K, glassH = 412*K;
  var glassX = (VW - glassW) / 2, glassY = (VH - glassH) / 2;
  caseG = mk("g", { id:"apexFrameCase" }, caseSvg);
  /* the case body as ONE hollow ring (Betta's construction):
     outer case path minus the glass window, even-odd — opaque
     case metal out to the bezel, the window punched genuinely
     open. A filled rect here instead would be a screen cover. */
  function ringPath(x, y, w, h, r){
    return "M" + x + "," + (y + r) +
      " A" + r + "," + r + " 0 0 1 " + (x + r) + "," + y +
      " H" + (x + w - r) +
      " A" + r + "," + r + " 0 0 1 " + (x + w) + "," + (y + r) +
      " V" + (y + h - r) +
      " A" + r + "," + r + " 0 0 1 " + (x + w - r) + "," + (y + h) +
      " H" + (x + r) +
      " A" + r + "," + r + " 0 0 1 " + x + "," + (y + h - r) + " Z";
  }
  mk("path", { d: ringPath(caseX, caseY, caseW, caseH, 38*K) + " " +
                    ringPath(caseX + 15*K, caseY + 15*K, 600*K, 440*K, 30*K),
               "fill-rule":"evenodd",
               fill:"#14161a", stroke:"#2c2f36", "stroke-width":2 }, caseG);
  mk("path", { d: ringPath(caseX + 15*K, caseY + 15*K, 600*K, 440*K, 30*K) + " " +
                    ringPath(glassX, glassY, glassW, glassH, 22*K),
               "fill-rule":"evenodd",
               fill:"#0a0c0e", stroke:"rgba(255,181,46,.35)", "stroke-width":1.5 }, caseG);
  trim = mk("g", { id:"apexFrameTrim" }, trimSvg);
  mk("rect", { x:caseX + 15*K, y:caseY + 15*K, width:600*K, height:440*K, rx:30*K,
               fill:"none", stroke:"rgba(255,181,46,.35)", "stroke-width":1.5 }, trim);
  var words = mk("g", { fill:"#565b63" }, trim);
  words.setAttribute("style", "font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700");
  function word(txt, x, y, size, ls, rot){
    var t = mk("text", { x:x, y:y, "font-size":size*K, "letter-spacing":ls*K,
                         "text-anchor":"middle",
                         transform:"rotate(" + rot + " " + x + " " + y + ")" }, words);
    t.textContent = txt; return t;
  }
  /* Betta's word anchors ride the case's left/right rails */
  word("ADJUST", caseX + 10*K, caseY + 155*K, 13, 3, -90);
  word("MODE", caseX + 10*K, caseY + 315*K, 13, 3, -90);
  word("LIGHT", caseX + caseW - 10*K, caseY + 155*K, 13, 3, 90);
  word("START·STOP", caseX + caseW - 10*K, caseY + 315*K, 11, 2, 90);
  var bolts = mk("g", { fill:"#22252b", stroke:"#3a3e46", "stroke-width":1.5 }, trim);
  [[glassX, glassY], [glassX + glassW, glassY],
   [glassX, glassY + glassH], [glassX + glassW, glassY + glassH]].forEach(function(c){
    var cx = c[0], cy = c[1], pts = [];
    for (var i = 0; i < 6; i++){
      var a = i * Math.PI/3 - Math.PI/2;
      pts.push((cx + 13*K*Math.cos(a)).toFixed(1) + "," + (cy + 13*K*Math.sin(a)).toFixed(1));
    }
    mk("polygon", { points: pts.join(" ") }, bolts);
    mk("circle", { cx:cx, cy:cy, r:4*K, fill:"#14161a", stroke:"#3a3e46", "stroke-width":1.2 }, bolts);
  });

    GLASS = { x:glassX, y:glassY, width:glassW, height:glassH };
  }
  var worldEl = document.getElementById("world");
  var btn = document.getElementById("frameBtn");
  var frameOn = true;
  function applyFrame(){
    sizeStage();
    buildFrameGeometry();
    var wEl = document.getElementById("world");
    if (frameOn){
      var sx = GLASS.width / VW, sy = GLASS.height / VH;
      var s = Math.min(sx, sy);
      var tx = GLASS.x - (s - sx) * VW / 2, ty = GLASS.y - (s - sy) * VH / 2;
      wEl.style.transformOrigin = "0 0";
      wEl.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
      caseG.style.display = ""; trim.style.display = "";
      frameInset = Math.round((1 - s) * VW / 2);
      frameInsetY = Math.round((1 - s) * VH / 2);
    } else {
      wEl.style.transform = "";
      caseG.style.display = "none"; trim.style.display = "none";
      frameInset = 0; frameInsetY = 0;
    }
    if (btn) btn.textContent = frameOn ? "FRAME ON" : "FRAME OFF";
    window.__apexFrame = { on: frameOn,
      caseSource: "LOKMAT FRAME of the condensed engine face (640x480 case geometry, re-based per stage: K = min(VW,VH)/640, case centred, glass keeps Betta's 572x412-in-640x480 proportions)",
      glass: { x:GLASS.x, y:GLASS.y, width:GLASS.width, height:GLASS.height },
      worldTransform: frameOn ? wEl.style.transform : "none" };
    sizeStage();
  }
  window.__toggleFrame = function(){ frameOn = !frameOn; applyFrame(); };
  if (btn) btn.addEventListener("click", function(ev){ ev.stopPropagation(); window.__toggleFrame(); });
  window.__applyFrame = applyFrame;
  var frameResizeTimer = 0;
  window.addEventListener("resize", function(){
    if (frameResizeTimer) clearTimeout(frameResizeTimer);
    frameResizeTimer = setTimeout(applyFrame, 60);
  });
  applyFrame();
})();
</script>
<script>
"use strict";
/* ================================================================
   GLYPHS · CLOCK · GPS · THE ALWAYS-LIVE DRIVER
   ================================================================ */
function drawGlyphs(){
  var W = innerW(), H = innerH();
  var gx = Math.max(10, W * 0.035);
  ctx.strokeStyle = PAL.glyph; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
  var marks = ["eye", "arcs", "diamond", "ring"];
  for (var i = 0; i < 4; i++){
    var gy = H * (0.30 + i * 0.115), s = Math.max(6, W * 0.013);
    ctx.beginPath();
    if (marks[i] === "eye"){                       /* triangle + eye */
      ctx.moveTo(gx, gy - s); ctx.lineTo(gx + s, gy + s*0.8); ctx.lineTo(gx - s, gy + s*0.8);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(gx, gy + s*0.25, s*0.30, 0, 6.2832); ctx.stroke();
      /* NAMED, NOT A MYSTERY (owner, Nov 20, 2026): the triangle
         over the horizon is THE EYE — the SEE mark of the mesh
         model, first leg on the panel below. It carries its name
         in the same dim glyph hand so it reads as what it is. */
      ctx.fillStyle = PAL.glyph;
      ctx.font = "600 " + Math.max(7, W * 0.019) + "px ui-monospace, Menlo, Consolas, monospace";
      ctx.fillText("THE EYE · SEE", gx + s + 5, gy + s * 0.35);
    } else if (marks[i] === "arcs"){               /* signal arcs */
      for (var a = 1; a <= 3; a++){
        ctx.beginPath(); ctx.arc(gx - s*0.7, gy + s*0.7, a * s * 0.42, -1.25, -0.32); ctx.stroke();
      }
      ctx.fillStyle = PAL.glyph;
      ctx.beginPath(); ctx.arc(gx - s*0.7, gy + s*0.7, 1.4, 0, 6.2832); ctx.fill();
    } else if (marks[i] === "diamond"){
      ctx.moveTo(gx, gy - s); ctx.lineTo(gx + s*0.72, gy); ctx.lineTo(gx, gy + s); ctx.lineTo(gx - s*0.72, gy);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx, gy - s*0.45); ctx.lineTo(gx, gy + s*0.45); ctx.stroke();
    } else {                                       /* ring + post */
      ctx.beginPath(); ctx.arc(gx, gy, s*0.78, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = PAL.glyph;
      ctx.beginPath(); ctx.arc(gx, gy, 1.6, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

var clockEl = document.getElementById("clock");
var secEl = document.getElementById("secLine");
var dateEl = document.getElementById("dateBox");
var gpsEl = document.getElementById("gpsLine");
var gpsMainEl = document.getElementById("gpsMain");
var gpsWhyEl = document.getElementById("gpsWhy");
var DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
var MONS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function fmt2(n){ return (n < 10 ? "0" : "") + n; }
function fmt3(n){ return (n < 10 ? "00" : n < 100 ? "0" : "") + n; }
var lastClockStr = "", lastDateStr = "", lastSecMs = -1;
function drawClock(now){
  var cs = fmt2(now.getHours()) + ":" + fmt2(now.getMinutes());
  if (cs !== lastClockStr){ clockEl.textContent = cs; lastClockStr = cs; }
  var sm = now.getSeconds() * 1000 + now.getMilliseconds();
  if (sm !== lastSecMs){
    secEl.textContent = "SEC " + fmt2(now.getSeconds()) + " · " + fmt3(now.getMilliseconds()) + " MS";
    lastSecMs = sm;
  }
  var ds = DAYS[now.getDay()] + " " + MONS[now.getMonth()] + " " + fmt2(now.getDate());
  if (ds !== lastDateStr){ dateEl.textContent = ds; lastDateStr = ds; }
}

/* ---------------- GPS — a line, never a gate ----------------
   Real fix only, from the host's own geolocation. Denied,
   unavailable or timed out -> the honest empty state stays.
   Coordinates are never invented. */
var gpsState = { mode: "none" };
if (navigator.geolocation){
  gpsState.mode = "seeking";
  gpsMainEl.textContent = "GPS — SEEKING";
  try {
    navigator.geolocation.watchPosition(function(p){
      gpsState = { mode: "fix",
        lat: p.coords.latitude, lon: p.coords.longitude,
        acc: Math.round(p.coords.accuracy || 0) };
    }, function(){
      if (gpsState.mode !== "fix"){ gpsState = { mode: "denied" }; }
    }, { enableHighAccuracy: false, maximumAge: 30000, timeout: 20000 });
  } catch (e) { gpsState = { mode: "none" }; }
}
function drawGps(){
  var txt;
  if (gpsState.mode === "fix"){
    txt = "GPS " + gpsState.lat.toFixed(3) + ", " + gpsState.lon.toFixed(3) +
          " ±" + gpsState.acc + "M";
  } else if (gpsState.mode === "seeking"){ txt = "GPS — SEEKING"; }
  else if (gpsState.mode === "denied"){ txt = "GPS — NO FIX"; }
  else { txt = "GPS — NO FIX"; }
  if (gpsMainEl.textContent !== txt) gpsMainEl.textContent = txt;
  /* The plain-words line rides exactly as long as there is no
     fix to report; a real fix retires it. */
  var whyDisplay = gpsState.mode === "fix" ? "none" : "";
  if (gpsWhyEl.style.display !== whyDisplay) gpsWhyEl.style.display = whyDisplay;
}

/* ================================================================
   THE ALWAYS-LIVE DRIVER — no governor, no REST, no observe
   gate, no auto-exit. Battery care is the DIM ONLY, below.
   ================================================================ */
var state = "live", raf = 0, driverStart = 0, lastMs = -1, elapsed = 0;
window.__faceRest = false;
window.__driverFault = null;
var lastInteract = performance.now();
function noteInteract(){ lastInteract = performance.now(); }
var dimEl = document.getElementById("dim");
setInterval(function(){
  dimEl.style.opacity = ((performance.now() - lastInteract) > 60000) ? "0.45" : "0";
}, 1000);

function refreshBench(now, nowMs){
  window.__globe = {
    shape: SHAPE,
    clock: fmt2(now.getHours()) + ":" + fmt2(now.getMinutes()) + ":" + fmt2(now.getSeconds()),
    clockMs: now.getMilliseconds(),
    phase: +(((now.getSeconds() % 60) + now.getMilliseconds() / 1000) / 60).toFixed(4),
    drones: drones.map(function(d){
      return { i: d.i, x: +d.x.toFixed(1), y: +d.y.toFixed(1), tag: droneTag(d) };
    }),
    bucket: bucket.length,
    gps: gpsState.mode,
    backdrop: window.__backdrop ? window.__backdrop.name : null,
    callCast: window.__callCast || null,
    readout: window.__readout ? window.__readout.mode : null,
    meshLegs: bucket.length ? "STATE" : "NO STATE",
    frameOn: window.__apexFrame ? window.__apexFrame.on : null,
    rest: window.__faceRest
  };
  window.__state = { t: +elapsed.toFixed(2), state: state,
                     driverFault: window.__driverFault, clock: window.__globe.clock };
}
function frameBody(nowMs){
  /* canvas guard: if the backing ever disagrees with the current
     coordinate map (a resize the debounce has not landed yet),
     re-derive it before drawing */
  if (cv.width !== innerW() || cv.height !== innerH()) sizeStage();
  var now = new Date();
  var t = nowMs / 1000;
  ctx.clearRect(0, 0, innerW(), innerH());
  drawGlyphs();
  for (var i = 0; i < drones.length; i++){
    var d = drones[i];
    var p = dronePos(d, t);
    d.vx = (p[0] - d.x) * 60; d.vy = (p[1] - d.y) * 60;
    d.x = p[0]; d.y = p[1];
    d.trail.push([d.x, d.y]);
    if (d.trail.length > 26) d.trail.shift();
  }
  for (var j = 0; j < drones.length; j++) drawDrone(drones[j], t, nowMs);
  drawPulse(now, nowMs);
  drawAnalog(now);
  drawMeshPanel();
  drawClock(now);
  drawGps();
  refreshBench(now, nowMs);
}
var faultEl = document.getElementById("fault");
function frame(nowMs){
  if (lastMs < 0){ lastMs = nowMs; driverStart = nowMs; }
  elapsed = (nowMs - driverStart) / 1000;
  try { frameBody(nowMs); }
  catch (err){
    window.__driverFault = { message: String(err && err.message || err), t: +elapsed.toFixed(2) };
    faultEl.textContent = "DRIVER FAULT — " + window.__driverFault.message;
    faultEl.style.display = "block";
    if (raf) cancelAnimationFrame(raf); raf = 0;
    return;
  }
  raf = requestAnimationFrame(frame);
}
window.ApexFace = {
  observe: function(){ noteInteract(); },
  rest: function(){ noteInteract(); },
  toggle: function(){ noteInteract(); },
  state: function(){ return "live"; }
};
["pointerdown","touchstart","keydown"].forEach(function(ev){
  window.addEventListener(ev, function(){ noteInteract(); }, true);
});
window.addEventListener("focus", function(){ noteInteract(); });
document.addEventListener("visibilitychange", function(){ if (!document.hidden) noteInteract(); });

/* ---- Boot: size from measured pixels, seed the patrol, THE
   DRIVER STARTS NOW, unconditionally — first paint already has
   drones in the air and the pulse running. */
sizeStage();
if (window.__applyFrame) window.__applyFrame();
seedDrones();
raf = requestAnimationFrame(frame);
</script>
</body>
