<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#050d09" />
    <title>Apex Signal</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050d09;
        color: #8ef7c6;
        font-family: "Share Tech Mono", "Courier New", ui-monospace, monospace;
      }
      body {
        display: grid;
        place-items: center;
        padding: 20px;
      }
      main {
        width: min(100%, 360px);
        border: 1px solid #14432c;
        background: rgba(5, 13, 9, 0.94);
        padding: 20px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #00ff88;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.5;
        font-size: 12px;
      }
      a {
        color: #00eeff;
      }
      .chip {
        display: inline-block;
        margin: 4px 6px 0 0;
        border: 1px solid #1f6b52;
        padding: 4px 6px;
        color: #8ef7c6;
        text-decoration: none;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apex Signal</h1>
      <p>The Android shell loads the live Lovable app from tinyradr.lovable.app.</p>
      <p>If the network is down, reconnect and reopen the app.</p>
      <a class="chip" href="https://tinyradr.lovable.app">open live app</a>
      <a class="chip" href="https://tinyradr.lovable.app/downloads">downloads</a>
      <a class="chip" href="https://tinyradr.lovable.app/privacy">privacy</a>
    </main>
  </body>
</html>
