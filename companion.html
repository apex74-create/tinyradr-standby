<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion Squad · Parent</title>
<meta name="description" content="Pair with a wrist companion: talk to the watch, read texts back, see both spots on the map.">
<meta property="og:title" content="Apex Companion · Parent Device">
<meta property="og:description" content="Private paired-device communication, text and opt-in shared positions.">
<meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icons/wristcb-192.png">
<style>
html,body{margin:0;height:100%;background:#000;color:#ffb000;font:15px/1.3 monospace;overflow:hidden}
#map{position:fixed;inset:0;overflow:hidden;background:#111}#map:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);pointer-events:none}
.dot{position:absolute;transform:translate(-50%,-50%);min-width:14px;height:16px;border-radius:8px;background:#ffb000;border:2px solid #000;font-size:11px;color:#000;padding:0 4px;line-height:16px;white-space:nowrap}
.dot.peer{background:#3cf}
.attr{position:absolute;right:4px;bottom:2px;font-size:10px;color:#aaa}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box;max-width:520px;pointer-events:none}
#ui>*{pointer-events:auto}
.card{background:rgba(0,0,0,.78);border:1px solid #333;border-radius:10px;padding:8px}
button{font:inherit;background:#000;color:#ffb000;border:2px solid #ffb000;border-radius:8px;padding:10px;cursor:pointer}
#found button{display:block;width:100%;margin-top:6px;border-color:#3cf;color:#3cf}
#log{flex:1;overflow:auto;min-height:80px}
#log div{padding:3px 0;border-bottom:1px solid #222;color:#fff}
#talk{font-size:20px;padding:18px;width:100%}
#talk.on{background:#ffb000;color:#000}
#row{display:flex;gap:6px}#row button{flex:1}
#pairbox #row button{padding:6px;font-size:11px;border-color:#555;color:#888}
#pairbox #row button.on{border-color:#3cf;color:#3cf}
</style><link rel="stylesheet" href="/companion-layout.css?v=4"></head><body>
<div id="map"></div>
<div id="ui">
  <div class="card"><b>COMPANION SQUAD</b> · <span id="st">STARTING…</span><div id="seen"></div></div>
  <div class="card" id="pairbox">
    <button id="pairtoggle" style="width:100%;padding:6px;font-size:12px">PAIR A DEVICE ▾</button>
    <div id="pairpanel" style="display:none;margin-top:6px">
      <div id="row" style="margin-bottom:6px"><button id="rparent" class="on">I'M THE PARENT</button><button id="rwatch">I'M THE COMPANION</button></div>
      <button id="big">SEARCH</button><div id="found"></div>
      <small>Both devices tap SEARCH. Check the 3-digit code matches, then either side taps PAIR.</small>
    </div></div>
  <div class="card" id="log"></div>
  <div class="card" id="ctl">
    <button id="talk">HOLD TO TALK</button>
    <div id="row" style="margin-top:6px"><input id="txt" placeholder="Text the watch…" style="flex:2;font:inherit;background:#111;color:#fff;border:1px solid #ffb000;border-radius:6px;padding:8px"><button id="send">SEND</button></div>
    <div id="row" style="margin-top:6px"><button id="spot">SHARE MY SPOT</button><button id="unp">UNPAIR</button></div>
  </div>
</div>
<script src="/companion-range.js?v=2"></script>
<script src="/companion-local.js?v=1"></script>
<script src="/companion-core.js?v=7"></script>
<script src="/companion-voice.js?v=1"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},mine=null,peer=null,geo=null,lastSent=0;
var draw=CompMap($("map"));
var voice=CompVoice($("talk"),log);
function redraw(){var p=Comp.paired();CompRange.spots(mine,peer);draw([mine&&{lat:mine.lat,lon:mine.lon,label:"ME"},peer&&{lat:peer.lat,lon:peer.lon,cls:"peer",label:p?p.peerCall:"WATCH"}],CompRange.mapKm());
  $("seen").textContent=peer?"Watch seen "+compAgo(peer.at)+" · ±"+Math.round(peer.acc||0)+" m":(p?"Waiting for the watch to share its spot":"")}
function log(t){var d=document.createElement("div");d.textContent=new Date().toLocaleTimeString()+"  "+t;$("log").appendChild(d);$("log").scrollTop=1e9}
function ui(){var p=Comp.paired();$("pairbox").style.display=p?"none":"block";$("ctl").style.display="block";$("txt").placeholder=p?"Text the watch…":"Pair first, then text…"}
$("pairtoggle").onclick=function(){var pn=$("pairpanel"),open=pn.style.display!=="none";pn.style.display=open?"none":"block";$("pairtoggle").textContent=open?"PAIR A DEVICE ▾":"PAIR A DEVICE ▴"};
setInterval(redraw,15000);
window.addEventListener('comp-range-change',redraw);window.addEventListener('resize',redraw);
Comp.init({role:"parent",on:{
  status:function(s){$("st").textContent=s},
  found:function(p){var b=document.createElement("button");b.textContent="PAIR "+p.call+" · CODE "+p.code;b.onclick=function(){b.textContent="PAIRING…";Comp.pairWith(p.id)};$("found").appendChild(b)},
  paired:function(p){$("found").innerHTML="";ui();log("Paired with "+p.peerCall)},
  text:function(o){log(o.call+": "+o.body);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}},
  voice:voice.receive,
  pos:function(o){peer=o;redraw()}
}}).then(ui);
$("big").onclick=function(){$("found").innerHTML="";Comp.search()};
function setRole(r){Comp.setRole(r);$("rparent").className=r==="parent"?"on":"";$("rwatch").className=r==="watch"?"on":""}
$("rparent").onclick=function(){setRole("parent")};$("rwatch").onclick=function(){setRole("watch")};setRole("parent");
$("unp").onclick=function(){Comp.unpair();peer=null;ui();redraw()};
function sendTxt(){var v=$("txt").value.trim();if(!v)return;Comp.send("text",{body:v}).then(function(ok){log(ok?"ME: "+v:"NOT SENT · OFFLINE")});$("txt").value=""}
$("send").onclick=sendTxt;$("txt").addEventListener("keydown",function(e){if(e.key==="Enter")sendTxt()});
$("spot").onclick=function(){
  if(geo!==null){navigator.geolocation.clearWatch(geo);geo=null;$("spot").textContent="SHARE MY SPOT";return}
  $("spot").textContent="STOP SHARING";
  geo=navigator.geolocation.watchPosition(function(p){mine={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};redraw();
    mine.at=Date.now();CompRange.spots(mine,peer);if(Date.now()-lastSent>30000){lastSent=Date.now();Comp.send("pos",mine)}},function(e){log("GPS: "+e.message)},{enableHighAccuracy:true,maximumAge:15000});
};
redraw();
})();
</script>
</body></html>
